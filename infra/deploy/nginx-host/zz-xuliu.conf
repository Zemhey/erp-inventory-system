limit_req_zone $binary_remote_addr zone=erp_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name xuliu.zemworld.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xuliu.zemworld.cn;

    ssl_certificate     /etc/nginx/cert/xuliu.zemworld.cn.pem;
    ssl_certificate_key /etc/nginx/cert/xuliu.zemworld.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSLxuliu:10m;

    client_max_body_size 10m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ~ ^/(actuator|swagger-ui|v3/api-docs) { return 404; }

    location = /api/v1/auth/login {
        limit_req zone=erp_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 下载区：作品集页面「下载」区块那五个包住在这里（个人 2C2G 机器，带宽有限，
    # 80MB 的 PC 便携包拉满约几分钟，属预期）。开 autoindex 是为了不装主页也能直接取文件。
    # 只放静态文件，不给任何脚本执行路径；目录里不要放 .env 之类（这是公开可读的）。
    location /dl/ {
        alias /var/www/downloads/;
        autoindex on;
        default_type application/octet-stream;
        charset off;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}