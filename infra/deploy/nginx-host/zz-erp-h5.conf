# m.zemworld.cn —— 移动端 H5 站点（uni-app build:h5 产物，接口相对地址同源反代）
#
# 依赖 zz-xuliu.conf 里定义的 limit_req_zone erp_login：两个站点打的是同一个后端登录接口，
# 限速必须同一份，否则 m 就成了 xuliu 之外的第二个爆破入口。
# 删 zz-xuliu.conf 之前要先把那行 zone 搬过来，否则 nginx -t 会报 unknown limit zone。

server {
    listen 80;
    listen [::]:80;
    server_name m.zemworld.cn;

    # 证书签发与续期用（HTTP-01），必须在 301 之前，且不能被跳转吃掉
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name m.zemworld.cn;

    ssl_certificate     /etc/nginx/cert/m.zemworld.cn.pem;
    ssl_certificate_key /etc/nginx/cert/m.zemworld.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSLm:10m;

    root /var/www/erp-h5;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 10m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # 宿主 nginx.conf 里没有 gzip，而移动端首屏要拉 260KB 的入口 JS；手机上不开压缩等于多等一网段
    # 两种 JS 类型都要写：nginx 的 mime.types 把 .js 映射成 text/javascript，
    # 只写 application/javascript 时入口包实测不压缩（259KB 原样下发）。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/javascript application/javascript text/css text/plain application/json image/svg+xml;

    # 管理面一律不暴露（与 xuliu 同一口径）
    location ~ ^/(actuator|swagger-ui|v3/api-docs) { return 404; }

    location = /api/v1/auth/login {
        limit_req zone=erp_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # H5 产物里是相对地址 /api/v1，靠这里转发到云裳后端；同源成立所以不需要 CORS
    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:18080/readyz;
    }

    # uni-app H5 是 hash 路由，这条回落只是给直接敲路径的人兜底，不做服务端渲染
    #
    # 缓存口径与容器里的 frontend/web/nginx.conf 保持一致，且**只用 expires 不用 add_header**：
    # location 里一出现 add_header 就会覆盖 server 级的 X-Robots-Tag 继承。
    #   - HTML 必须 no-cache：否则换版后浏览器按启发式缓存继续给旧 index.html，
    #     旧文件名指向的旧包被打进屏幕，看起来就是"部署上去的还是旧版本"。
    #   - /assets/ 文件名带内容 hash，可以放 30 天；缺失时必须 404，
    #     不能回落到 index.html（200 + text/html 当 JS 用，浏览器只会报一个看不懂的 MIME 错）。
    location = /index.html {
        expires -1;
    }

    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
