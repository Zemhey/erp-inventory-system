server {
    listen 80;
    listen [::]:80;
    server_name lancang.zemworld.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lancang.zemworld.cn;

    ssl_certificate     /etc/nginx/cert/lancang.zemworld.cn.pem;
    ssl_certificate_key /etc/nginx/cert/lancang.zemworld.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSLlancang:10m;

    root /var/www/lancang-demo;
    index index.html;
    charset utf-8;
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ~* \.(json|js|css|svg|png|jpe?g|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}