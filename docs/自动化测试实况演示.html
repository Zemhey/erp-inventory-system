<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>自动化测试实况演示 · E2E-13 库存页三个数字正确</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#12161f; --panel2:#0d1117; --border:#232a36;
    --text:#e6e9ef; --muted:#8b93a7; --dim:#5b6478;
    --green:#34d399; --blue:#60a5fa; --amber:#fbbf24; --red:#f87171; --violet:#a78bfa;
    --code-bg:#0d1117;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 20% -10%, #16203a 0%, var(--bg) 55%) fixed;
    color:var(--text);
    font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,Roboto,sans-serif;
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1320px;margin:0 auto;padding:18px 20px 96px}

  /* ── header ── */
  header.top{margin-bottom:16px}
  .brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo-badge{
    width:42px;height:42px;border-radius:12px;
    background:linear-gradient(135deg,#34d399,#3b82f6);
    display:grid;place-items:center;font-size:22px;box-shadow:0 6px 20px rgba(52,211,153,.25);
  }
  .brand h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px}
  .brand .sub{color:var(--muted);font-size:13px;margin-top:3px}
  .pill{margin-left:auto;font-size:12px;color:var(--amber);border:1px solid rgba(251,191,36,.35);
    background:rgba(251,191,36,.08);padding:5px 10px;border-radius:999px;white-space:nowrap}
  .progress-wrap{display:flex;align-items:center;gap:12px;margin-top:14px}
  .progress{flex:1;height:8px;background:#1b2230;border-radius:999px;overflow:hidden}
  .progress > i{display:block;height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,#34d399,#60a5fa);transition:width .35s ease}
  .progress-txt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

  /* ── layout ── */
  .main{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);
    grid-template-rows:auto auto;gap:16px}
  .code-panel{grid-column:1;grid-row:1;height:558px}
  .console-panel{grid-column:1;grid-row:2;height:262px}
  .browser-panel{grid-column:2;grid-row:1;height:398px}
  .explain-panel{grid-column:2;grid-row:2;height:422px;overflow:auto}

  .panel{background:linear-gradient(180deg,var(--panel),#0f131c);
    border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;
    overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .panel-head{display:flex;align-items:center;gap:8px;padding:10px 14px;
    border-bottom:1px solid var(--border);font-size:12.5px;color:var(--muted);
    background:rgba(255,255,255,.015);flex-shrink:0}
  .panel-head .dot3{display:inline-flex;gap:5px;margin-right:4px}
  .panel-head .dot3 i{width:9px;height:9px;border-radius:50%;display:block}
  .panel-head .dot3 i:nth-child(1){background:#ff5f57}
  .panel-head .dot3 i:nth-child(2){background:#febc2e}
  .panel-head .dot3 i:nth-child(3){background:#28c840}
  .panel-head .fname{color:#cfd6e4;font-weight:600;font-family:Consolas,monospace;font-size:12.5px}
  .panel-head .tag{color:var(--dim);margin-left:2px}
  .panel-head .right{margin-left:auto;display:flex;gap:6px}

  /* ── code ── */
  .code{flex:1;overflow:auto;padding:8px 0;font-family:"JetBrains Mono",Consolas,"Courier New",monospace;
    font-size:12.6px;line-height:1.78;background:var(--code-bg)}
  .code::-webkit-scrollbar{width:9px}
  .code::-webkit-scrollbar-thumb{background:#242c3a;border-radius:8px}
  .code-line{display:flex;padding:0 12px 0 0;white-space:pre;transition:background .2s}
  .code-line .ln{width:42px;flex-shrink:0;text-align:right;padding-right:14px;color:#3b4456;
    user-select:none;font-size:11.5px;position:relative}
  .code-line .code-txt{flex:1;color:#c8d0dd}
  .code-line.active{background:rgba(96,165,250,.14)}
  .code-line.active .ln{color:#8fb6ff}
  .code-line.active .ln::after{content:"";position:absolute;left:0;top:0;bottom:0;
    width:2px;background:#60a5fa}
  .code-line.done .code-txt{color:#6b7688}
  .code-line.done .ln{color:#374052}
  .tok-com{color:#5f6b7f;font-style:italic}
  .tok-str{color:#a5e6a0}
  .tok-kw{color:#c792ea}
  .tok-num{color:#f6c177}

  /* ── console ── */
  .console{flex:1;overflow:auto;padding:10px 14px;font-family:"JetBrains Mono",Consolas,monospace;
    font-size:12.2px;line-height:1.62}
  .console::-webkit-scrollbar{width:9px}
  .console::-webkit-scrollbar-thumb{background:#242c3a;border-radius:8px}
  .log{display:flex;gap:8px;padding:2px 0;animation:fade .3s ease}
  .log .ic{width:15px;flex-shrink:0;text-align:center}
  .log.api .ic{color:var(--blue)} .log.api .tx{color:#b9c6db}
  .log.ok  .ic{color:var(--green)} .log.ok .tx{color:#a7f3d0}
  .log.assert .ic{color:var(--green)} .log.assert .tx{color:#a7f3d0;font-weight:600}
  .log.info .ic{color:var(--muted)} .log.info .tx{color:#8b93a7}
  .log.err .ic{color:var(--red)} .log.err .tx{color:#fca5a5}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* ── browser ── */
  .browser{flex:1;display:flex;flex-direction:column;background:#eef1f6;position:relative;overflow:hidden}
  .browser-bar{display:flex;align-items:center;gap:10px;background:#dde2ea;padding:8px 12px;
    border-bottom:1px solid #cbd2dd;flex-shrink:0}
  .browser-bar .lights{display:flex;gap:6px}
  .browser-bar .lights i{width:10px;height:10px;border-radius:50%;display:block}
  .browser-bar .lights i:nth-child(1){background:#ff5f57}
  .browser-bar .lights i:nth-child(2){background:#febc2e}
  .browser-bar .lights i:nth-child(3){background:#28c840}
  .browser-url{flex:1;background:#fff;border:1px solid #cbd2dd;border-radius:7px;
    padding:5px 12px;font-size:12px;color:#4a5568;font-family:Consolas,monospace;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .viewport{flex:1;overflow:auto;position:relative;background:#f8fafc}

  .blank{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#94a3b8;gap:8px;text-align:center;padding:20px}
  .blank .bicon{font-size:34px;opacity:.5}
  .blank p{margin:0;font-size:15px;color:#64748b;font-weight:600}
  .blank span{font-size:12.5px;color:#94a3b8}
  .blank .note{margin-top:10px;font-size:12px;color:#0369a1;background:#e0f2fe;
    border:1px solid #bae6fd;border-radius:8px;padding:7px 12px;max-width:340px}

  .erp{padding:0;color:#1e293b;font-family:"Microsoft YaHei",system-ui,sans-serif}
  .erp-top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;
    border-bottom:1px solid #e2e8f0}
  .erp-top .logo{background:linear-gradient(135deg,#34d399,#3b82f6);color:#fff;font-weight:800;
    font-size:12px;padding:4px 9px;border-radius:7px}
  .erp-top .t{font-weight:700;font-size:13.5px;color:#0f172a}
  .erp-top .sp{flex:1}
  .erp-top .user{font-size:12px;color:#64748b}
  .erp-sub{padding:10px 16px 4px;font-size:12px;color:#64748b}
  table.inv{width:calc(100% - 20px);margin:8px 10px 0;border-collapse:collapse;font-size:11.2px;background:#fff;
    border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;table-layout:fixed}
  table.inv th:first-child{width:32%}
  table.inv th:nth-child(2){width:22%}
  table.inv th:nth-child(3){width:10%}
  table.inv th:nth-child(4){width:8%}
  table.inv th:nth-child(5),table.inv th:nth-child(6),table.inv th:nth-child(7),table.inv th:nth-child(8){width:7%}

    border-bottom:1px solid #e2e8f0;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  table.inv th.num,table.inv td.num{text-align:right}
  table.inv td{padding:8px 7px;border-bottom:1px solid #f1f5f9;color:#334155;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}

  table.inv td .sku-code{font-size:10.5px;color:#94a3b8;margin-top:2px}

  .inv-row{transition:background .25s, box-shadow .25s;position:relative}
  .inv-row.hl-row{background:#fefce8;box-shadow:inset 0 0 0 2px #fbbf24}
  .inv-row.hl-visible{background:#ecfdf5;box-shadow:inset 0 0 0 2px #34d399}
  table.inv td.hl-cell{background:#dcfce7;color:#047857;font-weight:800;box-shadow:inset 0 0 0 2px #34d399}
  .qty-chips{display:flex;gap:8px;margin:12px;flex-wrap:wrap}
  .qty-chip{flex:1;min-width:92px;background:#fff;border:1px solid #e2e8f0;border-radius:9px;
    padding:8px 12px;font-size:11.5px;color:#64748b}
  .qty-chip b{display:block;font-size:19px;color:#0f172a;margin-top:2px;font-variant-numeric:tabular-nums}
  .qty-chip.onhand b{color:#0f766e} .qty-chip.reserved b{color:#b45309} .qty-chip.available b{color:#1d4ed8}
  .pass-banner{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:9;
    background:linear-gradient(135deg,#059669,#10b981);color:#fff;border-radius:11px;
    padding:10px 18px;font-size:13px;font-weight:700;box-shadow:0 10px 26px rgba(5,150,105,.4);
    display:flex;align-items:center;gap:10px;animation:pop .45s cubic-bezier(.2,1.3,.5,1)}
  .pass-banner span{background:rgba(255,255,255,.22);padding:3px 9px;border-radius:7px;font-family:Consolas,monospace}
  @keyframes pop{from{opacity:0;transform:translate(-50%,-10px) scale(.9)}to{opacity:1;transform:translate(-50%,0) scale(1)}}

  /* ── explain ── */
  .explain-panel .inner{padding:16px 18px}
  .step-badge{display:inline-block;font-size:11.5px;color:#8fb6ff;background:rgba(96,165,250,.12);
    border:1px solid rgba(96,165,250,.3);padding:3px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
  .explain-panel h2{font-size:17px;margin:9px 0 14px;font-weight:700;line-height:1.35}
  .block{margin-bottom:12px}
  .block .bh{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px;letter-spacing:.3px}
  .block p{margin:0;font-size:13.4px;line-height:1.7;color:#cdd5e2}
  .block.why{border-left:2px solid var(--amber);background:rgba(251,191,36,.05);
    padding:8px 12px;border-radius:0 8px 8px 0}
  .names{margin-top:6px;border-top:1px dashed var(--border);padding-top:12px}
  .chips{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .chip{display:flex;gap:10px;align-items:flex-start;font-size:12.8px;line-height:1.55}
  .chip code{flex-shrink:0;background:#1b2230;color:#7dd3fc;border:1px solid #2a3444;
    padding:2px 8px;border-radius:6px;font-family:Consolas,monospace;font-size:12px;min-width:96px;
    display:inline-block}
  .chip span{color:#aab4c5}

  /* ── nav ── */
  footer.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:rgba(13,17,24,.92);backdrop-filter:blur(10px);border-top:1px solid var(--border);
    padding:11px 20px;display:flex;align-items:center;gap:14px;justify-content:center}
  .btn{border:1px solid var(--border);background:#1a2130;color:#dfe5ef;border-radius:10px;
    padding:10px 20px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.18s;display:flex;
    align-items:center;gap:7px;font-family:inherit}
  .btn:hover:not(:disabled){background:#232c3d;transform:translateY(-1px)}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn.primary{background:linear-gradient(135deg,#10b981,#3b82f6);border:none;color:#fff;
    box-shadow:0 6px 18px rgba(59,130,246,.3)}
  .btn.primary:hover:not(:disabled){filter:brightness(1.08)}
  .dots{display:flex;gap:6px;margin:0 8px}
  .dots i{width:8px;height:8px;border-radius:50%;background:#28313f;transition:.2s}
  .dots i.on{background:linear-gradient(135deg,#34d399,#60a5fa);transform:scale(1.25)}
  .footer-hint{font-size:11.5px;color:var(--dim);position:absolute;right:20px;bottom:14px}
  @media (max-width:1000px){
    .main{grid-template-columns:1fr;grid-template-rows:auto}
    .code-panel{grid-column:1;grid-row:1;height:460px}
    .console-panel{grid-column:1;grid-row:2;height:240px}
    .browser-panel{grid-column:1;grid-row:3;height:400px}
    .explain-panel{grid-column:1;grid-row:4;height:auto;max-height:none}
    .footer-hint{display:none}
    .dots{display:none}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo-badge">🧪</div>
      <div>
        <h1>自动化测试实况演示 · E2E-13</h1>
        <div class="sub">库存页三个数字正确（实存 / 预占 / 可用） · 文件 <code style="color:#7dd3fc">frontend/web/e2e/05-inventory.spec.ts</code></div>
      </div>
      <div class="pill">模拟演示 · 非真实连库</div>
    </div>
    <div class="progress-wrap">
      <div class="progress"><i id="bar"></i></div>
      <div class="progress-txt" id="ptxt">0 / 0</div>
    </div>
  </header>

  <div class="main">
    <section class="panel code-panel">
      <div class="panel-head">
        <span class="dot3"><i></i><i></i><i></i></span>
        <span class="fname">05-inventory.spec.ts</span>
        <span class="tag">TypeScript · Playwright</span>
        <span class="right"><span class="tag" id="codeState">等待执行</span></span>
      </div>
      <div class="code" id="code"></div>
    </section>

    <section class="panel console-panel">
      <div class="panel-head">运行日志 · 接口调用与断言</div>
      <div class="console" id="console"></div>
    </section>

    <section class="panel browser-panel">
      <div class="panel-head">被测系统 · 模拟浏览器</div>
      <div class="browser">
        <div class="browser-bar">
          <span class="lights"><i></i><i></i><i></i></span>
          <div class="browser-url" id="url">about:blank</div>
        </div>
        <div class="viewport" id="viewport"></div>
      </div>
    </section>

    <section class="panel explain-panel">
      <div class="inner" id="explain"></div>
    </section>
  </div>

  <footer class="nav">
    <button class="btn" id="prev">← 上一步</button>
    <div class="dots" id="dots"></div>
    <button class="btn primary" id="next">下一步 →</button>
    <button class="btn" id="reset">↻ 重新开始</button>
    <span class="footer-hint">提示：也可用键盘 ← → 翻页</span>
  </footer>
</div>

<script>
/* ============ 固定数据：让整个演示的 id 前后一致 ============ */
const RUN_ID = 'E2E-MF3K2P-AB12';
const TAG = RUN_ID + '-13';
const PRODUCT = TAG + ' 商品';
const WAREHOUSE = TAG + ' 仓库';
const SKU_TEXT = PRODUCT + ' · 白色-L';

/* ============ 被演示的完整测试文件（30 行） ============ */
const CODE = [
  "import { expect, test } from './fixtures'",
  "import { runTag } from './helpers/run'",
  "import { seedBase } from './helpers/seed'",
  "",
  "test('E2E-13 库存页三个数字正确（实存 / 预占 / 可用）', async ({ page, api, run }) => {",
  "  const tag = runTag(run, '13')",
  "  const seed = await seedBase(api, tag, { stockQty: 15 })",
  "",
  "  // 建一张未出货的出货单，制造 4 件预占：15 / 4 / 11",
  "  const order = await api.createSalesOrder({",
  "    customerId: seed.customer.id,",
  "    warehouseId: seed.warehouse.id,",
  "    lines: [{ skuId: seed.skus[0].id, qty: 4, unitPriceAmount: 12900, discountRate: 9000 }],",
  "  })",
  "  expect(order.status).toBe('DRAFT')",
  "",
  "  await page.goto('/inventory')",
  "",
  "  const skuText = `${seed.product.name} · 白色-L`",
  "  const row = page.getByRole('row').filter({ hasText: skuText }).first()",
  "  await expect(row).toBeVisible()",
  "",
  "  const cells = row.getByRole('cell')",
  "  await expect(cells).toHaveCount(8)",
  "  await expect(cells.nth(0)).toContainText(skuText)",
  "  await expect(cells.nth(1)).toContainText(seed.warehouse.name)",
  "  await expect(cells.nth(4)).toHaveText('15')",
  "  await expect(cells.nth(5)).toHaveText('4')",
  "  await expect(cells.nth(6)).toHaveText('11')",
  "})"
];

/* ============ 每个「下一步」的讲解数据 ============ */
const STEPS = [
  {
    n: 1, lines: [], sim: 'blank', url: 'about:blank',
    title: '开始之前：我们要验证什么？',
    meaning: '这是一条 Playwright 的 E2E 测试。它只回答一个业务问题：库存页上「实存 / 预占 / 可用」三个数字，对不对？',
    happens: '现在测试还没开始跑。点「下一步」，我们会一行一行执行这条测试。你会同时看到三样东西：左边代码逐行高亮、右上模拟浏览器真的出现页面、右下滚动打印接口调用和断言结果。',
    why: '读任何一条测试，都先把它拆成「前置准备 → 执行操作 → 断言结果」三段，再看代码。这样不会被细节带偏。这条用例正好就是：造数据（前置）→ 打开库存页（操作）→ 断三个数字（断言）。',
    names: [
      { k: 'E2E', v: 'End-to-End，端到端：从用户视角把整条流程真走一遍' },
      { k: '05-inventory', v: '第 5 个测试文件，主题是「库存」' }
    ],
    logs: [{ t: 'info', text: '▶ 准备执行 05-inventory.spec.ts' }]
  },
  {
    n: 2, lines: [1], sim: 'blank', url: 'about:blank',
    title: '第 1 行 · 从 ./fixtures 引入 test 和 expect',
    meaning: 'test 用来「声明一条用例」，expect 用来「写断言」。',
    happens: '加载测试框架。注意它们来自项目自己的 ./fixtures，而不是原生的 @playwright/test。',
    why: 'fixtures.ts 在 Playwright 原生能力上「加了料」——额外提供 api、run 两个夹具（后面第 5 行会用到）。用自己封装过的版本，才拿得到项目专属能力。',
    names: [
      { k: 'test', v: '注册一条测试用例的函数：test(标题, 回调)' },
      { k: 'expect', v: '断言函数：expect(实际值).toBe(预期值)' },
      { k: './fixtures', v: '项目自己的夹具封装文件，比原生多提供 api / run' }
    ],
    logs: [{ t: 'info', text: '加载测试框架（经 ./fixtures 封装）' }]
  },
  {
    n: 3, lines: [2, 3], sim: 'blank', url: 'about:blank',
    title: '第 2–3 行 · 引入两个帮手：runTag 和 seedBase',
    meaning: 'runTag 负责生成「唯一数据前缀」；seedBase 负责「一句话造出一整套主数据」。',
    happens: '把「造数」「打前缀」这些重复动作从测试里抽出去，测试文件只保留业务逻辑。',
    why: '如果不抽出来，每条用例都要手写一遍「造商品 / 仓库 / 客户 / 开进货单」，又长又容易撞数据。抽成 helper，测试就变成「读起来像业务说明」。',
    names: [
      { k: 'runTag', v: '生成本次运行的唯一前缀，防止和别的测试数据撞车' },
      { k: 'seedBase', v: '数据工厂：造供应商/仓库/客户/商品/SKU，并可按需备货' }
    ],
    logs: [{ t: 'info', text: '加载 helpers：runTag / seedBase' }]
  },
  {

/* ============ 语法高亮（逐行） ============ */
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
const KW = /\b(import|from|const|let|var|await|async|function|return|new|if|else|test|expect|true|false)\b/;
function hlLine(line){
  let s = esc(line);
  // 逐 token 替换（注释 → 字符串 → 关键字 → 数字）
  const re = /(\/\/[^\n]*)|('(?:\\.|[^'\\])*'|"(?:\\.|[^"\\])*"|`(?:\\.|[^`\\])*`)|\b(import|from|const|let|var|await|async|function|return|new|if|else|test|expect|true|false)\b|\b(\d+)\b/g;
  return s.replace(re, function(m, com, str, kw, num){
    if (com) return '<span class="tok-com">' + m + '</span>';
    if (str) return '<span class="tok-str">' + m + '</span>';
    if (kw)  return '<span class="tok-kw">' + m + '</span>';
    if (num) return '<span class="tok-num">' + m + '</span>';
    return m;
  });
}

/* ============ 渲染：代码面板 ============ */
const codeEl = document.getElementById('code');
function renderCode(step){
  const active = new Set(step.lines);
  const maxActive = step.lines.length ? Math.max.apply(null, step.lines) : 0;
  let html = '';
  for (let i = 0; i < CODE.length; i++){
    const ln = i + 1;
    let cls = 'code-line';
    if (active.has(ln)) cls += ' active';
    else if (ln < maxActive) cls += ' done';
    html += '<div class="' + cls + '" data-ln="' + ln + '">' +
              '<span class="ln">' + ln + '</span>' +
              '<span class="code-txt">' + (CODE[i] === '' ? '&nbsp;' : hlLine(CODE[i])) + '</span>' +
            '</div>';
  }
  codeEl.innerHTML = html;
  const actEl = codeEl.querySelector('.code-line.active');
  if (actEl){
    codeEl.scrollTop = Math.max(0, actEl.offsetTop - codeEl.clientHeight / 2 + actEl.clientHeight / 2);
  }
}

/* ============ 渲染：控制台 ============ */
const consoleEl = document.getElementById('console');
function renderConsole(cur){
  let html = '';
  for (let i = 0; i <= cur; i++){
    const logs = STEPS[i].logs || [];
    for (const lg of logs){
      const ic = lg.t === 'api' ? '→' : lg.t === 'ok' ? '✓' : lg.t === 'assert' ? '✓' : lg.t === 'err' ? '✕' : '•';
      html += '<div class="log ' + lg.t + '"><span class="ic">' + ic + '</span><span class="tx">' + esc(lg.text) + '</span></div>';
    }
  }
  consoleEl.innerHTML = html;
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

    '<div class="qty-chips">' +
      '<div class="qty-chip onhand">实存<b>15</b></div>' +
      '<div class="qty-chip reserved">预占<b>4</b></div>' +
      '<div class="qty-chip available">可用<b>11</b></div>' +
    '</div>' +
  '</div>';
}

function renderBrowser(step){
  urlEl.textContent = step.url || 'about:blank';
  if (step.sim === 'inventory'){
    viewport.innerHTML = inventoryHtml(step);
  } else {
    viewport.innerHTML = blankHtml(step.blankNote);
  }
  if (step.done){
    viewport.insertAdjacentHTML('beforeend',
      '<div class="pass-banner">✓ E2E-13 通过 · 1 passed <span>15 / 4 / 11</span></div>');
  }
}

/* ============ 渲染：讲解面板 ============ */
const explainEl = document.getElementById('explain');
function renderExplain(step, total){
  const namesHtml = step.names.map(function(n){
    return '<div class="chip"><code>' + esc(n.k) + '</code><span>' + esc(n.v) + '</span></div>';
  }).join('');
  explainEl.innerHTML =
    '<div class="step-badge">第 ' + step.n + ' 步 / 共 ' + total + ' 步</div>' +
    '<h2>' + esc(step.title) + '</h2>' +
    '<div class="block"><div class="bh">📝 这段代码在做什么</div><p>' + esc(step.meaning) + '</p></div>' +
    '<div class="block"><div class="bh">⚙️ 运行到这里发生了什么</div><p>' + esc(step.happens) + '</p></div>' +
    '<div class="block why"><div class="bh">💡 为什么这么设计</div><p>' + esc(step.why) + '</p></div>' +
    '<div class="names"><div class="bh">🔖 名称辞典（每个名字代表什么）</div><div class="chips">' + namesHtml + '</div></div>';
}

/* ============ 总渲染 ============ */
const TOTAL = STEPS.length;
let cur = 0;
const bar = document.getElementById('bar');
const ptxt = document.getElementById('ptxt');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const resetBtn = document.getElementById('reset');
const dotsEl = document.getElementById('dots');
const codeState = document.getElementById('codeState');

function buildDots(){
  let h = '';
  for (let i = 0; i < TOTAL; i++) h += '<i data-i="' + i + '"></i>';
  dotsEl.innerHTML = h;
}
function render(){
  const step = STEPS[cur];
  renderCode(step);
  renderConsole(cur);
  renderBrowser(step);
  renderExplain(step, TOTAL);
  bar.style.width = ((cur + 1) / TOTAL * 100) + '%';
  ptxt.textContent = (cur + 1) + ' / ' + TOTAL;
  prevBtn.disabled = cur === 0;
  nextBtn.disabled = cur === TOTAL - 1;
  nextBtn.textContent = cur === TOTAL - 1 ? '已完成 ✓' : '下一步 →';
  codeState.textContent = step.n === 1 ? '等待执行' : (step.done ? '执行完成 · 通过' : '执行中…');
  Array.prototype.forEach.call(dotsEl.children, function(d, i){
    d.className = i === cur ? 'on' : (i < cur ? 'on' : '');
    d.style.opacity = i < cur ? '.5' : '';
  });
}

nextBtn.addEventListener('click', function(){ if (cur < TOTAL - 1){ cur++; render(); } });
prevBtn.addEventListener('click', function(){ if (cur > 0){ cur--; render(); } });
resetBtn.addEventListener('click', function(){ cur = 0; render(); });
document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight'){ if (cur < TOTAL - 1){ cur++; render(); } }
  else if (e.key === 'ArrowLeft'){ if (cur > 0){ cur--; render(); } }
});

buildDots();
render();
</script>
</body>
</html>
