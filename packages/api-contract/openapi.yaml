  # ─────────────────────────── SYS · 审计与可观测（V2-5 追加式） ───────────────────────────
  /audits:
    get:
      tags: [sys]
      summary: 审计查询（FR-SYS-07，按人/单据/时间/操作类型，只读）
      description: |
        - **只读**：审计表是追加型的，本资源<b>只有 GET</b>；对任何写方法返回 405
          （不会反过来往审计表里写一行）。
        - **四个查询维度可任意组合**：`actorId`/`actorName`（按人）、`bizRefNo`（按单据）、
          `from`/`to`（按时间，**半开区间 [from, to)**）、`action`/`result`（按操作类型与结果）。
        - **时间区间倒置**（`from >= to`）返回 `400 SYS_AUDIT_QUERY_INVALID`，
          而不是静默返回空列表 —— 后者会让人误以为"那天没有操作"。
        - 非法 `action` / `result` 取值同样返回 400，不返回 500。
        - **只读接口不需要 `X-Request-Id`**。权限：`sys:read`（ADMIN / VIEWER / FINANCE）。
        - 数据权限（能否看别人的审计）属 V2-6，本期不做。
      operationId: listAudits
      parameters:
        - name: actorId
          in: query
          schema: { type: integer, format: int64 }
        - name: actorName
          in: query
          schema: { type: string, maxLength: 64 }
        - name: action
          in: query
          description: 审计动作枚举（以 AuditAction 为准）
          schema: { type: string }
        - name: resourceType
          in: query
          schema: { type: string, maxLength: 64 }
        - name: resourceId
          in: query
          schema: { type: string, maxLength: 64 }
        - name: bizRefNo
          in: query
          description: 业务单据号（如 PO20250601-0001）
          schema: { type: string, maxLength: 64 }
        - name: result
          in: query
          schema: { type: string, enum: [SUCCESS, FAIL] }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: 上界**不含**（半开区间），便于按天查询不漏最后一毫秒
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 审计分页列表（按 occurredAt 倒序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiPageResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/AuditLog' }
        '400': { $ref: '#/components/responses/BadRequest' }

        '403':
          description: 缺少 sys:read 权限（IAM_FORBIDDEN）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /audits/{id}:
    get:
