            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /sys-config:
    get:
      tags: [skeleton]
      summary: 系统参数列表（FR-V3-24）
      operationId: listSystemConfig
      parameters:
        - name: group
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 系统参数列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: object, additionalProperties: true }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [skeleton]
      summary: 修改系统参数值（FR-V3-24）
      operationId: updateSystemConfig
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string }
      responses:
        '200':
          description: 更新后的参数
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: object, additionalProperties: true }
        '404':
          description: '`SYS_CONFIG_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /number-rules:
    get:
      tags: [skeleton]
      summary: 单号规则列表（FR-V3-25）
      operationId: listNumberRules
      responses:
        '200':
          description: 单号规则列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: object, additionalProperties: true }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [skeleton]
      summary: 更新单号规则（FR-V3-25）
      operationId: updateNumberRule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prefix]
              properties:
                prefix: { type: string }
                seqLength: { type: integer }
                enabled: { type: boolean }
      responses:
        '200':
          description: 更新后的规则
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: '`SYS_NUMBER_RULE_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [skeleton]
      summary: 预览下一张单号（不消费流水，FR-V3-25）
      operationId: previewNumberRule
      description: |
        - 只读推演，**不消费**流水号：反复预览返回同一个号
        - 约定：写操作统一带 `X-Request-Id`（幂等键），预览虽只读也保持同一约定，
          便于前端复用同一个请求封装
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [docType]
              properties:
                docType: { type: string }
      responses:
        '200':
          description: 预览示例号
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: object, additionalProperties: true }
        '404':
          description: '`SYS_NUMBER_RULE_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /login-logs:
    get:
      tags: [skeleton]
      summary: 登录日志列表（FR-V3-29）
      operationId: listLoginLogs
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        '200':
          description: 登录日志列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: object, additionalProperties: true }
        '403': { $ref: '#/components/responses/Forbidden' }

  /login-logs/online:
    get:
      tags: [skeleton]
      summary: 当前在线用户（最近 N 分钟成功登录，FR-V3-29）
      operationId: onlineLoginLogs
      parameters:
        - name: minutes
          in: query
          schema: { type: integer, default: 30 }
      responses:
        '200':
          description: 在线用户登录日志
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: object, additionalProperties: true }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ═════════════════ V3-2 财务中心（tag: fin，W2 泳道纯追加）═════════════════
  # 金额口径：财务域一律「元」两位小数（简报 §5：numeric(18,2) + BigDecimal，禁 double），
  # 与业务域的「整数分」（ADR-0005）在凭证生成处以 movePointLeft(2) 精确换算。
  /fin/accounts:
    get:
      tags: [fin]
      summary: 会计科目平铺列表（fin:read；新租户首次访问自动补种标准科目模板）
      operationId: listFinAccounts
      responses:
        '200':
          description: items = FinAccount 数组
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
    post:
      tags: [fin]
      summary: 新建科目（fin:account:write；编码在本租户内唯一）
      operationId: createFinAccount
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinAccountCreate' }
      responses:
        '200':
          description: 新建科目
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FinAccount' }
        '409':
          description: FIN_ACCOUNT_DUPLICATED（编码重复）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /fin/accounts/tree:
    get:
      tags: [fin]
      summary: 科目树（一级科目为根，children 递归；页面按 category 六大类分组渲染）
      operationId: getFinAccountTree
      responses:
        '200':
          description: items = 树节点数组（FinAccount + children）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /fin/accounts/{id}:
    put:
      tags: [fin]
      summary: 修改科目（编码与父级创建后不可改；停用被引用科目允许、删除不允许）
      operationId: updateFinAccount
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinAccountUpdate' }
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [fin]
      summary: 删除科目（被凭证分录引用或有子科目 → 409 FIN_ACCOUNT_IN_USE）
      operationId: deleteFinAccount
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '409':
          description: FIN_ACCOUNT_IN_USE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /fin/vouchers:
    get:
      tags: [fin]
      summary: 凭证分页列表（status / sourceType / period / from / to / keyword 过滤）
      operationId: pageFinVouchers
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, AUDITED, POSTED] }
        - name: sourceType
          in: query
          schema: { type: string, enum: [MANUAL, PUR_IN, SAL_OUT, PUR_PAY, SAL_RCV, EXPENSE, INVOICE] }
        - name: period
          in: query
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: keyword, in: query, schema: { type: string }, description: 凭证号 / 来源单号 / 分录摘要 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/PageResponse'
    post:
      tags: [fin]
      summary: 手工录凭证（借贷必须相等；不等 400 FIN_VOUCHER_UNBALANCED，details 带差额）
      description: 落 DRAFT；状态机 DRAFT → AUDITED → POSTED，POSTED 后不可改（只能红冲，下期能力）。
      operationId: createFinVoucher
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinVoucherCreate' }
      responses:
        '200':
          description: 新建凭证（含分录）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FinVoucher' }
        '400':
          description: "FIN_VOUCHER_UNBALANCED（details: totalDebit / totalCredit / diff）或 FIN_VOUCHER_LINE_INVALID"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /fin/vouchers/{id}:
    get:
      tags: [fin]
      summary: 凭证详情（头 + 全部分录）
      operationId: getFinVoucher
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [fin]
      summary: 修改凭证（仅 DRAFT；分录整单替换，借贷平衡校验同 POST）
      operationId: updateFinVoucher
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinVoucherCreate' }
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '409':
          description: FIN_VOUCHER_STATUS_ILLEGAL（非 DRAFT 不可改）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    delete:
      tags: [fin]
      summary: 删除凭证（仅 DRAFT；分录连带清除，跨租户 id 只会得到"未删除"）
      description: |
        V4-1 接驳新增。此前该路径没有 DELETE 方法（405），录错的草稿凭证删不掉。
        只允许 DRAFT：AUDITED / POSTED 一律 409，正解是既有的作废/红冲语义
        （已过账凭证进报表与科目余额，删除会让"期初 + 本期发生 = 期末"不平）。
        由业务单据自动生成的凭证落库即 POSTED，因此天然不可删，应改为冲销来源单据。
        账期已月结锁定时同样拒绝（FIN_PERIOD_CLOSED）。
      operationId: deleteFinVoucher
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            FIN_VOUCHER_DELETE_FORBIDDEN（非草稿不可删，或并发下状态已变）
            / FIN_PERIOD_CLOSED（账期已锁定）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /fin/vouchers/{id}/audit:
    post:
      tags: [fin]
      summary: 审核凭证（DRAFT → AUDITED）
      operationId: auditFinVoucher
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /fin/vouchers/{id}/post:
    post:
      tags: [fin]
      summary: 过账凭证（AUDITED → POSTED；报表只统计 POSTED）
      operationId: postFinVoucher
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /fin/bank-accounts:
    get:
      tags: [fin]
      summary: 银行账户列表（默认账户排首位）
      operationId: listBankAccounts
      responses:
        '200':
          description: items = BankAccount 数组
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
    post:
      tags: [fin]
      summary: 新建银行账户（本租户第一个账户自动成为默认入账账户）
      operationId: createBankAccount
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BankAccountCreate' }
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /fin/bank-accounts/{id}:
    put:
      tags: [fin]
      summary: 修改银行账户（balance 字段是账面余额，手工调整仅初始化时使用）
      operationId: updateBankAccount
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BankAccountUpdate' }
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [fin]
      summary: 删除银行账户（已有日记账流水 → 409，请停用而不是删除）
      operationId: deleteBankAccount
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /fin/bank-accounts/{id}/default:
    post:
      tags: [fin]
      summary: 设为默认账户（同租户其余账户自动取消默认；收付款自动日记账的落点）
      operationId: setDefaultBankAccount
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'

  /fin/cash-journal:
    get:
      tags: [fin]
      summary: 现金/银行日记账（当日余额 = 上日余额 + 借 − 贷，余额逐笔连续）
      operationId: queryCashJournal
      parameters:
        - { name: accountId, in: query, schema: { type: integer, format: int64 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: items = CashJournalEntry 数组（时间倒序，上限 500）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
    post:
      tags: [fin]
      summary: 手工补录日记账（利息 / 银行间调拨等；自动延续余额链并回写账户余额）
      operationId: addCashJournalEntry
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CashJournalCreate' }
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'

  /fin/expenses:
    get:
      tags: [fin]
      summary: 报销单分页（status / keyword 过滤）
      operationId: pageFinExpenses
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, SUBMITTED, APPROVED, PAID] }
        - { name: keyword, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/PageResponse'
    post:
      tags: [fin]
      summary: 新建报销单（明细合计 = 主表金额，落 DRAFT）
      operationId: createFinExpense
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinExpenseCreate' }
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '400':
          description: FIN_EXPENSE_AMOUNT_MISMATCH（明细为空 / 金额非正）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /fin/expenses/{id}:
    get:
      tags: [fin]
      summary: 报销单详情（含明细行）
      operationId: getFinExpense
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [fin]
      summary: 修改报销单（仅 DRAFT；驳回后同样是 DRAFT + rejectReason）
      operationId: updateFinExpense
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinExpenseCreate' }
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [fin]
      summary: 删除报销单（仅 DRAFT）
      operationId: deleteFinExpense
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /fin/expenses/{id}/submit:
    post:
      tags: [fin]
      summary: 提交审批（DRAFT → SUBMITTED）
      operationId: submitFinExpense
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /fin/expenses/{id}/approve:
    post:
      tags: [fin]
      summary: 审批通过（SUBMITTED → APPROVED；权限 fin:expense:approve，与申请人分离）
      operationId: approveFinExpense
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /fin/expenses/{id}/reject:
    post:
      tags: [fin]
      summary: 驳回（SUBMITTED → DRAFT，原因写 reject_reason，必填）
      operationId: rejectFinExpense
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 255 }
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '400':
          description: SYS_VALIDATION_ERROR（原因必填）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /fin/expenses/{id}/pay:
    post:
      tags: [fin]
      summary: 付款（APPROVED → PAID，自动生成凭证 借6602/贷1002 并落银行日记账）
      operationId: payFinExpense
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /fin/invoices:
    get:
      tags: [fin]
      summary: 发票台账分页（type = OUTPUT 销项 / INPUT 进项，页面两个 Tab）
      operationId: pageFinInvoices
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [OUTPUT, INPUT] }
        - name: status
          in: query
          schema: { type: string, enum: [NORMAL, VOID] }
        - { name: keyword, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/PageResponse'
    post:
      tags: [fin]
      summary: 登记发票（可关联进货单/出货单；同一单据累计开票不得超过单据金额）
      operationId: createFinInvoice
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinInvoiceCreate' }
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '409':
          description: "FIN_INVOICE_OVER_AMOUNT（details: docAmount / invoiced / requested / over）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /fin/invoices/{id}:
    get:
      tags: [fin]
      summary: 发票详情
      operationId: getFinInvoice
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [fin]
      summary: 修改发票（仅 NORMAL；改额同样受"同一单据不超额"约束）
      operationId: updateFinInvoice
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinInvoiceCreate' }
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [fin]
      summary: 删除发票（台账订正用；业务作废走 /void）
      operationId: deleteFinInvoice
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'

  /fin/invoices/{id}/void:
    post:
      tags: [fin]
      summary: 作废发票（释放该单据的已开额度；超额校验只统计 NORMAL）
      operationId: voidFinInvoice
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /fin/reports/balance-sheet:
    get:
      tags: [fin]
      summary: 资产负债表（只统计 POSTED 凭证；资产 = 负债 + 权益 + 累计利润，diff 必须回传）
      description: |
        - 科目余额 = init_balance + Σ借 − Σ贷（按 direction 取号）；
        - accumulatedProfit 是截至该期间的损益累计净额，作为权益侧的平衡项
          （损益结转到利润分配属下期能力，不做它这张表永远不平）；
        - balanced=false 时 diff 给出具体差额（简报验收"不平要报差异"）。
      operationId: getBalanceSheet
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '400':
          description: FIN_REPORT_PERIOD_INVALID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /fin/reports/income-statement:
    get:
      tags: [fin]
      summary: 利润表（本期：营业收入 − 营业成本 − 费用 = 净利润；同时给出毛利）
      operationId: getIncomeStatement
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'

  /fin/overview:
    get:
      tags: [fin]
      summary: 财务中心首页（资金余额 / 应收总额 / 应付总额 / 本月收支 + 近 6 个月现金流）
      description: 卡片数字与明细页同源同口径：资金=启用银行账户余额合计；应收/应付=业务域余额（分→元换算）；收支=日记账按月合计。
      operationId: getFinanceOverview
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'

  # ═════════ V3-3 追加（prm，只增不改） ═════════
  /prm/price-plans:
    get:
      tags: [prm]
      summary: 价格方案列表（含明细行）
      operationId: listPricePlans
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
      responses:
        '200': { description: 'items/total；金额字段 priceAmount 单位=分，discountBp=万分比' }
    post:
      tags: [prm]
      summary: 新建价格方案（AGREEMENT/CUSTOMER/CUSTOMER_LEVEL）
      operationId: createPricePlan
      responses:
        '201': { description: 创建成功 }
        '409': { description: 'PRM_PLAN_CODE_DUPLICATED' }
  /prm/price-plans/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [prm]
      summary: 价格方案详情
      operationId: getPricePlan
      responses:
        '200': { description: OK }
        '404': { description: 'PRM_PLAN_NOT_FOUND' }
    put:
      tags: [prm]
      summary: 全量替换方案头与明细
      operationId: updatePricePlan
      responses:
        '200': { description: OK }
  /prm/price-plans/{id}/disable:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [prm]
      summary: 停用方案
      operationId: disablePricePlan
      responses:
        '200': { description: OK }
  /prm/price:
    get:
      tags: [prm]
      summary: 取价试算（协议价>专属价>等级价>标准售价；纯查询幂等）
      operationId: resolvePrice
      parameters:
        - { name: skuId, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: customerId, in: query, schema: { type: integer, format: int64 } }
        - { name: qty, in: query, schema: { type: integer, format: int64, default: 1 } }
        - { name: day, in: query, schema: { type: string, format: date }, description: 按哪一天取价（缺省=今天；决定命中哪个有效期区间） }
      responses:
        '200': { description: 'source=AGREEMENT_PRICE/CUSTOMER_PRICE/CUSTOMER_LEVEL_PRICE/STANDARD_PRICE' }
  /prm/promotions:
    get:
      tags: [prm]
      summary: 促销活动列表（台账；规则 JSON 原样回显，不参与算价）
      operationId: listPromotions
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, ACTIVE, STOPPED] } }
        - { name: keyword, in: query, schema: { type: string } }
      responses:
        '200': { description: OK }
    post:
      tags: [prm]
      summary: 新建促销活动（初始 DRAFT）
      operationId: createPromotion
      responses:
        '201': { description: 创建成功 }
        '409': { description: 'PRM_PROMOTION_CODE_DUPLICATED' }
  /prm/promotions/{id}/activate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [prm]
      summary: DRAFT/STOPPED → ACTIVE
      operationId: activatePromotion
      responses:
        '200': { description: OK }
  /prm/promotions/{id}/stop:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [prm]
      summary: ACTIVE → STOPPED
      operationId: stopPromotion
      responses:
        '200': { description: OK }

components:
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: true
      description: 幂等键。相同值重复提交只生效一次（不变量 INV-9）。
      schema: { type: string, minLength: 8, maxLength: 64 }
      example: req-20250601-0001
    PathId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
    StatusFilter:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/DocumentStatus' }

  responses:
    SingleResponse:
      description: 单对象响应
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    ListResponse:
      description: 列表响应
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    PageResponse:
      description: 分页响应
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiPageResponse' }
    Conflict:
      description: 业务冲突（库存不足 / 状态非法 / 重复编码 / 期间已锁账）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    BadRequest:
      description: 参数/状态校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

    Unauthorized:
      description: 未登录 / token 无效或过期（`IAM_UNAUTHENTICATED`）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

    Forbidden:
      description: 已登录但权限码不足（`IAM_FORBIDDEN`）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

    ReturnOrderResponse:
      description: 退货单响应
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/ReturnOrder' }

  schemas:
    ApiResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: OK }
        message: { type: string, example: success }
        data: { }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }

    ApiPageResponse:
      type: object
      required: [code, data]
      properties:
        code: { type: string, example: OK }
        message: { type: string }
        data:
          type: object
          required: [items, total, page, size]
          properties:
            items: { type: array, items: { } }
            total: { type: integer, format: int64, minimum: 0 }
            page: { type: integer, minimum: 1 }
            size: { type: integer, minimum: 1 }
        traceId: { type: string }

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 业务错误码，见 docs/05 错误码表
          example: INV_INSUFFICIENT_STOCK
        message:
          type: string
          description: 人类可读消息，**必须包含定位信息**（哪个 SKU / 哪个仓 / 差多少）
        details:
          type: object
          additionalProperties: true
        traceId:
          type: string
          description: 贯穿日志，测试失败时用它捞日志
        timestamp: { type: string, format: date-time }

    DocumentStatus:
      type: string
      description: 单据统一状态机（BR-DOC-01，非法转移必须拒绝）
      enum: [DRAFT, SUBMITTED, APPROVED, PARTIAL, COMPLETED, VOIDED, REJECTED]

    Warehouse:
      type: object
      required: [id, code, name, enabled]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: SH01 }
        name: { type: string, example: 上海仓 }
        address: { type: string, nullable: true }
        enabled: { type: boolean, example: true }
        priority:
          type: integer
          minimum: 0
          description: |
            拣货优先级，越小越先被自动选仓（`SalesQuoteConvert` / `auto-split` 的分配顺序）。
            实现在 `WarehouseController.java:108`（`toMap` 的 `m.put("priority", w.priority())`）。

    WarehouseCreate:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 2, maxLength: 32, example: SH01 }
        name: { type: string, minLength: 1, maxLength: 64, example: 上海仓 }
        address: { type: string, maxLength: 200 }
        enabled: { type: boolean, default: true }
        priority: { type: integer, minimum: 0, description: 省略时按实现默认值（`WarehouseController.java:41` `@Min(0)`） }

    WarehouseUpdate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        address: { type: string, maxLength: 200 }
        enabled: { type: boolean, default: true, description: 省略时后端按 true 处理 }
        priority: { type: integer, minimum: 0, description: 拣货优先级；省略则保持原值 }

    Supplier:
      type: object
      required: [id, code, name, enabled]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: SUP-001 }
        name: { type: string, example: 杭州面料供应商 }
        contactName: { type: string, nullable: true }
        contactPhone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        enabled: { type: boolean, example: true }

    SupplierCreate:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 2, maxLength: 32, example: SUP-001 }
        name: { type: string, minLength: 1, maxLength: 128, example: 杭州面料供应商 }
        contactName: { type: string, maxLength: 64 }
        contactPhone: { type: string, maxLength: 32 }
        address: { type: string, maxLength: 200 }
        enabled: { type: boolean, default: true }

    SupplierUpdate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        contactName: { type: string, maxLength: 64 }
        contactPhone: { type: string, maxLength: 32 }
        address: { type: string, maxLength: 200 }
        enabled: { type: boolean, default: true, description: 省略时后端按 true 处理 }

    Customer:
      type: object
      required: [id, code, name, discountRate, level, enabled]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: CUS-001 }
        name: { type: string, example: 零售散客 }
        phone: { type: string, nullable: true }
        discountRate:
          type: integer
          minimum: 1
          maximum: 10000
          description: 整数万分比：9000 = 9 折，10000 = 不打折；0 等于白送，必须拒绝
          example: 9000
        level: { type: string, maxLength: 16, example: VIP }
        enabled: { type: boolean, example: true }

    CustomerCreate:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 2, maxLength: 32, example: CUS-001 }
        name: { type: string, minLength: 1, maxLength: 128, example: 零售散客 }
        phone: { type: string, maxLength: 32 }
        discountRate:
          type: integer
          minimum: 1
          maximum: 10000
          default: 10000
          description: 整数万分比，禁止浮点（ADR-0005）
        level: { type: string, maxLength: 16, default: NORMAL }
        enabled: { type: boolean, default: true }

    CustomerUpdate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        phone: { type: string, maxLength: 32 }
        discountRate:
          type: integer
          minimum: 1
          maximum: 10000
          description: 省略时保留原折扣率
        level: { type: string, maxLength: 16 }
        enabled: { type: boolean, default: true, description: 省略时后端按 true 处理 }

    ProductCreate:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 2, maxLength: 32 }
        name: { type: string, minLength: 1, maxLength: 128, example: 圆领T恤 }
        category: { type: string, maxLength: 64 }
        season: { type: string, maxLength: 32, description: 季节维度，并入时间维度便于效期/批次测试 }
        enabled: { type: boolean, default: true }

    SkuCreate:
      type: object
      required: [productId, color, size]
      properties:
        productId: { type: integer, format: int64 }
        color: { type: string, minLength: 1, maxLength: 32, example: 白色 }
        size: { type: string, minLength: 1, maxLength: 16, example: L }
        barcode: { type: string, maxLength: 64 }
        retailPriceAmount:
          type: integer
          format: int64
          minimum: 0
          description: 零售价（**整数分**，见 ADR-0005）
        enabled: { type: boolean, default: true, description: 省略时后端按 true 处理（`SkuController.java:54`） }
        seasonCode: { type: string, maxLength: 32, description: FR-MDM-08 季节编码（`SkuController.java:55` `@Size(max = 32)`） }
        bandCode: { type: string, maxLength: 32, description: FR-MDM-08 波段编码（`SkuController.java:56` `@Size(max = 32)`） }
        launchDate: { type: string, format: date, description: 上市日期；`seasonYear` 由它派生（`SkuController.java:57`） }

    ReserveRequest:
      type: object
      required: [skuId, warehouseId, qty]
      properties:
        skuId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        batchNo: { type: string, default: '' }
        qty:
          type: integer
          minimum: 1
          description: 预占数量，必须为正

    ReserveResult:
      type: object
      properties:
        reservationId: { type: integer, format: int64 }
        skuId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        batchNo: { type: string }
        reservedQty: { type: integer, description: 本次预占数量 }
        onHandQty: { type: integer, description: 预占后实存 }
        availableQty: { type: integer, description: 预占后可用量 }
        duplicate: { type: boolean, description: true 表示幂等命中，未产生新变动 }

    InventoryTransferCreate:
      type: object
      required: [fromWarehouseId, toWarehouseId, lines]
      properties:
        fromWarehouseId: { type: integer, format: int64 }
        toWarehouseId: { type: integer, format: int64, description: 必须与调出仓不同 }
        bizDate: { type: string, format: date, description: 省略时取服务端业务日期（ClockProvider） }
        remark: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [skuId, qty]
            properties:
              skuId: { type: integer, format: int64 }
              batchNo: { type: string, maxLength: 64, default: '' }
              qty: { type: integer, minimum: 1 }
              unitCostAmount: { type: integer, format: int64, minimum: 0 }

    InventoryTransfer:
      type: object
      required: [id, transferNo, fromWarehouseId, toWarehouseId, status, lines]
      properties:
        id: { type: integer, format: int64 }
        transferNo: { type: string, example: TO20261024-0001 }
        fromWarehouseId: { type: integer, format: int64 }
        toWarehouseId: { type: integer, format: int64 }
        status: { type: string, enum: [IN_TRANSIT, COMPLETED] }
        bizDate: { type: string, format: date }
        remark: { type: string, nullable: true }
        inTransitQty: { type: integer, description: 仍在途的数量（INV-7 的在途项） }
        receivedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: '#/components/schemas/TransferLine' }
        duplicate: { type: boolean }

    TransferLine:
      type: object
      properties:
        lineNo: { type: integer }
        skuId: { type: integer, format: int64 }
        batchNo: { type: string }
        qty: { type: integer }
        inTransitQty: { type: integer }
        productionDate: { type: string, format: date, nullable: true }
        expiryDate: { type: string, format: date, nullable: true }
        unitCostAmount: { type: integer, format: int64, nullable: true }

    StocktakeCreate:
      type: object
      required: [warehouseId, lines]
      properties:
        warehouseId: { type: integer, format: int64 }
        bizDate: { type: string, format: date }
        remark: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [skuId, countedQty]
            properties:
              skuId: { type: integer, format: int64 }
              batchNo: { type: string, maxLength: 64, default: '' }
              countedQty: { type: integer, minimum: 0 }

    Stocktake:
      type: object
      required: [id, stocktakeNo, warehouseId, status, lines]
      properties:
        id: { type: integer, format: int64 }
        stocktakeNo: { type: string, example: ST20261024-0001 }
        warehouseId: { type: integer, format: int64 }
        status: { type: string, enum: [DRAFT, POSTED] }
        bizDate: { type: string, format: date }
        remark: { type: string, nullable: true }
        totalDiffQty: { type: integer, description: 各明细 diff 之和 }
        postedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: '#/components/schemas/StocktakeLine' }
        duplicate: { type: boolean }

    StocktakeLine:
      type: object
      properties:
        lineNo: { type: integer }
        skuId: { type: integer, format: int64 }
        batchNo: { type: string }
        bookQty: { type: integer, description: 建单时快照的账面量 }
        countedQty: { type: integer }
        diffQty: { type: integer, description: counted - book；0 不产生调整流水 }

    InventoryAdjustmentCreate:
      type: object
      required: [skuId, warehouseId, changeQty, reason]
      properties:
        skuId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        batchNo: { type: string, maxLength: 64, default: '' }
        changeQty:
          type: integer
          description: 有符号数量：正=调增（ADJUST_IN），负=调减（ADJUST_OUT），不得为 0
        reason: { type: string, minLength: 1, maxLength: 200, description: 必填，审计依据 }
        unitCostAmount: { type: integer, format: int64, minimum: 0, nullable: true }

    InventoryAdjustment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        adjustNo: { type: string, example: AJ20261024-0001 }
        skuId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        batchNo: { type: string }
        changeQty: { type: integer }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
        duplicate: { type: boolean }

    InventoryFreezeCreate:
      type: object
      required: [skuId, warehouseId, qty]
      properties:
        skuId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        batchNo: { type: string, maxLength: 64, default: '' }
        qty: { type: integer, minimum: 1 }
        reason: { type: string, maxLength: 200 }
        expiresAt:
          type: string
          format: date-time
          description: 可选；到期由服务端时钟判断并自动解冻

    InventoryFreeze:
      type: object
      properties:
        id: { type: integer, format: int64 }
        skuId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        batchNo: { type: string }
        qty: { type: integer }
        reason: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, RELEASED, EXPIRED] }
        expiresAt: { type: string, format: date-time, nullable: true }
        releasedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        duplicate: { type: boolean }

    BalanceDimensionRow:
      type: object
      properties:
        warehouseId: { type: integer, format: int64 }
        skuId: { type: integer, format: int64 }
        batchNo: { type: string }
        stockStatus: { type: string, enum: [AVAILABLE, RESERVED, FROZEN] }
        ownership: { type: string, enum: [SELF] }
        qty: { type: integer }

    InventoryAlert:
      type: object
      properties:
        type: { type: string, enum: [SAFETY, SLOW_MOVING, EXPIRING] }
        skuId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        batchNo: { type: string, nullable: true }
        onHandQty: { type: integer }
        availableQty: { type: integer }
        threshold: { type: integer, description: 安全库存下限 / 滞销天数 / 临期天数 }
        expiryDate: { type: string, format: date, nullable: true }
        lastMovementAt: { type: string, format: date-time, nullable: true }
        warehousePriority: { type: integer }

    ReplenishmentSuggestion:
      type: object
      properties:
        skuId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        availableQty: { type: integer }
        minLevel: { type: integer }
        maxLevel: { type: integer }
        suggestedQty: { type: integer, description: maxLevel - availableQty }
        warehousePriority: { type: integer }

    ReceiveRequest:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [lineId, qty]
            properties:
              lineId: { type: integer, format: int64 }
              qty: { type: integer, minimum: 1 }
              batchNo: { type: string, maxLength: 64 }
              productionDate: { type: string, format: date }
              expiryDate: { type: string, format: date, description: FEFO 依据 }
              qcQty: { type: integer, minimum: 0, description: 质检合格量（`PurchaseOrderController.java:141` `@Min(0)`）；省略表示全检合格 }
              qcNote: { type: string, maxLength: 500, description: 质检备注（`PurchaseOrderController.java:142` `@Size(max = 500)`） }

    InventoryReceiveRequest:
      type: object
      description: |
        `POST /inventory/receipts` 的**单行**入库请求（内部端点，一次一行）。
        与 `ReceiveRequest` 不是同一个形状：那个是单据级「一批明细」，这个是「一条库存」。
        **两者不能共用一张 schema** —— 本仓有两个同名的 `ReceiveRequest` 记录类
        （`InventoryController.java:138` 与 `PurchaseOrderController.java:142`），
        V2-C2 之前契约只写了一个，于是 `/inventory/receipts` 一直声明着错误的请求体
        （多一个 `lines` 数组、少 6 个真实字段）。V2-C3 按实现拆成两张。
      required: [skuId, warehouseId, qty, bizRefNo]
      properties:
        skuId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        batchNo: { type: string, description: 省略/空串表示无批次 }
        productionDate: { type: string, format: date }
        expiryDate: { type: string, format: date }
        qty: { type: integer, minimum: 1, description: '`@NotNull @Min(1)`（`InventoryController.java:144`）' }
        bizRefNo: { type: string, description: '业务引用号，落 `inventory_ledger.biz_ref_no`（`@NotBlank`，`InventoryController.java:145`）' }
        unitCostAmount: { type: integer, format: int64, description: 单位成本（分）；省略表示按 0 处理 }

    PurchaseOrderCreate:
      type: object
      required: [supplierId, warehouseId, lines]
      description: |
        `bizDate` **不是必填**：省略时实现取 `clock.today()`
        （`PurchaseOrderApplicationService.java:158`），与 `SalesOrderCreate` 同一套规则。
      properties:
        supplierId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        bizDate: { type: string, format: date, description: 业务日期；省略时取当天（`PurchaseOrderApplicationService.java:158`） }
        remark: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [skuId, qty, unitPriceAmount]
            properties:
              skuId: { type: integer, format: int64 }
              qty: { type: integer, minimum: 1 }
              unitPriceAmount: { type: integer, format: int64, minimum: 0, description: 单价（分） }

    SalesOrderCreate:
      type: object
      required: [customerId, warehouseId, lines]
      description: |
        `bizDate` **不是必填**：省略时实现取 `clock.today()`
        （`SalesOrderApplicationService.java:162`）。
      properties:
        customerId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        bizDate: { type: string, format: date, description: 省略时取当天（`SalesOrderApplicationService.java:162`） }
        remark: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [qty, unitPriceAmount]
            description: |
              每行**必须且只能**指定 `skuId` 或 `bundleId` 之一 —— 这条互斥规则由
              `SalesOrderApplicationService.prepareLines` 在服务层校验（`SYS_VALIDATION_ERROR`），
              不在 `@NotNull` 里表达，所以契约也不能把它写成 `required: [skuId]`。
            properties:
              skuId: { type: integer, format: int64, description: 与 `bundleId` 二选一（`SalesOrderController.java:47`） }
              bundleId: { type: integer, format: int64, description: 套装行：与 `skuId` 二选一，组件按零售价计价 }
              qty: { type: integer, minimum: 1 }
              unitPriceAmount: { type: integer, format: int64, minimum: 0 }
              discountRate:
                type: integer
                minimum: 1
                maximum: 10000
                default: 10000
                description: |
                  折扣率，**整数万分比**（9000 = 9 折），禁止浮点（ADR-0005）。
                  实现是 `@Min(1) @Max(10000)`（`SalesOrderController.java:53`）＋服务层
                  `rate <= 0 || rate > 10000` 兜底（`SalesOrderApplicationService.java:510-513`），
                  所以下界是 **1** 而不是 0。

    SalesOrder:
      type: object
      required: [id, orderNo, status, customerId, warehouseId, totalAmount, totalQty, lines]
      properties:
        id: { type: integer, format: int64 }
        orderNo: { type: string, example: SO20261022-0001 }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        customerId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        bizDate: { type: string, format: date }
        totalAmount: { type: integer, format: int64, description: 单据总金额（分） }
        totalQty: { type: integer }
        period: { type: string, nullable: true, description: 账期 yyyy-MM }
        remark: { type: string, nullable: true }
        lines:
          type: array
          items: { $ref: '#/components/schemas/SalesOrderLine' }

    SalesOrderLine:
      type: object
      required: [id, lineNo, skuId, qty, shippedQty, returnedQty, openQty,
                 unitPriceAmount, discountRate, amount]
      properties:
        id: { type: integer, format: int64 }
        lineNo: { type: integer, minimum: 1 }
        skuId: { type: integer, format: int64 }
        qty: { type: integer, minimum: 1 }
        shippedQty: { type: integer, minimum: 0, description: 累计已出库数量 }
        returnedQty:
          type: integer
          minimum: 0
          description: 累计已退货数量；退货入库时原子累加，剩余可退 = shippedQty − returnedQty
        openQty: { type: integer, description: '= qty − shippedQty' }
        unitPriceAmount: { type: integer, format: int64, minimum: 0, description: 单价（分） }
        discountRate: { type: integer, minimum: 1, maximum: 10000, description: 整数万分比 }
        amount: { type: integer, format: int64, minimum: 0, description: 行金额（分） }
        reservationIds:
          type: array
          description: 本行对应的预占分段 id（FEFO 拆批次时可能有多段）
          items: { type: integer, format: int64 }
        bundleId:
          type: integer
          format: int64
          nullable: true
          description: |
            套装行才有值（FR-SAL-10）：本行由该套装展开而来。
            同一套装的多个组件行共享 `bundleGroupNo`
        bundleGroupNo:
          type: integer
          nullable: true
          description: 套装展开组号（同一订单内按建单顺序 1,2,3…），用于把组件行归回同一个套装行
        bundleRatio:
          type: integer
          nullable: true
          description: 该组件在套装里的配比；`qty = bundleQty × bundleRatio`
        bundleQty:
          type: integer
          nullable: true
          description: 本组展开时的套装套数
        allocations:
          type: array
          description: |
            按仓拆分的预占分配（FR-SAL-11 自动选仓的可见证据）。
            固定仓建单只有一个元素；自动选仓可能多仓。守恒：`Σ qty == 本行 qty`
          items: { $ref: '#/components/schemas/SalesOrderAllocation' }

    ReturnOrderCreate:
      type: object
      required: [originSalesOrderId, lines]
      properties:
        originSalesOrderId: { type: integer, format: int64, description: 原出货单 id }
        bizDate:
          type: string
          format: date
          description: 业务日期；省略时由服务端 ClockProvider 取当天
        remark: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          description: 同一原出货单明细行在一张退货单内只能出现一次
          items:
            type: object
            required: [originLineId, qty]
            properties:
              originLineId: { type: integer, format: int64, description: 原出货单明细行 id }
              qty: { type: integer, minimum: 1, description: 本次退货数量 }
              batchNo: { type: string, maxLength: 64, default: '', description: 退货入库批次 }
              productionDate: { type: string, format: date, nullable: true }
              expiryDate: { type: string, format: date, nullable: true, description: 退货入库批次的效期 }

    ReturnOrderLine:
      type: object
      required: [id, lineNo, originLineId, skuId, qty, unitPriceAmount, discountRate, amount]
      properties:
        id: { type: integer, format: int64 }
        lineNo: { type: integer, minimum: 1 }
        originLineId: { type: integer, format: int64 }
        skuId: { type: integer, format: int64 }
        qty: { type: integer, minimum: 1 }
        unitPriceAmount: { type: integer, format: int64, minimum: 0, description: 从原出货行派生（分） }
        discountRate: { type: integer, minimum: 1, maximum: 10000, description: 从原出货行派生 }
        amount: { type: integer, format: int64, minimum: 0, description: 行退货金额（分） }
        batchNo: { type: string, description: 退货入库批次，默认空批次 }
        productionDate: { type: string, format: date, nullable: true }
        expiryDate: { type: string, format: date, nullable: true }

    ReturnOrder:
      type: object
      required: [id, orderNo, status, originSalesOrderId, customerId, warehouseId,
                 bizDate, totalAmount, totalQty, lines]
      properties:
        id: { type: integer, format: int64 }
        orderNo: { type: string, example: RO20261022-0001 }
        status:
          type: string
          description: 退货单只使用 DRAFT / SUBMITTED / APPROVED / COMPLETED / VOIDED / REJECTED，不使用 PARTIAL
          enum: [DRAFT, SUBMITTED, APPROVED, COMPLETED, VOIDED, REJECTED]
        originSalesOrderId: { type: integer, format: int64 }
        customerId: { type: integer, format: int64, description: 从原出货单派生 }
        warehouseId: { type: integer, format: int64, description: 从原出货单派生 }
        bizDate: { type: string, format: date }
        totalAmount: { type: integer, format: int64, description: 退货总金额（分） }
        totalQty: { type: integer }
        period: { type: string, nullable: true, description: 账期 yyyy-MM }
        remark: { type: string, nullable: true }
        lines:
          type: array
          items: { $ref: '#/components/schemas/ReturnOrderLine' }

    ReturnableOrderLine:
      type: object
      description: |
        可退出货明细 —— 退货建单的行来源。
        单价与折扣原样带出只为**只读展示**：建单请求体里不接受它们（一律从原行派生，防止改写金额）。
      required: [originLineId, lineNo, skuId, skuName, shippedQty, returnedQty, returnableQty,
                 unitPriceAmount, discountRate]
      properties:
        originLineId: { type: integer, format: int64, description: 原出货单明细行 id，建单请求的 lines 元素引用它 }
        lineNo: { type: integer, minimum: 1, description: 原单行号，用于与超退错误消息里的"第 N 行"对上 }
        skuId: { type: integer, format: int64 }
        skuName: { type: string, description: 展示名：商品名 · 颜色-尺码（服务端批量取名，前端不必再依赖主数据字典） }
        shippedQty: { type: integer, minimum: 1, description: 累计已出货数量 }
        returnedQty: { type: integer, minimum: 0, description: 累计已退货数量 }
        returnableQty:
          type: integer
          minimum: 1
          description: 剩余可退 = shippedQty − returnedQty；建单超过它会得到 RMA_QTY_EXCEED_ORIGIN
        unitPriceAmount: { type: integer, format: int64, minimum: 0, description: 原行单价（分） }
        discountRate: { type: integer, minimum: 1, maximum: 10000, description: 原行折扣（整数万分比） }

    ReturnableOrder:
      type: object
      description: 一张还有可退数量的出货单，连同它的可退明细
      required: [orderId, orderNo, status, customerId, customerName, warehouseId, bizDate, lines]
      properties:
        orderId: { type: integer, format: int64, description: 建单请求的 originSalesOrderId }
        orderNo: { type: string, example: SO20261022-0001 }
        status:
          type: string
          description: 可退来源只会是这两种"已出货"状态之一
          enum: [PARTIAL, COMPLETED]
        customerId: { type: integer, format: int64, description: 退货单继承它，不接受前端传入 }
        customerName: { type: string }
        warehouseId:
          type: integer
          format: int64
          description: 回补仓库 = 原出货仓库，退货单不可改
        bizDate: { type: string, format: date }
        lines:
          type: array
          minItems: 1
          description: 只包含可退的行；整行退完的行不出现
          items: { $ref: '#/components/schemas/ReturnableOrderLine' }

    DailySettlementRequest:
      type: object
      required: [bizDate]
      properties:
        bizDate: { type: string, format: date }
        warehouseId: { type: integer, format: int64, description: 省略表示全部仓库 }

    MonthlySettlementRequest:
      type: object
      required: [period]
      properties:
        period: { type: string, pattern: '^\d{4}-\d{2}$', example: '2025-06' }

    SettlementTotals:
      type: object
      required: [purchaseQty, purchaseAmount, salesQty, salesAmount,
                 returnQty, returnAmount, netAmount]
      properties:
        purchaseQty: { type: integer, format: int64, description: 采购入库数量 }
        purchaseAmount: { type: integer, format: int64, description: 采购入库金额（分） }
        salesQty: { type: integer, format: int64, description: 销售出库数量 }
        salesAmount: { type: integer, format: int64, description: 销售出库金额（分） }
        returnQty: { type: integer, format: int64, description: 退货入库数量 }
        returnAmount: { type: integer, format: int64, description: 退货入库金额（分） }
        netAmount: { type: integer, format: int64, description: '= salesAmount − returnAmount（分）' }

    DailySettlementResult:
      type: object
      required: [bizDate, items, totals]
      properties:
        bizDate: { type: string, format: date }
        items:
          type: array
          description: 按仓库的日清结果；省略 warehouseId 时为全部仓库
          items:
            allOf:
              - $ref: '#/components/schemas/SettlementTotals'
              - type: object
                required: [warehouseId]
                properties:
                  warehouseId: { type: integer, format: int64 }
        totals: { $ref: '#/components/schemas/SettlementTotals' }

    MonthlySettlementResult:
      allOf:
        - $ref: '#/components/schemas/SettlementTotals'
        - type: object
          required: [period, status, duplicate]
          properties:
            period: { type: string, pattern: '^\d{4}-\d{2}$', example: '2025-06' }
            status: { type: string, enum: [OPEN, CLOSED] }
            closedAt: { type: string, format: date-time, nullable: true, description: 锁账时间（ClockProvider） }
            duplicate: { type: boolean, description: true 表示幂等命中，未重复结算 }

    ReconcileResult:
      type: object
      required: [period, generalTotal, detailTotal, diff, balanced]
      properties:
        period: { type: string, pattern: '^\d{4}-\d{2}$' }
        generalTotal: { type: integer, format: int64, description: 总账（期间汇总）金额（分） }
        detailTotal: { type: integer, format: int64, description: 明细实时重算金额（分） }
        diff: { type: integer, format: int64, description: '= generalTotal − detailTotal，必须为 0' }
        balanced: { type: boolean }

    SettlementPeriodRow:
      allOf:
        - $ref: '#/components/schemas/SettlementTotals'
        - type: object
          required: [period, status]
          description: 一行账期（`settlement_periods`）：锁账状态 + 已落的期间汇总，全部字段只读
          properties:
            period: { type: string, pattern: '^\d{4}-\d{2}$', example: '2025-06' }
            status: { type: string, enum: [OPEN, CLOSED], description: CLOSED = 已月结锁账（不可逆） }
            closedAt: { type: string, format: date-time, nullable: true, description: 锁账时间；OPEN 时为 null }
            closedBy: { type: integer, format: int64, nullable: true, description: 锁账操作人 app_users.id；历史行为 null（月结路径尚未写入该列，属 M3 体验债） }

    InventoryBalance:
      type: object
      properties:
        skuId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        batchNo: { type: string }
        expiryDate: { type: string, format: date }
        onHandQty: { type: integer, minimum: 0, description: 实存量（不变量 INV-1） }
        reservedQty: { type: integer, minimum: 0, description: 预占量 }
        frozenQty: { type: integer, minimum: 0, description: 冻结量（`InventoryController.toMap:218`；`availableQty` 已扣减它） }
        availableQty: { type: integer, description: '= onHandQty − reservedQty − frozenQty（不变量 INV-3）' }

    InventoryLedgerEntry:
      type: object
      description: 不可变流水，追溯的唯一依据（ADR-0007）
      properties:
        id: { type: integer, format: int64 }
        skuId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        batchNo: { type: string }
        changeQty: { type: integer, description: 正=入库，负=出库，不允许为 0 }
        bizType:
          type: string
          description: 仅记录实存（onHand）变动；预占/释放不改变实存故不产生流水（不变量 INV-2 的前提）
          enum: [PURCHASE_IN, SALES_OUT, RETURN_IN, TRANSFER_IN, TRANSFER_OUT, ADJUST_IN, ADJUST_OUT]
        bizRefNo: { type: string, description: 来源单据号，可反查 }
        unitCostAmount: { type: integer, format: int64, description: 单位成本（分） }
        occurredAt: { type: string, format: date-time, description: 业务时间（由 ClockProvider 注入） }

    ReportRow:
      type: object
      required: [key, label, qty, amount, orderCount]
      properties:
        key:
          type: string
          description: 分组键（供应商/客户/商品/SKU 编码，或日期、账期）
        label: { type: string, description: 展示名称 }
        qty: { type: integer, format: int64, description: 期间内数量 }
        amount: { type: integer, format: int64, description: 期间内金额（分） }
        orderCount: { type: integer, format: int64, description: 涉及单据数 }

    InventorySummaryRow:
      type: object
      description: 进销存汇总行，恒等式 openingQty + inboundQty − outboundQty = closingQty
      required: [skuId, warehouseId, openingQty, inboundQty, outboundQty, closingQty]
      properties:
        skuId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        openingQty: { type: integer, format: int64, description: 期初数量 }
        inboundQty: { type: integer, format: int64, description: 本期入库数量 }
        outboundQty: { type: integer, format: int64, description: 本期出库数量 }
        closingQty: { type: integer, format: int64, description: 期末数量 }

    OperatingReportRow:
      type: object
      description: 经营日报/月报一行；period 为日或月，流水四数逐行满足 INV-6
      required: [period, openingQty, inboundQty, outboundQty, closingQty,
                 purchaseQty, purchaseAmount, salesQty, salesAmount]
      properties:
        period: { type: string, description: '日：yyyy-MM-dd；月：yyyy-MM' }
        openingQty: { type: integer, format: int64, description: 期初（流水口径） }
        inboundQty: { type: integer, format: int64, description: 本期入库（流水口径） }
        outboundQty: { type: integer, format: int64, description: 本期出库（流水口径） }
        closingQty: { type: integer, format: int64, description: 期末（流水口径） }
        purchaseQty: { type: integer, format: int64, description: 进货数量（单据 biz_date 口径） }
        purchaseAmount: { type: integer, format: int64, description: 进货金额（分，单据口径） }
        salesQty: { type: integer, format: int64, description: 出货数量（单据 biz_date 口径） }
        salesAmount: { type: integer, format: int64, description: 出货金额（分，单据口径） }

    OperatingReportResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OperatingReportRow' }

    InventoryTurnoverRow:
      type: object
      description: 库存周转与呆滞行；turnoverDays 为 null 表示区间无出库
      required: [skuId, skuCode, skuName, warehouseId, warehouseName, openingQty,
                 closingQty, outboundQty, turnoverDays, idleDays, stale]
      properties:
        skuId: { type: integer, format: int64 }
        skuCode: { type: string }
        skuName: { type: string }
        warehouseId: { type: integer, format: int64 }
        warehouseName: { type: string }
        openingQty: { type: integer, format: int64 }
        closingQty: { type: integer, format: int64 }
        outboundQty: { type: integer, format: int64, description: 区间内流水出库量 }
        turnoverDays:
          type: number
          nullable: true
          description: ((期初+期末)/2 × 区间天数) / 区间出库，保留一位小数
        idleDays: { type: integer, description: 距最近出库（从未出库则距首次流水）的天数 }
        stale: { type: boolean, description: idleDays >= deadDays }

    InventoryTurnoverResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InventoryTurnoverRow' }

    CustomerContributionRow:
      type: object
      description: 客户贡献行；数量/金额/单据数与出货统计同口径
      required: [customerId, customerCode, customerName, orderCount, qty, amount,
                 repurchase, newCustomer]
      properties:
        customerId: { type: integer, format: int64 }
        customerCode: { type: string }
        customerName: { type: string }
        orderCount: { type: integer, format: int64 }
        qty: { type: integer, format: int64 }
        amount: { type: integer, format: int64, description: 金额（分） }
        repurchase: { type: boolean, description: 期间单据数 ≥ 2 }
        newCustomer: { type: boolean, description: from 之前没有已执行出货单 }

    CustomerContributionSummary:
      type: object
      description: 全量客户汇总（不受 Top N 截断影响）
      required: [customerCount, repurchaseCount, repurchaseRateBp, newCustomerCount,
                 returningCustomerCount, totalQty, totalAmount, orderCount]
      properties:
        customerCount: { type: integer }
        repurchaseCount: { type: integer }
        repurchaseRateBp: { type: integer, format: int64, description: 复购率万分比（6667 = 66.67%） }
        newCustomerCount: { type: integer }
        returningCustomerCount: { type: integer }
        totalQty: { type: integer, format: int64 }
        totalAmount: { type: integer, format: int64, description: 金额（分） }
        orderCount: { type: integer, format: int64 }

    CustomerContributionResult:
      type: object
      required: [items, summary]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CustomerContributionRow' }
        summary: { $ref: '#/components/schemas/CustomerContributionSummary' }

    AgingRow:
      type: object
      description: 账龄行；四桶合计必须等于余额
      required: [partnerId, partnerCode, partnerName, balanceAmount,
                 bucket0, bucket1, bucket2, bucket3]
      properties:
        partnerId: { type: integer, format: int64 }
        partnerCode: { type: string }
        partnerName: { type: string }
        balanceAmount: { type: integer, format: int64, description: 余额（分） }
        bucket0: { type: integer, format: int64, description: 0-30 天（含未到期/无到期日） }
        bucket1: { type: integer, format: int64, description: 31-60 天 }
        bucket2: { type: integer, format: int64, description: 61-90 天 }
        bucket3: { type: integer, format: int64, description: 90+ 天 }

    AgingSummary:
      type: object
      required: [partnerCount, totalBalance, bucket0, bucket1, bucket2, bucket3]
      properties:
        partnerCount: { type: integer }
        totalBalance: { type: integer, format: int64 }
        bucket0: { type: integer, format: int64 }
        bucket1: { type: integer, format: int64 }
        bucket2: { type: integer, format: int64 }
        bucket3: { type: integer, format: int64 }

    AgingResult:
      type: object
      required: [items, summary]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AgingRow' }
        summary: { $ref: '#/components/schemas/AgingSummary' }

    NlCommandRequest:
      type: object
      required: [command]
      properties:
        command:
          type: string
          minLength: 1
          maxLength: 500
          description: 一句自然语言指令
          example: 查询 SKU 12 在仓库 3 的库存

    NlCommandResult:
      type: object
      description: NL 调度结果；data 的 shape 由 intent 决定（与对应 REST 接口同源）
      required: [intent, description, write, data]
      properties:
        intent:
          type: string
          enum: [help, query_inventory, list_documents, get_document, inventory_summary,
                 query_master_data, create_purchase_order, create_sales_order]
        description: { type: string, description: 人类可读的结果摘要（含关键数字） }
        write: { type: boolean, description: true = 本次指令产生了写操作 }
        data:
          description: 意图对应的业务数据；读意图通常是 items 或分页对象，写意图是建成的单据
          nullable: true

    CostRecalculateResult:
      type: object
      required: [layerCount, inboundCostAmount, outboundCostAmount, endingCostAmount, balanced]
      properties:
        layerCount: { type: integer, format: int32 }
        inboundCostAmount: { type: integer, format: int64 }
        outboundCostAmount: { type: integer, format: int64 }
        endingCostAmount: { type: integer, format: int64 }
        balanced: { type: boolean }

    CostMonthlyRequest:
      type: object
      required: [period]
      properties:
        period: { type: string, pattern: '^\d{4}-\d{2}$', example: '2026-10' }

    CostMonthlyItem:
      type: object
      required: [skuId, warehouseId, openingQty, openingCostAmount, inboundQty,
                 inboundCostAmount, outboundQty, outboundCostAmount, closingQty, closingCostAmount]
      properties:
        skuId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        openingQty: { type: integer }
        openingCostAmount: { type: integer, format: int64 }
        inboundQty: { type: integer }
        inboundCostAmount: { type: integer, format: int64 }
        outboundQty: { type: integer }
        outboundCostAmount: { type: integer, format: int64 }
        closingQty: { type: integer }
        closingCostAmount: { type: integer, format: int64 }

    CostMonthlyResult:
      type: object
      required: [period, duplicate, items, marginRecordCount]
      properties:
        period: { type: string }
        duplicate: { type: boolean }
        items:
          type: array
          items: { $ref: '#/components/schemas/CostMonthlyItem' }
        marginRecordCount: { type: integer }

    CostMonthlyListResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CostMonthlyItem' }

    ProfitRow:
      type: object
      required: [key, label, qty, revenueAmount, costAmount, grossProfitAmount,
                 grossMarginRateBp, orderCount]
      properties:
        key: { type: string }
        label: { type: string }
        qty: { type: integer }
        revenueAmount: { type: integer, format: int64 }
        costAmount: { type: integer, format: int64 }
        grossProfitAmount: { type: integer, format: int64 }
        grossMarginRateBp: { type: integer, description: '万分比，6000 = 60%' }
        orderCount: { type: integer }

    ProfitReportResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProfitRow' }

    PurchaseRequisitionCreate:
      type: object
      required: [supplierId, warehouseId, lines]
      properties:
        supplierId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        bizDate: { type: string, format: date, description: 缺省取服务端 ClockProvider 的今天 }
        remark: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [skuId, qty, unitPriceAmount]
            properties:
              skuId: { type: integer, format: int64 }
              qty: { type: integer, minimum: 1 }
              unitPriceAmount: { type: integer, format: int64, minimum: 0 }

    PurchaseRequisition:
      type: object
      required: [id, orderNo, status, supplierId, warehouseId, totalQty, totalAmount, lines]
      properties:
        id: { type: integer, format: int64 }
        orderNo: { type: string, example: PR20261023-0001 }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        supplierId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        bizDate: { type: string, format: date }
        totalAmount: { type: integer, format: int64, description: 分 }
        totalQty: { type: integer }
        period: { type: string, nullable: true }
        remark: { type: string, nullable: true }
        convertedOrderId:
          type: integer
          format: int64
          nullable: true
          description: 非空 = 已转单；此后请购单不可再改
        lines:
          type: array
          items: { $ref: '#/components/schemas/RequisitionLine' }

    RequisitionLine:
      type: object
      required: [id, lineNo, skuId, qty, unitPriceAmount, amount]
      properties:
        id: { type: integer, format: int64 }
        lineNo: { type: integer, minimum: 1 }
        skuId: { type: integer, format: int64 }
        qty: { type: integer, minimum: 1 }
        unitPriceAmount: { type: integer, format: int64, minimum: 0 }
        amount: { type: integer, format: int64, minimum: 0 }

    PurchaseRequisitionConvertRequest:
      type: object
      required: [lines]
      properties:
        bizDate: { type: string, format: date, description: 生成的订单业务日期，缺省今天 }
        remark: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          description: 必须覆盖请购单全部行；数量 1..申请数量
          items:
            type: object
            required: [lineId, qty]
            properties:
              lineId: { type: integer, format: int64 }
              qty: { type: integer, minimum: 1 }

    PurchaseOrderLine:
      type: object
      description: 进货单明细（含到货/质检进度）。事实源：`PurchaseRequisitionController.orderMap:175-192`。
      required: [id, lineNo, skuId, qty, receivedQty, qcQty, qcStatus, rejectedQty,
                 openQty, unitPriceAmount, amount]
      properties:
        id: { type: integer, format: int64 }
        lineNo: { type: integer, minimum: 1 }
        skuId: { type: integer, format: int64 }
        qty: { type: integer, minimum: 1 }
        receivedQty: { type: integer, minimum: 0, description: 已入库量 }
        qcQty: { type: integer, minimum: 0, description: 质检合格量 }
        qcStatus: { type: string, description: 质检状态（`QcStatus.name()`，UNCHECKED / PASSED / PARTIAL / FAILED） }
        qcNote: { type: string, nullable: true }
        rejectedQty: { type: integer, minimum: 0, description: 质检不合格量 }
        openQty: { type: integer, minimum: 0, description: 未入库量 = qty - receivedQty }
        unitPriceAmount: { type: integer, format: int64, minimum: 0 }
        amount: { type: integer, format: int64, minimum: 0 }

    PurchaseOrder:
      type: object
      description: |
        进货单（`purchase_orders`）。这张 schema 迟到了：
        `POST /purchase-requisitions/{id}/convert` 的 200 从 V2-C2 起就 `$ref` 它，
        但定义一直不存在（悬空引用，V2-C3 补上）。字段以
        `PurchaseRequisitionController.orderMap:162-195` 的 `put` 键为准 ——
        转单响应就是这张 Map。
      required: [id, orderNo, status, supplierId, warehouseId, totalQty, totalAmount, lines]
      properties:
        id: { type: integer, format: int64 }
        orderNo: { type: string, example: PO20261023-0001 }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        supplierId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        bizDate: { type: string, format: date }
        totalAmount: { type: integer, format: int64, description: 分 }
        totalQty: { type: integer }
        period: { type: string, nullable: true }
        remark: { type: string, nullable: true }
        lines:
          type: array
          items: { $ref: '#/components/schemas/PurchaseOrderLine' }

    PurchaseReceipt:
      type: object
      required: [id, receiptNo, purchaseOrderId, supplierId, warehouseId,
                 totalQty, acceptedQty, rejectedQty, acceptedAmount, lines]
      properties:
        id: { type: integer, format: int64 }
        receiptNo: { type: string, example: GR20261023-0001 }
        purchaseOrderId: { type: integer, format: int64 }
        supplierId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        bizDate: { type: string, format: date }
        totalQty: { type: integer, description: 本次到货量 }
        acceptedQty: { type: integer, description: 合格量（入库/应付） }
        rejectedQty: { type: integer, description: 不合格量（不入库/不生成应付） }
        acceptedAmount: { type: integer, format: int64, description: 合格金额（分） }
        lines:
          type: array
          items: { $ref: '#/components/schemas/PurchaseReceiptLine' }

    PurchaseReceiptLine:
      type: object
      required: [id, lineNo, purchaseOrderLineId, skuId, batchNo,
                 receivedQty, qcQty, rejectedQty, unitPriceAmount, acceptedAmount, qcStatus]
      properties:
        id: { type: integer, format: int64 }
        lineNo: { type: integer, minimum: 1 }
        purchaseOrderLineId: { type: integer, format: int64 }
        skuId: { type: integer, format: int64 }
        batchNo: { type: string }
        receivedQty: { type: integer }
        qcQty: { type: integer }
        rejectedQty: { type: integer }
        qcStatus: { type: string, enum: [PASSED, PARTIAL, FAILED] }
        qcNote: { type: string, nullable: true }
        unitPriceAmount: { type: integer, format: int64 }
        acceptedAmount: { type: integer, format: int64 }

    PurchaseReturnCreate:
      type: object
      required: [purchaseOrderId, lines]
      properties:
        purchaseOrderId: { type: integer, format: int64 }
        bizDate: { type: string, format: date }
        remark: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [receiptLineId, qty]
            properties:
              receiptLineId: { type: integer, format: int64, description: 原到货行 id }
              qty: { type: integer, minimum: 1, description: 不得超过该行合格量 − 已退量 }

    PurchaseReturn:
      type: object
      required: [id, returnNo, purchaseOrderId, supplierId, warehouseId,
                 status, totalQty, totalAmount, lines]
      properties:
        id: { type: integer, format: int64 }
        returnNo: { type: string, example: RT20261023-0001 }
        purchaseOrderId: { type: integer, format: int64 }
        supplierId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        bizDate: { type: string, format: date }
        period: { type: string, nullable: true }
        status: { type: string, enum: [DRAFT, COMPLETED, VOIDED] }
        totalQty: { type: integer }
        totalAmount: { type: integer, format: int64 }
        remark: { type: string, nullable: true }
        lines:
          type: array
          items: { $ref: '#/components/schemas/PurchaseReturnLine' }

    PurchaseReturnLine:
      type: object
      required: [receiptLineId, purchaseOrderLineId, skuId, qty, unitPriceAmount, amount, batchNo]
      properties:
        receiptLineId: { type: integer, format: int64 }
        purchaseOrderLineId: { type: integer, format: int64 }
        skuId: { type: integer, format: int64 }
        qty: { type: integer, minimum: 1 }
        unitPriceAmount: { type: integer, format: int64 }
        amount: { type: integer, format: int64 }
        batchNo: { type: string }

    SupplierPayable:
      type: object
      required: [id, payableNo, supplierId, purchaseOrderId, orderNo, receiptId,
                 originalAmount, returnedAmount, paidAmount, balance, status, allocations]
      properties:
        id: { type: integer, format: int64 }
        payableNo: { type: string, example: AP20261023-0001 }
        supplierId: { type: integer, format: int64 }
        purchaseOrderId: { type: integer, format: int64 }
        orderNo: { type: string }
        receiptId: { type: integer, format: int64 }
        bizDate: { type: string, format: date }
        period: { type: string, nullable: true }
        originalAmount: { type: integer, format: int64, description: 合格到货金额（分） }
        returnedAmount: { type: integer, format: int64 }
        paidAmount: { type: integer, format: int64 }
        balance:
          type: integer
          format: int64
          description: 数据库生成列 = originalAmount − returnedAmount − paidAmount
        status: { type: string, enum: [OPEN, PARTIAL, SETTLED] }
        allocations:
          type: array
          items: { $ref: '#/components/schemas/PayableAllocation' }

    PayableAllocation:
      type: object
      required: [id, paymentNo, amount, paymentAmount, bizDate]
      properties:
        id: { type: integer, format: int64 }
        paymentNo: { type: string, example: PY20261023-0001 }
        amount: { type: integer, format: int64, description: 本行核销金额 }
        paymentAmount: { type: integer, format: int64, description: 付款单总额（同组相同） }
        bizDate: { type: string, format: date }
        remark: { type: string, nullable: true }

    PayableReconcile:
      type: object
      required: [purchaseAmount, returnAmount, paidAmount, balance,
                 paymentTotal, allocationTotal, balanced, conserved]
      properties:
        supplierId: { type: integer, format: int64, nullable: true }
        purchaseAmount: { type: integer, format: int64 }
        returnAmount: { type: integer, format: int64 }
        paidAmount: { type: integer, format: int64 }
        balance: { type: integer, format: int64 }
        paymentTotal: { type: integer, format: int64, description: Σ付款单金额 }
        allocationTotal: { type: integer, format: int64, description: Σ核销明细 }
        balanced:
          type: boolean
          description: balance == purchaseAmount − returnAmount − paidAmount
        conserved:
          type: boolean
          description: paymentTotal == allocationTotal == paidAmount

    SupplierPaymentRequest:
      type: object
      required: [supplierId, amount, allocations]
      properties:
        supplierId: { type: integer, format: int64 }
        amount: { type: integer, format: int64, minimum: 1 }
        bizDate: { type: string, format: date }
        remark: { type: string, maxLength: 500 }
        allocations:
          type: array
          minItems: 1
          description: Σamount 必须等于付款金额；同一 payableId 只出现一次
          items:
            type: object
            required: [payableId, amount]
            properties:
              payableId: { type: integer, format: int64 }
              amount: { type: integer, format: int64, minimum: 1 }

    SupplierPaymentResult:
      type: object
      required: [paymentNo, paymentAmount, allocations]
      properties:
        paymentNo: { type: string, example: PY20261023-0001 }
        paymentAmount: { type: integer, format: int64 }
        allocations:
          type: array
          items:
            type: object
            required: [payableId, amount]
            properties:
              payableId: { type: integer, format: int64 }
              amount: { type: integer, format: int64 }

    # ─────────────────────────── SYS · 审计与可观测（V2-5 追加式） ───────────────────────────

    AuditLog:
      type: object
      description: |
        一条操作审计（FR-SYS-06）。审计表是**追加型**的：没有 updated_at，
        数据库触发器拒绝任何 UPDATE/DELETE —— 写入后<b>不可篡改</b>。
      required: [id, action, resourceType, occurredAt, result]
      properties:
        id: { type: integer, format: int64 }
        actorId:
          type: integer
          format: int64
          description: 操作者 id；匿名操作（如登录失败）为 null
        actorName: { type: string, nullable: true, example: purchase_admin }
        action:
          type: string
          description: |
            动作语义（按**路径语义**归类，不是 HTTP 方法）：
            `POST /products/42/disable` 是 `DISABLE` 而不是 `CREATE`。
          enum: [CREATE, UPDATE, DELETE, DISABLE, SUBMIT, APPROVE, REJECT, VOID,
                 RECEIVE, SHIP, RESERVE, RELEASE, SETTLE_DAILY, SETTLE_MONTHLY,
                 LOGIN, COMMAND, OTHER]
        resourceType: { type: string, example: PURCHASE_ORDER }
        resourceId: { type: string, nullable: true, example: "42" }
        bizRefNo:
          type: string
          nullable: true
          description: 业务单据号，按单据追溯"这张单被谁动过"的入口
          example: PO20250601-0001
        beforeJson:
          type: string
          nullable: true
          description: |
            变更前字段值快照（JSON 文本）。取自该资源**上一次成功审计的 after_json**，
            因此历史快照片段首尾相接、可沿链回溯。首次创建为 null（如实表达"之前不存在"）。
            敏感字段（password/token/secret/apiKey）已脱敏为 `***`。
        afterJson:
          type: string
          nullable: true
          description: 变更后字段值快照（取自本次响应 data）。超大响应不记录（null），不截断。
        traceId:
          type: string
          nullable: true
          description: 与请求头 X-Trace-Id / MDC / 响应头同值
        ip: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }
        result: { type: string, enum: [SUCCESS, FAIL] }
        errorCode:
          type: string
          nullable: true
          description: 失败时的业务错误码（与 ApiError.code 一致，不是编造的）
          example: SYS_NOT_FOUND

    DictType:
      type: object
      required: [id, code, name, enabled]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: COLOR }
        name: { type: string, example: 颜色 }
        description: { type: string, nullable: true }
        enabled: { type: boolean, example: true }

    DictItem:
      type: object
      required: [id, typeCode, code, label, sortNo, enabled]
      properties:
        id: { type: integer, format: int64 }
        typeCode: { type: string, example: COLOR }
        code: { type: string, example: BLACK }
        label: { type: string, example: 黑色 }
        sortNo: { type: integer, example: 10 }
        enabled: { type: boolean, example: true }
    # ══════════════════════════════════════════════════════════════════
    # 契约清偿批 · 2026-10-24 追加的 schema（43 条缺口所需）
    # ══════════════════════════════════════════════════════════════════

    # ─── IAM · 认证 ───
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password:
          type: string
          minLength: 1
          maxLength: 128
          description: 明文密码，仅经 TLS 传输；服务端存 BCrypt 哈希且**永不回显**
        tenantCode:
          type: string
          maxLength: 32
          nullable: true
          description: |
            可选租户编码（B1）。多租户成员用它选择本次登录的行动租户；
            缺省 = 账号的主租户。未知编码与非成员返回同一个
            `IAM_TENANT_NOT_MEMBER`（403），不借错误码泄露租户是否存在；
            租户停用返回 `IAM_TENANT_DISABLED`（403）。租户校验在密码校验**之后**，
            避免把用户名枚举面扩大到"用户名 × 租户"。

    SwitchTenantRequest:
      type: object
      required: [tenantCode]
      properties:
        tenantCode:
          type: string
          minLength: 1
          maxLength: 32
          description: 目标租户编码；必须是当前账号的成员且租户处于启用状态

    TenantView:
      type: object
      description: |
        租户元数据（B1）。只包含界面展示与切换判断所需字段，不含幂等键/创建时间等内部元数据。
        出现在登录/切换/`/auth/me` 的 `tenants` 列表与平台租户管理页。
      required: [id, code, name, enabled]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, maxLength: 32 }
        name: { type: string, maxLength: 128 }
        enabled:
          type: boolean
          description: 停用租户的登录、切换与既有 token 全部拒绝（401/403）

    LoginResult:
      type: object
      required: [token, tokenType, username, permissions, mustChangePassword, passwordRules, tenantId, tenantCode, tenantName, tenants]
      properties:
        token:
          type: string
          description: Bearer JWT；切换租户后是**重新签发**的 token，`tid` 已变为目标租户
        tokenType: { type: string, enum: [Bearer], example: Bearer }
        username: { type: string }
        displayName: { type: string, nullable: true }
        roles:
          type: array
          description: 当前行动租户内的角色编码（不是所有租户的并集）
          items: { type: string }
        permissions:
          type: array
          description: 当前行动租户内的权限码并集（已排序）
          items: { type: string }
        mustChangePassword:
          type: boolean
          description: '`true` 表示必须先去改密。前端据此**直接跳改密页**，而不是等用户点开业务页收到一串 403'
        passwordExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: '密码过期时刻；`null` = 不按时间过期'
        passwordRules:
          type: array
          description: 当前生效的密码规则（人工可读），前端展示在改密页供用户照做
          items: { type: string }
        tenantId:
          type: integer
          format: int64
          description: 当前行动租户 id（= JWT 的 `tid` 声明）
        tenantCode: { type: string, maxLength: 32, description: 当前行动租户编码 }
        tenantName: { type: string, maxLength: 128, description: 当前行动租户显示名 }
        tenants:
          type: array
          description: |
            该账号的全部租户成员关系（含停用项，按 id 升序）。
            前端**只在 `length > 1` 时**显示租户切换器 —— 单租户用户不应看到切换入口。
          items: { $ref: '#/components/schemas/TenantView' }

    CurrentUserView:
      type: object
      required: [username, permissions, mustChangePassword, passwordRules, tenantId, tenantCode, tenantName, tenants]
      properties:
        username: { type: string }
        displayName: { type: string, nullable: true }
        roles:
          type: array
          description: 当前行动租户内的角色编码
          items: { type: string }
        permissions:
          type: array
          description: 当前行动租户内的权限码并集（已排序）
          items: { type: string }
        mustChangePassword: { type: boolean }
        passwordExpiresAt:
          type: string
          format: date-time
          nullable: true
        passwordRules:
          type: array
          items: { type: string }
        tenantId:
          type: integer
          format: int64
          description: 当前行动租户 id（= 当前 token 的 `tid`）；刷新页面后据此恢复顶栏
        tenantCode: { type: string, maxLength: 32 }
        tenantName: { type: string, maxLength: 128 }
        tenants:
          type: array
          description: 该账号的全部租户成员关系（含停用项，按 id 升序）；长度 > 1 才显示切换器
          items: { $ref: '#/components/schemas/TenantView' }

    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword: { type: string, minLength: 8, maxLength: 128 }
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
          description: 不满足复杂度或与旧密码相同 → `IAM_PASSWORD_WEAK`(400)

    # ─── IAM · 用户与角色 ───
    UserView:
      type: object
      description: |
        账号 DTO。**永不含 `passwordHash`** —— 也没有任何能反推它的字段。
        （测试 TC-IAM-037 专门断言响应里不出现 `$2a$` / `$2b$` / `passwordHash`。）
      required: [id, username, enabled, roles, permissions]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        displayName: { type: string, nullable: true }
        enabled: { type: boolean }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          description: 角色权限并集（已排序）
          items: { type: string }
        failedAttempts:
          type: integer
          minimum: 0
          description: 连续登录失败次数（达阈值即锁定）
        lockedUntil:
          type: string
          format: date-time
          nullable: true
        passwordExpiresAt:
          type: string
          format: date-time
          nullable: true
        mustChangePassword:
          type: boolean
          description: 新建账号与管理员重置密码都会置 true

    RoleView:
      type: object
      required: [id, code]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, maxLength: 32 }
        name: { type: string, nullable: true, maxLength: 64 }
        description: { type: string, nullable: true, maxLength: 200 }

    RolePermissionsView:
      type: object
      required: [role, permissions]
      properties:
        role: { $ref: '#/components/schemas/RoleView' }
        permissions:
          type: array
          items: { type: string }

    DataScopeView:
      type: object
      description: |
        数据权限范围。字符串**与写入同形**（读写对称）：
        `"ALL"` / `"SELF"` / `"WAREHOUSE:<id>"`。
      required: [direct, inherited]
      properties:
        direct:
          type: array
          description: 本账号直接配置的范围
          items: { type: string, example: WAREHOUSE:1 }
        inherited:
          type: array
          description: 从角色继承的范围
          items: { type: string }

    CreateIamUserRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, minLength: 8, maxLength: 128 }
        displayName: { type: string, maxLength: 64 }
        enabled:
          type: boolean
          default: true
          description: 省略或 null 视为 true
        roles:
          type: array
          description: 角色编码数组；引用未定义编码 → `IAM_ROLE_NOT_FOUND`(404)
          items: { type: string }

    ReplaceRolesRequest:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          description: "**覆盖式**，不是增量。不能清空自己的全部角色（400）"
          items: { type: string }

    SetEnabledRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    ResetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
          description: 响应**不回显**该明文

    CreateRoleRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 1, maxLength: 32 }
        name: { type: string, maxLength: 64 }
        description: { type: string, maxLength: 200 }

    ReplacePermissionsRequest:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          description: "**覆盖式**。改完的下一个请求即生效（无需重新登录）"
          items: { type: string }

    ReplaceScopesRequest:
      type: object
      required: [scopes]
      properties:
        scopes:
          type: array
          minItems: 1
          description: '**覆盖式**，不得为空（`@NotEmpty`）。取值 `"ALL"` / `"SELF"` / `"WAREHOUSE:<id>"`'
          items: { type: string, example: WAREHOUSE:1 }

    # ─── APS · 审批流 ───
    ApprovalStatus:
      type: string
      description: 审批实例的 7 态，**与单据的 DocumentStatus 无关**（两条独立状态线）
      enum: [DRAFT, PENDING, TRANSFERRED, APPROVED, REJECTED, WITHDRAWN, CANCELLED]

    ApprovalBizType:
      type: string
      description: 可走审批的单据类型
      enum: [PURCHASE_ORDER, SALES_ORDER, RETURN_ORDER]

    ApprovalStepStatus:
      type: string
      enum: [DEFINED, PENDING, APPROVED, REJECTED, SKIPPED]

    ApprovalStep:
      type: object
      description: |
        审批节点。实例里同一 schema 既承载"定义"也承载"走到哪了"：
        `thresholdAmount` 是进入条件，`status` 是当前快照。
        被金额阈值跳过的节点会留 `SKIPPED`，因此可以追溯"这次为什么没走财务"。
      required: [stepNo, name, approveMode, requiredApprovals, thresholdAmount, status]
      properties:
        stepNo: { type: integer, minimum: 1 }
        name: { type: string }
        approverPermission:
          type: string
          description: 该节点要求的具体权限码（如 `pur:approve` / `set:monthly`）
        approveMode:
          type: string
          description: '`ALL_SIGN` 会签需凑够 requiredApprovals 个**不同**的人；`SINGLE`/`ANY_SIGN` 一人同意即通过'
          enum: [SINGLE, ALL_SIGN, ANY_SIGN]
        requiredApprovals: { type: integer, minimum: 1 }
        thresholdAmount:
          type: integer
          format: int64
          minimum: 0
          description: 进入该节点的金额门槛（分）。`0` = 无条件必经
        status: { $ref: '#/components/schemas/ApprovalStepStatus' }
        approvedBy:
          type: array
          description: 已投票的 userId（同一人重复点击只算一票）
          items: { type: integer, format: int64 }
        decidedAt:
          type: string
          format: date-time
          nullable: true
        decisionBy:
          type: integer
          format: int64
          nullable: true
        remark:
          type: string
          nullable: true
          maxLength: 200

    ApprovalInstance:
      type: object
      required: [id, flowId, bizType, bizId, amount, currentStep, status, initiatorId, steps]
      properties:
        id: { type: integer, format: int64 }
        flowId: { type: integer, format: int64 }
        bizType: { $ref: '#/components/schemas/ApprovalBizType' }
        bizId: { type: integer, format: int64 }
        bizRefNo:
          type: string
          maxLength: 64
          description: 单据号（冗余存放，供审批列表直接展示）
        amount:
          type: integer
          format: int64
          minimum: 0
          description: 提交时由调用方传入的金额（分），**不是服务端回查单据**
        currentStep: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/ApprovalStatus' }
        initiatorId: { type: integer, format: int64 }
        steps:
          type: array
          items: { $ref: '#/components/schemas/ApprovalStep' }

    ApprovalFlow:
      type: object
      required: [id, code, bizType, enabled, steps]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        bizType: { $ref: '#/components/schemas/ApprovalBizType' }
        description: { type: string, nullable: true }
        enabled: { type: boolean }
        steps:
          type: array
          items: { $ref: '#/components/schemas/ApprovalStep' }

    SubmitApprovalRequest:
      type: object
      required: [bizType, bizId, bizRefNo, amount]
      properties:
        bizType: { $ref: '#/components/schemas/ApprovalBizType' }
        bizId: { type: integer, format: int64 }
        bizRefNo: { type: string, minLength: 1, maxLength: 64 }
        amount:
          type: integer
          format: int64
          minimum: 0
          description: 金额（分）。必须与用户看到的单据金额一致

    ApprovalDecisionRequest:
      type: object
      properties:
        remark:
          type: string
          maxLength: 200
          description: 审批意见（可选，整个 body 亦可省略）

    TransferApprovalRequest:
      type: object
      required: [targetUserId]
      properties:
        targetUserId:
          type: integer
          format: int64
          description: 目标人必须自身具备 `aps:approve`，否则 `APS_NOT_APPROVER`(403)
        remark: { type: string, maxLength: 200 }

    # ─── MDM · 更新与矩阵 ───
    ProductUpdate:
      type: object
      required: [name]
      description: '`code` 不可改（业务主键的可见部分）'
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        category: { type: string, maxLength: 64 }
        season: { type: string, maxLength: 32 }
        enabled:
          type: boolean
          description: 省略或 null 视为 true

    Sku:
      type: object
      required: [id, productId, color, size]
      properties:
        id: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        color: { type: string, maxLength: 32 }
        size: { type: string, maxLength: 16 }
        barcode: { type: string, nullable: true, maxLength: 64 }
        retailPriceAmount:
          type: integer
          format: int64
          minimum: 0
          description: 零售价（分）
        enabled: { type: boolean }
        seasonCode: { type: string, nullable: true, maxLength: 32, description: FR-MDM-08 季节编码（`SkuController.toMap:162`） }
        bandCode: { type: string, nullable: true, maxLength: 32, description: FR-MDM-08 波段编码（`SkuController.toMap:163`） }
        launchDate: { type: string, format: date, nullable: true, description: 上市日期（`SkuController.toMap:164`，`LocalDate.toString()`） }
        seasonYear:
          type: integer
          nullable: true
          description: 上市年份，由 `launchDate` 派生（`SkuController.toMap:165`）；无上市日期时为 null

    SkuUpdate:
      type: object
      description: |
        `productId`/`color`/`size` 构成业务唯一键，**不可改**；只改这三个字段。
        省略 `retailPriceAmount` 表示保持原值（不是置 0）。
      properties:
        barcode: { type: string, maxLength: 64 }
        retailPriceAmount: { type: integer, format: int64, minimum: 0 }
        enabled: { type: boolean }
        seasonCode: { type: string, maxLength: 32 }
        bandCode: { type: string, maxLength: 32 }
        launchDate: { type: string, format: date }

    SkuMatrixCreate:
      type: object
      required: [productId, colors, sizes]
      properties:
        productId: { type: integer, format: int64 }
        colors:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        sizes:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        retailPriceAmount: { type: integer, format: int64, minimum: 0 }
        enabled: { type: boolean }

    SkuMatrixResult:
      type: object
      required: [created, createdCount, skipped]
      properties:
        created:
          type: array
          items: { $ref: '#/components/schemas/Sku' }
        createdCount: { type: integer, minimum: 0 }
        skipped:
          type: integer
          minimum: 0
          description: 已存在而被跳过的组合数（幂等友好：重复铺矩阵不会报错）

    # ─── INV · 内部控制端点 ───
    ShipRequest:
      type: object
      required: [skuId, warehouseId, qty, bizRefNo]
      properties:
        skuId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        qty:
          type: integer
          minimum: 1
          description: 出库数量。不足 → `INV_INSUFFICIENT_STOCK`(409)，整单回滚
        bizRefNo:
          type: string
          minLength: 1
          description: 业务单号（写入流水，便于溯源）

    # ═══════════════════════════════════════════════════════════════════
    # V2-C2「契约清偿 2」补写：V2-3 销售闭环 schema
    #   金额一律 integer/int64「分」（ADR-0005，本批无任何 float/double）
    # ═══════════════════════════════════════════════════════════════════

    # ─── SAL · 报价单 ───
    SalesQuote:
      type: object
      description: |
        报价单（FR-SAL-05）。与出货单的分界：报价单**不预占库存、不进账期统计**，
        `COMPLETED` 只由「转化为出货单」产生，并用 `convertedOrderId` 留下溯源指向。
      required: [id, quoteNo, status, customerId, totalAmount, totalQty, lines]
      properties:
        id: { type: integer, format: int64 }
        quoteNo: { type: string, example: SQ20261023-0001 }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        customerId: { type: integer, format: int64 }
        bizDate: { type: string, format: date }
        validUntil:
          type: string
          format: date
          nullable: true
          description: 报价有效期；null = 不限。过期后不可转化（`SAL_QUOTE_STATUS_ILLEGAL`）
        totalAmount: { type: integer, format: int64, minimum: 0, description: 合计金额（分） }
        totalQty: { type: integer, minimum: 0, description: 合计件数 }
        remark: { type: string, nullable: true, maxLength: 500 }
        convertedOrderId:
          type: integer
          format: int64
          nullable: true
          description: 转化生成的出货单 id；null = 尚未转化
        lines:
          type: array
          items: { $ref: '#/components/schemas/SalesQuoteLine' }

    SalesQuoteLine:
      type: object
      required: [id, lineNo, skuId, qty, unitPriceAmount, discountRate, amount]
      properties:
        id: { type: integer, format: int64 }
        lineNo: { type: integer, minimum: 1 }
        skuId: { type: integer, format: int64 }
        qty: { type: integer, minimum: 1 }
        unitPriceAmount: { type: integer, format: int64, minimum: 0, description: 单价（分） }
        discountRate:
          type: integer
          minimum: 1
          maximum: 10000
          description: 折扣率，**整数万分比**（9000 = 9 折，10000 = 不打折），禁止浮点
        amount:
          type: integer
          format: int64
          minimum: 0
          description: 行金额（分）= floor(qty × unitPriceAmount × discountRate ÷ 10000)

    SalesQuoteCreate:
      type: object
      required: [customerId, lines]
      properties:
        customerId: { type: integer, format: int64 }
        bizDate:
          type: string
          format: date
          description: 省略 = 当天（`ClockProvider`）；所在账期已锁账 → `SET_PERIOD_CLOSED`
        validUntil:
          type: string
          format: date
          description: 省略 = 不限有效期；不能早于 `bizDate`
        remark: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          description: 同一 SKU 不能重复成两行
          items: { $ref: '#/components/schemas/SalesQuoteLineCreate' }

    SalesQuoteLineCreate:
      type: object
      required: [skuId, qty, unitPriceAmount]
      properties:
        skuId: { type: integer, format: int64 }
        qty: { type: integer, minimum: 1 }
        unitPriceAmount: { type: integer, format: int64, minimum: 0, description: 单价（分） }
        discountRate:
          type: integer
          minimum: 1
          maximum: 10000
          default: 10000
          description: 整数万分比；省略 = 10000（不打折）

    SalesQuoteConvert:
      type: object
      description: |
        转化参数。**整个请求体可省略**（`required = false`），等价于 `{}` = 自动选仓。
      properties:
        warehouseId:
          type: integer
          format: int64
          description: |
            指定出货仓；**省略 = 按 `warehouses.priority` 自动选仓/拆分配**
            （与 `POST /sales-orders/auto-split` 同一套分配算法）
        remark:
          type: string
          maxLength: 500
          description: 省略则沿用报价单的备注

    # ─── SAL · 自动选仓建单 ───
    SalesOrderAutoSplitCreate:
      type: object
      description: |
        自动选仓建单（FR-SAL-11）请求体。与 `SalesOrderCreate` 的区别只有一处：
        **没有 `warehouseId`** —— 仓位由服务端按 priority 逐仓吃量决定。
      required: [customerId, lines]
      properties:
        customerId: { type: integer, format: int64 }
        bizDate: { type: string, format: date, description: 省略 = 当天 }
        remark: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [qty, unitPriceAmount]
            description: |
              每行**必须且只能**指定 `skuId` 或 `bundleId` 之一：
              两者都给或都不给 → `SYS_VALIDATION_ERROR`（"每行必须且只能指定 skuId 或 bundleId 之一"）
              `unitPriceAmount` 与 `SalesOrderCreate` 共用同一个 `LineRequest`，
              带 `@NotNull @Min(0)`（`SalesOrderController.java:50`），所以**套装行也要给**（给 0 即可）。
            properties:
              skuId: { type: integer, format: int64, description: 单品行 }
              bundleId:
                type: integer
                format: int64
                description: |
                  套装行（FR-SAL-10）：服务端展开成组件行并按组件 `retailPriceAmount` 计价，
                  **忽略本行的 `unitPriceAmount`**
              qty:
                type: integer
                minimum: 1
                description: 单品件数，或套装套数
              unitPriceAmount:
                type: integer
                format: int64
                minimum: 0
                description: 单价（分）；套装行忽略
              discountRate:
                type: integer
                minimum: 1
                maximum: 10000
                default: 10000
                description: 整数万分比，禁止浮点（ADR-0005）

    SalesOrderAllocation:
      type: object
      description: |
        一个出货单行在**某个仓**的预占分配量。自动选仓时一行可跨多仓 → 多个元素。
        守恒：`Σ allocations[].qty == line.qty`（预占 id 见同字段 `reservationIds`）。
      required: [warehouseId, qty]
      properties:
        warehouseId:
          type: integer
          format: int64
          description: 预占所在仓（来自库存预占记录，不是单据头上的代表仓）
        qty: { type: integer, minimum: 1, description: 本仓分配件数 }

    # ─── SAL · 套装 ───
    ProductBundle:
      type: object
      description: 组合商品/套装（FR-SAL-10）。自身无库存行，可用量由组件推导。
      required: [id, code, name, priceAmount, enabled, items]
      properties:
        id: { type: integer, format: int64 }
        code:
          type: string
          minLength: 2
          maxLength: 32
          description: 唯一编码，**创建后不可修改**
          example: BUNDLE-DENIM-01
        name: { type: string, maxLength: 128 }
        priceAmount:
          type: integer
          format: int64
          minimum: 0
          description: 展示用套装价（分）；建单时**不使用**它，组件各自按零售价计价
        enabled: { type: boolean }
        items:
          type: array
          items: { $ref: '#/components/schemas/BundleItem' }

    BundleItem:
      type: object
      required: [id, componentSkuId, ratioQty]
      properties:
        id: { type: integer, format: int64 }
        componentSkuId: { type: integer, format: int64 }
        ratioQty:
          type: integer
          minimum: 1
          description: 配比 = 一套吃掉几件该组件（整数，无小数配比）

    ProductBundleCreate:
      type: object
      required: [code, name, items]
      properties:
        code: { type: string, minLength: 2, maxLength: 32 }
        name: { type: string, maxLength: 128 }
        priceAmount:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: 省略 = 0
        enabled: { type: boolean, default: true, description: 省略 = 启用 }
        items:
          type: array
          minItems: 1
          description: 同一组件 SKU 只能出现一次
          items: { $ref: '#/components/schemas/BundleItemCreate' }

    ProductBundleUpdate:
      type: object
      description: 全量覆盖；**不含 `code`**（编码不可改）
      required: [name, items]
      properties:
        name: { type: string, maxLength: 128 }
        priceAmount: { type: integer, format: int64, minimum: 0, default: 0 }
        enabled: { type: boolean, default: true }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/BundleItemCreate' }

    BundleItemCreate:
      type: object
      required: [componentSkuId, ratioQty]
      properties:
        componentSkuId: { type: integer, format: int64 }
        ratioQty: { type: integer, minimum: 1 }

    BundleAvailability:
      type: object
      description: |
        套装可用量（INV-16）。算式：
        `availableQty = min over components of floor(component.availableQty ÷ component.ratioQty)`
      required: [bundleId, warehouseId, availableQty, components]
      properties:
        bundleId: { type: integer, format: int64 }
        warehouseId:
          type: integer
          format: int64
          nullable: true
          description: null = 本次是全仓汇总口径（请求未带 warehouseId）
        availableQty:
          type: integer
          minimum: 0
          description: 可成套数量 = 各组件 maxBundles 的最小值；组件清单为空时为 0
        components:
          type: array
          description: 逐组件的撑套能力，用于复核上面的算式
          items: { $ref: '#/components/schemas/BundleComponentAvailability' }

    BundleComponentAvailability:
      type: object
      required: [componentSkuId, ratioQty, availableQty, maxBundles]
      properties:
        componentSkuId: { type: integer, format: int64 }
        ratioQty: { type: integer, minimum: 1 }
        availableQty:
          type: integer
          minimum: 0
          description: 该组件在口径范围内的可用量（余额 − 预占）
        maxBundles:
          type: integer
          minimum: 0
          description: '= floor(availableQty ÷ ratioQty)，本组件单独能撑起的套数'

    # ─── SAL · 发货作业 ───
    ShipmentStatus:
      type: string
      description: |
        发货单状态机（FR-SAL-06）。**不是**共享 `DocumentStatus`：
        发货单不参与收付款与账期统计，所以独立成枚举。
        DRAFT →（首次扫码）PICKING →（扫满）PICKED →（确认）COMPLETED
      enum: [DRAFT, PICKING, PICKED, COMPLETED, VOIDED]

    ShipmentPlan:
      type: object
      description: 一次发货计划及其按仓拆出的发货单
      required: [planId, planNo, salesOrderId, shipments]
      properties:
        planId: { type: integer, format: int64 }
        planNo: { type: string, example: SP20261023-0001 }
        salesOrderId: { type: integer, format: int64 }
        shipments:
          type: array
          minItems: 1
          description: 一仓一张；跨仓订单一次计划会产生多张
          items: { $ref: '#/components/schemas/Shipment' }

    Shipment:
      type: object
      required: [id, shipmentNo, planId, salesOrderId, warehouseId, status, lines]
      properties:
        id: { type: integer, format: int64 }
        shipmentNo: { type: string, example: SP20261023-0002 }
        planId: { type: integer, format: int64, description: 所属发货计划 }
        salesOrderId: { type: integer, format: int64 }
        warehouseId:
          type: integer
          format: int64
          description: 本张发货单的出库仓 = 预占所在仓
        status: { $ref: '#/components/schemas/ShipmentStatus' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/ShipmentLine' }

    ShipmentLine:
      type: object
      required: [id, shipmentLineId, lineNo, salesOrderLineId, skuId, reservationId,
                 plannedQty, pickedQty]
      properties:
        id: { type: integer, format: int64 }
        shipmentLineId:
          type: integer
          format: int64
          description: 与 `id` 同值，专为扫码请求体（`scan.shipmentLineId`）提供的别名字段
        lineNo: { type: integer, minimum: 1 }
        salesOrderLineId: { type: integer, format: int64 }
        skuId: { type: integer, format: int64 }
        reservationId:
          type: integer
          format: int64
          description: |
            来源预占 id —— 拣货行**就是**一条 ACTIVE 预占分段（DB 唯一约束保证一条预占
            只被一个拣货行占用），确认发货时消费它。恒有值，不是可选字段
        batchNo:
          type: string
          nullable: true
          description: FEFO 选定的批次号（继承自预占，发货时不重算）
        plannedQty:
          type: integer
          minimum: 1
          description: 计划数量 = 预占数量；扫码上限
        pickedQty: { type: integer, minimum: 0, description: 累计已扫数量，不得超 `plannedQty` }

    ShipmentScanRequest:
      type: object
      required: [shipmentLineId, qty]
      properties:
        shipmentLineId:
          type: integer
          format: int64
          description: 必须属于路径上的这张发货单，否则 `SYS_NOT_FOUND`
        qty:
          type: integer
          minimum: 1
          description: 本次扫码件数（**累加**到 `pickedQty`，不是设置绝对值）
        barcode:
          type: string
          description: 可选；提供时必须与该 SKU 条码一致，否则 `SYS_VALIDATION_ERROR`
          example: '6901000001'

    # ─── SAL · 应收 / 收款 ───
    CustomerReceivable:
      type: object
      description: |
        客户应收（FR-SAL-07），一单一行（`UNIQUE (sales_order_id)`）。守恒（INV-AR）：
        `balance = shippedAmount − returnedAmount − receivedAmount`，
        由 DB CHECK `ck_receivable_balance` 强制，任何写入路径都绕不过。
      required: [id, salesOrderId, customerId, shippedAmount, returnedAmount,
                 receivedAmount, balance, status, overdue]
      properties:
        id: { type: integer, format: int64 }
        salesOrderId: { type: integer, format: int64, description: 聚合来源的出货单，一单一应收 }
        customerId: { type: integer, format: int64 }
        bizDate: { type: string, format: date, description: 出货日期（继承自出货单） }
        dueDate:
          type: string
          format: date
          nullable: true
          description: 应收到期日 = `bizDate + 客户 creditDays`；null = 未约定账期，永不判逾期
        shippedAmount: { type: integer, format: int64, minimum: 0, description: 累计出货金额（分） }
        returnedAmount: { type: integer, format: int64, minimum: 0, description: 累计退货冲减（分） }
        receivedAmount: { type: integer, format: int64, minimum: 0, description: 累计已核销收款（分） }
        balance:
          type: integer
          format: int64
          minimum: 0
          description: 未收余额（分）= shipped − returned − received
        status:
          type: string
          enum: [OPEN, SETTLED, VOIDED]
          description: |
            只有三态：`OPEN` 含**部分核销**（剩余由 `balance` 表达，没有 PARTIAL 状态）；
            `SETTLED` = 余额清零；`VOIDED` 由原出货单红冲作废带来，不再参与汇总与核销
        overdue:
          type: boolean
          description: '= status OPEN 且 balance > 0 且 dueDate < 当天（日期来自 ClockProvider）'

    ReceivableSummary:
      type: object
      description: 客户应收汇总（排除 VOIDED 单据），全部为整数分
      required: [customerId, shippedAmount, returnedAmount, receivedAmount, balance, overdueAmount]
      properties:
        customerId: { type: integer, format: int64 }
        shippedAmount: { type: integer, format: int64, minimum: 0 }
        returnedAmount: { type: integer, format: int64, minimum: 0 }
        receivedAmount: { type: integer, format: int64, minimum: 0 }
        balance:
          type: integer
          format: int64
          description: '= shippedAmount − returnedAmount − receivedAmount'
        overdueAmount:
          type: integer
          format: int64
          minimum: 0
          description: 其中已逾期未收的部分（分）；也是信用敞口的组成部分

    CustomerReceipt:
      type: object
      description: 收款单（FR-SAL-08）。`Σ allocations[].amount == amount` 是入库即成立的硬守恒。
      required: [id, receiptNo, customerId, amount, bizDate, allocations]
      properties:
        id: { type: integer, format: int64 }
        receiptNo: { type: string, example: RC20261023-0001 }
        customerId: { type: integer, format: int64 }
        amount:
          type: integer
          format: int64
          minimum: 1
          description: 收款金额（分），必须等于核销明细合计
        bizDate: { type: string, format: date }
        remark: { type: string, nullable: true, maxLength: 500 }
        allocations:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CustomerReceiptAllocation' }

    CustomerReceiptAllocation:
      type: object
      required: [id, receivableId, amount]
      properties:
        id: { type: integer, format: int64 }
        receivableId: { type: integer, format: int64 }
        amount:
          type: integer
          format: int64
          minimum: 1
          description: 本次对该应收的核销金额（分）；可以小于其 balance（部分核销）

    CustomerReceiptCreate:
      type: object
      required: [customerId, amount, allocations]
      properties:
        customerId: { type: integer, format: int64 }
        amount:
          type: integer
          format: int64
          minimum: 1
          description: 收款金额（分）。**必须精确等于** allocations 合计 → 否则 `SAL_RECEIPT_UNBALANCED`
        bizDate: { type: string, format: date, description: 省略 = 当天；账期已锁 → `SET_PERIOD_CLOSED` }
        remark: { type: string, maxLength: 500 }
        allocations:
          type: array
          minItems: 1
          description: |
            Σamount 必须等于 `amount`；同一 `receivableId` 只能出现一次；
            每条不得超过该应收的 `balance`（超 → `SAL_RECEIPT_OVER_ALLOCATED`）；
            不得跨客户核销（→ `SAL_RECEIVABLE_NOT_FOUND` 404）
          items:
            type: object
            required: [receivableId, amount]
            properties:
              receivableId: { type: integer, format: int64 }
              amount: { type: integer, format: int64, minimum: 1 }

    # ─── SAL · 客户信用 ───
    CustomerCredit:
      type: object
      description: |
        信用视图（FR-SAL-09）。敞口口径：
        `exposureAmount = 应收未收余额 + 未出货订单金额`。

        额度超限**不在信用端点报错**：调低额度允许历史敞口挂账，
        超限在下一次建单/转化时以 `SAL_CREDIT_LIMIT_EXCEEDED`(409) 拒绝
        （`POST /sales-orders`、`POST /sales-orders/auto-split`、`POST /sales-quotes/{id}/convert`）。
      required: [customerId, creditLimit, creditDays, exposureAmount, availableCredit, overdueAmount]
      properties:
        customerId: { type: integer, format: int64 }
        creditLimit:
          type: integer
          format: int64
          minimum: 0
          description: 授信额度（分）；**0 = 不设限**
        creditDays:
          type: integer
          minimum: 0
          description: 账期天数；0 = 现结（应收无到期宽限）
        exposureAmount:
          type: integer
          format: int64
          minimum: 0
          description: 当前敞口（分）= 应收未收余额 + 未出货订单金额
        availableCredit:
          type: integer
          format: int64
          description: |
            可用额度（分）= `creditLimit − exposureAmount`，下限 0。
            **哨兵值 `-1` = 不设限**（`creditLimit = 0` 时），不是负数欠款
        overdueAmount: { type: integer, format: int64, minimum: 0, description: 逾期金额（分） }
        snapshotDate:
          type: string
          format: date
          nullable: true
          description: 本次计算所用当天（ClockProvider）；供对账复现口径

    CustomerCreditUpdate:
      type: object
      required: [creditLimit, creditDays]
      properties:
        creditLimit:
          type: integer
          format: int64
          minimum: 0
          description: 授信额度（分）；0 = 取消信用控制（不设限）
        creditDays:
          type: integer
          minimum: 0
          description: 账期天数；0 = 现结

    # ═════════ V3-2 财务中心 schemas（tag: fin，W2 泳道纯追加）═════════
    # ★ 这里的所有金额字段都是「元」两位小数（FinMoney），区别于业务域「分」：
    #   财务域是复式记账展示口径（简报 §5），换算发生在生成凭证处。
    FinMoney:
      type: number
      format: double
      description: 金额（元，两位小数；Java 侧 BigDecimal，舍入 HALF_UP）
      example: 1234.56

    FinAccountCategory:
      type: string
      enum: [ASSET, LIABILITY, EQUITY, COST, REVENUE, EXPENSE]

    FinAccountDirection:
      type: string
      enum: [DEBIT, CREDIT]

    FinAccount:
      type: object
      required: [id, code, name, category, direction, leaf, enabled]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: '1122' }
        name: { type: string, example: 应收账款 }
        parentId: { type: integer, format: int64, nullable: true }
        category: { $ref: '#/components/schemas/FinAccountCategory' }
        categoryLabel: { type: string, example: 资产 }
        direction: { $ref: '#/components/schemas/FinAccountDirection' }
        directionLabel: { type: string, example: 借 }
        leaf: { type: boolean, description: 仅末级科目可记账 }
        initBalance: { $ref: '#/components/schemas/FinMoney' }
        enabled: { type: boolean }
        remark: { type: string, nullable: true }

    FinAccountCreate:
      type: object
      required: [code, name, category, direction]
      properties:
        code: { type: string, minLength: 1, maxLength: 32 }
        name: { type: string, minLength: 1, maxLength: 64 }
        parentId: { type: integer, format: int64, nullable: true }
        category: { $ref: '#/components/schemas/FinAccountCategory' }
        direction: { $ref: '#/components/schemas/FinAccountDirection' }
        initBalance: { $ref: '#/components/schemas/FinMoney' }
        enabled: { type: boolean, default: true }
        remark: { type: string, maxLength: 255 }

    FinAccountUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        direction: { $ref: '#/components/schemas/FinAccountDirection' }
        initBalance: { $ref: '#/components/schemas/FinMoney' }
        enabled: { type: boolean }
        remark: { type: string, maxLength: 255 }

    FinVoucherLine:
      type: object
      required: [lineNo, accountId, accountCode, summary]
      properties:
        id: { type: integer, format: int64 }
        lineNo: { type: integer }
        accountId: { type: integer, format: int64 }
        accountCode: { type: string, description: 冗余科目编码（报表/审计锚点） }
        summary: { type: string, maxLength: 128 }
        debit: { $ref: '#/components/schemas/FinMoney' }
        credit: { $ref: '#/components/schemas/FinMoney' }

    FinVoucher:
      type: object
      required: [id, voucherNo, voucherDate, period, sourceType, status, totalDebit, totalCredit]
      properties:
        id: { type: integer, format: int64 }
        voucherNo: { type: string, example: PZ20261001-0001 }
        voucherDate: { type: string, format: date }
        period: { type: string, pattern: '^\d{4}-\d{2}$' }
        sourceType: { type: string, enum: [MANUAL, PUR_IN, SAL_OUT, PUR_PAY, SAL_RCV, EXPENSE, INVOICE] }
        sourceTypeLabel: { type: string }
        sourceId: { type: integer, format: int64, nullable: true }
        sourceNo: { type: string, nullable: true }
        status: { type: string, enum: [DRAFT, AUDITED, POSTED] }
        statusLabel: { type: string }
        totalDebit: { $ref: '#/components/schemas/FinMoney' }
        totalCredit: { $ref: '#/components/schemas/FinMoney' }
        summary: { type: string, nullable: true, description: 列表视图 = 首条分录摘要 }
        lineCount: { type: integer }
        createdBy: { type: integer, format: int64, nullable: true }
        auditedBy: { type: integer, format: int64, nullable: true }
        postedAt: { type: string, nullable: true }
        remark: { type: string, nullable: true }
        lines:
          type: array
          items: { $ref: '#/components/schemas/FinVoucherLine' }

    FinVoucherCreate:
      type: object
      required: [lines]
      properties:
        voucherDate: { type: string, format: date, description: 省略 = 业务时钟今天 }
        remark: { type: string, maxLength: 255 }
        lines:
          type: array
          minItems: 2
          items:
            type: object
            required: [accountId]
            properties:
              accountId: { type: integer, format: int64 }
              summary: { type: string, maxLength: 128 }
              debit: { $ref: '#/components/schemas/FinMoney' }
              credit: { $ref: '#/components/schemas/FinMoney' }

    BankAccount:
      type: object
      required: [id, code, name, balance, enabled]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        bankName: { type: string, nullable: true }
        accountNo: { type: string, nullable: true }
        currency: { type: string, example: CNY }
        balance: { $ref: '#/components/schemas/FinMoney' }
        isDefault: { type: boolean, description: 收付款自动日记账的落点，每租户至多一个 }
        enabled: { type: boolean }
        remark: { type: string, nullable: true }

    BankAccountCreate:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 1, maxLength: 32 }
        name: { type: string, minLength: 1, maxLength: 64 }
        bankName: { type: string, maxLength: 64 }
        accountNo: { type: string, maxLength: 64 }
        currency: { type: string, default: CNY }
        initBalance: { $ref: '#/components/schemas/FinMoney' }
        isDefault: { type: boolean }
        enabled: { type: boolean, default: true }
        remark: { type: string, maxLength: 255 }

    BankAccountUpdate:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 1, maxLength: 32 }
        name: { type: string, minLength: 1, maxLength: 64 }
        bankName: { type: string, maxLength: 64 }
        accountNo: { type: string, maxLength: 64 }
        currency: { type: string, default: CNY }
        initBalance: { $ref: '#/components/schemas/FinMoney', description: 账面余额（仅初始化调整用） }
        isDefault: { type: boolean }
        enabled: { type: boolean }
        remark: { type: string, maxLength: 255 }

    CashJournalEntry:
      type: object
      required: [id, accountId, bizDate, direction, amount, balance]
      properties:
        id: { type: integer, format: int64 }
        accountId: { type: integer, format: int64 }
        bizDate: { type: string, format: date }
        direction: { type: string, enum: [DEBIT, CREDIT], description: DEBIT 收 / CREDIT 支（资产账户借增贷减） }
        directionLabel: { type: string }
        amount: { $ref: '#/components/schemas/FinMoney' }
        balance: { $ref: '#/components/schemas/FinMoney', description: 当日余额 = 上日余额 + 借 − 贷 }
        sourceType: { type: string }
        sourceId: { type: integer, format: int64, nullable: true }
        summary: { type: string }

    CashJournalCreate:
      type: object
      required: [accountId, direction, amount]
      properties:
        accountId: { type: integer, format: int64 }
        bizDate: { type: string, format: date }
        direction: { type: string, enum: [DEBIT, CREDIT] }
        amount: { $ref: '#/components/schemas/FinMoney' }
        summary: { type: string, maxLength: 128 }

    FinExpense:
      type: object
      required: [id, expenseNo, applicantName, expenseType, amount, status, applyDate]
      properties:
        id: { type: integer, format: int64 }
        expenseNo: { type: string, example: BX20261001-0001 }
        applicantId: { type: integer, format: int64, nullable: true }
        applicantName: { type: string }
        departmentId: { type: integer, format: int64, nullable: true }
        departmentName: { type: string, nullable: true }
        expenseType: { type: string, example: 差旅费 }
        amount: { $ref: '#/components/schemas/FinMoney' }
        status: { type: string, enum: [DRAFT, SUBMITTED, APPROVED, PAID] }
        statusLabel: { type: string }
        applyDate: { type: string, format: date }
        rejectReason: { type: string, nullable: true, description: 驳回原因（状态回 DRAFT 后仍保留） }
        paidAt: { type: string, nullable: true }
        remark: { type: string, nullable: true }
        lines:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, format: int64 }
              lineNo: { type: integer }
              expenseItem: { type: string }
              amount: { $ref: '#/components/schemas/FinMoney' }
              invoiceNo: { type: string, nullable: true }
              remark: { type: string, nullable: true }

    FinExpenseCreate:
      type: object
      required: [expenseType, lines]
      properties:
        expenseType: { type: string, maxLength: 32 }
        departmentId: { type: integer, format: int64, nullable: true }
        departmentName: { type: string, maxLength: 64 }
        applyDate: { type: string, format: date }
        remark: { type: string, maxLength: 255 }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [expenseItem, amount]
            properties:
              expenseItem: { type: string, maxLength: 64 }
              amount: { $ref: '#/components/schemas/FinMoney' }
              invoiceNo: { type: string, maxLength: 64 }
              remark: { type: string, maxLength: 255 }

    FinInvoice:
      type: object
      required: [id, invoiceNo, type, partnerName, amount, taxAmount, totalAmount, invoiceDate, status]
      properties:
        id: { type: integer, format: int64 }
        invoiceNo: { type: string }
        type: { type: string, enum: [OUTPUT, INPUT] }
        typeLabel: { type: string }
        partnerId: { type: integer, format: int64, nullable: true }
        partnerName: { type: string }
        amount: { $ref: '#/components/schemas/FinMoney', description: 不含税 }
        taxAmount: { $ref: '#/components/schemas/FinMoney' }
        totalAmount: { $ref: '#/components/schemas/FinMoney', description: 价税合计 = amount + taxAmount（DB CHECK） }
        invoiceDate: { type: string, format: date }
        sourceType: { type: string, enum: [PURCHASE_ORDER, SALES_ORDER], nullable: true }
        sourceId: { type: integer, format: int64, nullable: true }
        status: { type: string, enum: [NORMAL, VOID] }
        statusLabel: { type: string }
        remark: { type: string, nullable: true }

    FinInvoiceCreate:
      type: object
      required: [invoiceNo, type, partnerName, amount]
      properties:
        invoiceNo: { type: string, minLength: 1, maxLength: 64 }
        type: { type: string, enum: [OUTPUT, INPUT] }
        partnerId: { type: integer, format: int64, nullable: true }
        partnerName: { type: string, maxLength: 64 }
        amount: { $ref: '#/components/schemas/FinMoney' }
        taxAmount: { $ref: '#/components/schemas/FinMoney', description: 省略 = 0（免税） }
        invoiceDate: { type: string, format: date }
        sourceType: { type: string, enum: [PURCHASE_ORDER, SALES_ORDER] }
        sourceId: { type: integer, format: int64 }
        remark: { type: string, maxLength: 255 }
