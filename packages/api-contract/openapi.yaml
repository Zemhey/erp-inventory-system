        '404': { $ref: '#/components/responses/NotFound' }
  # ══════════════════════════════════════════════════════════════════════════
  # 契约清偿批 · 2026-10-24
  #
  # 本段清偿 ApiContractMappingIT.UNDOCUMENTED_DEBT 的 43 条文档债：
  #   legacy 17 条（IAM 2 + 库存内部 3 + 主数据 5 + 单据工作流 7）
  #   V2-6   26 条（认证 1 + 用户与角色 11 + 数据权限 4 + 审批 10）
  # 来源：V2-6 用 .plan/V2-6-契约变更申请.md 的现成规范；
  #       legacy 17 条由 Controller 源码反推（见 .plan/契约清偿-报告.md §5）。
  #
  # ★ 本段**只追加**：全部新路径置于 paths 末尾，未重排任何既有路径。
  # ★ X-Request-Id 口径（本次新建的规范，见 docs/05 §4.4）：
  #     create / convert / update  → **声明**
  #     transition（只改状态）/ read → **不声明**，幂等由状态机或乐观锁保证。
  #   理由：状态迁移的幂等性来自领域不变量（DocumentStatusMachine 拒绝非法转移），
  #   不是来自客户端请求键。给它加幂等键等于把幂等责任从领域模型挪到基础设施，
  #   是架构降级而不是升级。
  # ══════════════════════════════════════════════════════════════════════════

  # ─────────────────── IAM · 认证（FR-IAM-06） ───────────────────

  /auth/login:
    post:
      tags: [iam]
      summary: 登录换取 JWT
      description: |
        匿名接口（`SecurityConfig` permitAll），**不需要** Authorization 头。

        响应 `data` 里除 token 与权限并集外，V2-6 追加 3 个字段：
        `mustChangePassword` / `passwordExpiresAt` / `passwordRules`。
        前端据 `mustChangePassword` **直接跳改密页**，而不是让用户点开业务页
        再吃一串 403 —— 这是可观测性上的差异，不是可有可无的装饰。

        ★ 行为变更：`mustChangePassword=true` 时**除改密与 `/auth/me` 外
        所有请求返回 403 `IAM_PASSWORD_EXPIRED`**，所有端（Web/小程序/Android）必须处理。

        幂等：本端点是状态迁移型（只会换出一个新 token，无持久数量副作用），
        **不消费 `X-Request-Id`**；重复登录只会产生多个彼此独立的有效 token。
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功；`data.token` 为 Bearer JWT
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginResult' }
        '400':
          description: '`SYS_VALIDATION_ERROR` —— 用户名/密码缺失或超长'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: '`IAM_BAD_CREDENTIALS` —— 用户名或密码错误（刻意不区分"用户不存在"，防枚举；消息带剩余尝试次数）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403':
          description: '`IAM_ACCOUNT_DISABLED` 账号已停用'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '423':
          description: '`IAM_ACCOUNT_LOCKED` —— 连续错误达阈值已锁定，消息带解锁时间'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /auth/me:
    get:
      tags: [iam]
      summary: 当前登录用户（刷新页面后恢复权限菜单）
      description: |
        无状态 JWT 的"登出"就是客户端丢弃 token，因此**不提供 `/logout`**：
        提供一个假的登出接口会让人误以为服务端吊销了 token。
        需要真正强制下线时应引入 token 黑名单或短 token + refresh token，属未实现项。

        同样返回 `mustChangePassword` / `passwordExpiresAt` / `passwordRules`，
        让"密码过期"状态在刷新后仍然可见。
      operationId: getCurrentUser
      responses:
        '200':
          description: 当前用户信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CurrentUserView' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/change-password:
    post:
      tags: [iam]
      summary: 修改自己的密码（密码过期状态下唯一可用的写接口）
      description: |
        **刻意不加业务权限码**：这是"任何人对自己账号"的操作。要求一个业务权限码
        才能改密码，会让"刚被撤权的用户"无法更新自己的密码 —— 而他恰恰最需要改。

        改密成功后旧 token 仍然有效（JWT 无状态）；除 `mustChangePassword` 清零外
        没有别的状态变化，因此不强制重新登录。

        幂等：状态迁移型（`mustChangePassword` 单次翻转），**不消费 `X-Request-Id`**；
        重复提交会因旧密码已变化而在第二次返回 `IAM_BAD_CREDENTIALS`，不会产生额外副作用。
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: 改密成功；`data.mustChangePassword` 已置 false
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          changed: { type: boolean, example: true }
                          mustChangePassword: { type: boolean, example: false }
        '400':
          description: '`IAM_PASSWORD_WEAK` —— 新密码不满足复杂度（长度/字符类别/弱口令），或与旧密码相同'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: '`IAM_BAD_CREDENTIALS`（旧密码错）/ `IAM_UNAUTHENTICATED`（未登录）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  # ─────────────────── IAM · 用户管理（FR-IAM-05） ───────────────────

  /iam/users:
    get:
      tags: [iam]
      summary: 账号清单
      description: '权限码 `iam:read`。账号 DTO **永不含 passwordHash**（测试 TC-IAM-037 专门断言响应里不出现 `$2a$`/`$2b$`）。'
      operationId: listIamUsers
      parameters:
        - name: keyword
          in: query
          description: 用户名/显示名模糊匹配
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/PageResponse'
        '403':
          description: '`IAM_FORBIDDEN` 缺少 `iam:read`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    post:
      tags: [iam]
      summary: 创建账号
      description: |
        权限码 `iam:user:write`。新建账号一律置 `mustChangePassword=true`，
        强制用户首次登录后改密。

        幂等：用户名有唯一约束，重复提交的第二条会被
        `IAM_USER_DUPLICATED`(409) 拒绝，**不会产生两个账号**。
        本端点**不消费 `X-Request-Id`**（实现的方法签名未接收该头，实测确认）。
      operationId: createIamUser
      parameters:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIamUserRequest' }
      responses:
        '201':
          description: 创建成功，返回账号 DTO
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserView' }
        '400':
          description: '`SYS_VALIDATION_ERROR` 或 `IAM_PASSWORD_WEAK`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: '`IAM_ROLE_NOT_FOUND` —— `roles` 引用了未定义的角色编码'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: '`IAM_USER_DUPLICATED` —— 用户名已存在'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /iam/users/{id}:
    get:
      tags: [iam]
      summary: 账号详情
      operationId: getIamUser
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 账号 DTO
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserView' }
        '404':
          description: '`IAM_USER_NOT_FOUND` 账号 id 不存在'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /iam/users/{id}/roles:
    put:
      tags: [iam]
      summary: 改角色（覆盖式）
      description: |
        **授权即时生效**：`JwtAuthenticationFilter` 与 `PermissionAspect` 每次请求都回库，
        改完的下一个请求就按新权限判定 —— 不需要"让对方重新登录"，也不需要吊销 token。

        **自我保护**：不能清空自己的全部角色（`SYS_VALIDATION_ERROR` 400）。

        幂等：整体替换语义（覆盖式），同一 body 重复提交结果相同，
        但按 docs/05 §2「所有写操作必须声明幂等键」仍携带 `X-Request-Id`。
      operationId: replaceIamUserRoles
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceRolesRequest' }
      responses:
        '200':
          description: 更新后的账号 DTO
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserView' }
        '400':
          description: '`SYS_VALIDATION_ERROR` —— 清空自己的全部角色'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: '`IAM_USER_NOT_FOUND` / `IAM_ROLE_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /iam/users/{id}/enabled:
    post:
      tags: [iam]
      summary: 启停账号
      description: |
        **自我保护**：不能停用自己（`SYS_VALIDATION_ERROR` 400）。

        幂等：状态迁移型（`enabled` 单次翻转到目标值，重复提交结果相同），
        **不消费 `X-Request-Id`**。
      operationId: setIamUserEnabled
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetEnabledRequest' }
      responses:
        '200':
          description: 更新后的账号 DTO
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserView' }
        '400':
          description: '`SYS_VALIDATION_ERROR` —— 停用自己'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: '`IAM_USER_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /iam/users/{id}/reset-password:
    post:
      tags: [iam]
      summary: 管理员重置密码
      description: |
        只返回 `mustChangePassword=true`，**不回显新密码**：明文经过谁的手是可以被
        日志/浏览器历史记录的，而重置动作本身有留痕。正确做法是由管理员当面或另行告知用户。

        幂等：状态迁移型（结果恒为"该账号下次登录必须改密"），**不消费 `X-Request-Id`**。
      operationId: resetIamUserPassword
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200':
          description: 重置成功（不含明文密码）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          userId: { type: integer, format: int64 }
                          mustChangePassword: { type: boolean, example: true }
        '400':
          description: '`IAM_PASSWORD_WEAK` 新密码不合规'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: '`IAM_USER_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  # ─────────────────── IAM · 角色管理（FR-IAM-05） ───────────────────

  /iam/roles:
    get:
      tags: [iam]
      summary: 角色清单（返回数组，不分页）
      operationId: listIamRoles
      responses:
        '200':
          description: 角色列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/RoleView' }
    post:
      tags: [iam]
      summary: 创建角色
      description: |
        幂等：角色编码有唯一约束，重复提交会被拒，**不会产生两个角色**。
        本端点**不消费 `X-Request-Id`**（实现的方法签名未接收该头，实测确认）。
      operationId: createIamRole
      parameters:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoleRequest' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RoleView' }
        '409':
          description: '角色编码重复（唯一约束冲突）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /iam/roles/{id}/permissions:
    get:
      tags: [iam]
      summary: 角色权限（角色信息 + 权限码数组）
      operationId: getIamRolePermissions
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 角色与其权限码
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RolePermissionsView' }
        '404':
          description: '`IAM_ROLE_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    put:
      tags: [iam]
      summary: 覆盖式设置角色权限（授权即时生效的触发点）
      description: '整体替换；改完的下一个请求即生效，无需重新登录。'
      operationId: replaceIamRolePermissions
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplacePermissionsRequest' }
      responses:
        '200':
          description: 设置后的角色与权限码
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RolePermissionsView' }
        '404':
          description: '`IAM_ROLE_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  # ─────────────────── IAM · 数据权限（FR-IAM-04） ───────────────────
  #
  # ★ 安全约定（务必不要"顺手改回 403"）：
  #   数据权限收窄后，**越权访问一律返回 404**（`SYS_NOT_FOUND` / `*_ORDER_NOT_FOUND`），
  #   而不是 403。403 会泄露"这个 id 存在"，攻击者按 id 遍历即可枚举整个 id 空间。

  /iam/users/{id}/data-scopes:
    get:
      tags: [iam]
      summary: 账号的数据权限（直配 + 角色继承）
      description: |
        `direct` 是本账号直接配置的范围，`inherited` 是从角色继承来的范围。
        两端都用**与写入同形**的字符串（读写对称，前端不必写两套映射）：
        `"ALL"` / `"SELF"` / `"WAREHOUSE:<id>"`。
      operationId: getIamUserDataScopes
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 直配与继承范围
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DataScopeView' }
        '404':
          description: '`IAM_USER_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    put:
      tags: [iam]
      summary: 覆盖式设置账号的数据权限
      description: '权限码 `iam:scope:write`。`scopes` 为空数组时拒绝（`SYS_VALIDATION_ERROR` 400）。'
      operationId: replaceIamUserDataScopes
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceScopesRequest' }
      responses:
        '200':
          description: 设置后的范围
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DataScopeView' }
        '400':
          description: '`SYS_VALIDATION_ERROR` —— scopes 为空或取值非法'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: '`IAM_USER_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /iam/roles/{id}/data-scopes:
    get:
      tags: [iam]
      summary: 角色的数据范围配置
      operationId: getIamRoleDataScopes
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 角色范围
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          scopes:
                            type: array
                            items: { type: string }
        '404':
          description: '`IAM_ROLE_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    put:
      tags: [iam]
      summary: 覆盖式设置角色的数据范围
      description: '权限码 `iam:scope:write`。'
      operationId: replaceIamRoleDataScopes
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceScopesRequest' }
      responses:
        '200':
          description: 设置后的角色范围
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          scopes:
                            type: array
                            items: { type: string }
        '400':
          description: '`SYS_VALIDATION_ERROR`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: '`IAM_ROLE_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  # ─────────────────── APS · 审批流（FR-APS-01 / FR-APS-02） ───────────────────
  #
  # ★ 边界（契约必须写明）：审批**只输出"可否"，不修改单据状态**。
  #   审批通过后单据仍需在单据页调 POST /{purchase|sales}-orders/{id}/approve，
  #   由单据侧自己走 DocumentStatusMachine。这是两条独立的状态线。
  #
  # ★ 权限是两层的：`aps:approve` 只是第一道门，真正的判定是按**节点**的
  #   `approverPermission` 逐节点校验 —— 否则"能审批"的人就能审所有节点，
  #   "金额阈值触发上级"就失去意义。

  /approvals:
    get:
      tags: [aps]
      summary: 审批列表
      description: '权限码 `aps:read`。`status`/`bizType` 取值非法 → `SYS_VALIDATION_ERROR` 400。'
      operationId: listApprovals
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ApprovalStatus' }
        - name: bizType
          in: query
          schema: { $ref: '#/components/schemas/ApprovalBizType' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 分页审批列表（items 为 ApprovalInstance）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiPageResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ApprovalInstance' }
        '400':
          description: '`SYS_VALIDATION_ERROR` —— status/bizType 取值非法'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    post:
      tags: [aps]
      summary: 提交审批
      description: |
        权限码 `aps:submit`。`amount` 由调用方（单据页/服务）传入，**而不是服务端回查单据**：
        审批模块不允许读单据表（ArchUnit 规则），且"金额"必须与用户看到的单据金额是同一个数，
        服务端回查会引入"提交时单据已改"的竞态。

        **幂等**：创建型（每次提交产生一个审批实例），**必须**携带 `X-Request-Id`；
        同键重放返回首次实例。
        **唯一未结实例**：同一 `bizType+bizId` 同时只能有一个未结审批。
      operationId: submitApproval
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitApprovalRequest' }
      responses:
        '201':
          description: 创建成功，返回审批实例
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ApprovalInstance' }
        '400':
          description: '`SYS_VALIDATION_ERROR` —— bizType 非法 / 缺参'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: '`APS_FLOW_NOT_FOUND` —— 该单据类型没有启用流程'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: '`APS_INSTANCE_ALREADY_OPEN` —— 同一单据已有未结审批'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /approvals/{id}:
    get:
      tags: [aps]
      summary: 审批详情（含节点快照）
      operationId: getApproval
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 审批实例
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ApprovalInstance' }
        '404':
          description: '`APS_INSTANCE_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /approvals/{id}/approve:
    post:
      tags: [aps]
      summary: 同意当前节点
      description: |
        权限码 `aps:approve` **并且**当前账号具备该节点的 `approverPermission`。

        - **会签/或签**：`ALL_SIGN` 需凑够 `requiredApprovals` 个**不同**的人
          （同一人重复点击只算一票）；`SINGLE` / `ANY_SIGN` 一人同意即通过。
        - **金额阈值**：`amount >= thresholdAmount` 才进入该节点，`0` = 无条件必经；
          被跳过的节点在实例里留 `SKIPPED` 快照（可追溯"这次为什么没走财务"）。

        幂等：状态迁移型，幂等由状态机保证（终态再来一次同意 → `APS_STATUS_ILLEGAL` 409），
        **不消费 `X-Request-Id`**。
      operationId: approveApproval
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: false
        description: body 可省略
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecisionRequest' }
      responses:
        '200':
          description: 审批实例（新状态）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ApprovalInstance' }
        '403':
          description: '`APS_NOT_APPROVER` —— 不具备该节点要求的权限码'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: '`APS_INSTANCE_NOT_FOUND` —— 实例或当前节点不存在'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: '`APS_STATUS_ILLEGAL` —— 状态非法转移（含终态再来一次同意）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /approvals/{id}/reject:
    post:
      tags: [aps]
      summary: 驳回（终止审批）
      description: '幂等：状态迁移型，由状态机保证（`APS_STATUS_ILLEGAL`），**不消费 `X-Request-Id`**。'
      operationId: rejectApproval
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecisionRequest' }
      responses:
        '200':
          description: 审批实例（REJECTED）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ApprovalInstance' }
        '403':
          description: '`APS_NOT_APPROVER`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: '`APS_INSTANCE_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: '`APS_STATUS_ILLEGAL`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /approvals/{id}/withdraw:
    post:
      tags: [aps]
      summary: 撤回（仅发起人本人）
      description: |
        权限码 `aps:withdraw` 是必要条件，**"只有发起人本人"的判定在服务层** ——
        两层都要，因为权限码只回答"这个角色能不能撤回"，回答不了"这一张能不能由你撤回"。

        幂等：状态迁移型，由状态机保证，**不消费 `X-Request-Id`**。
      operationId: withdrawApproval
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecisionRequest' }
      responses:
        '200':
          description: 审批实例（WITHDRAWN）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ApprovalInstance' }
        '403':
          description: '`APS_NOT_APPROVER` —— 非发起人本人'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: '`APS_INSTANCE_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: '`APS_STATUS_ILLEGAL`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /approvals/{id}/transfer:
    post:
      tags: [aps]
      summary: 转办
      description: |
        目标人是否具备节点权限，由服务层通过 `ActorContext` 校验 ——
        否则可以把审批转给完全没有审批权限的账号，等于绕开 RBAC。

        幂等：状态迁移型（`PENDING → TRANSFERRED`），由状态机保证，**不消费 `X-Request-Id`**。
      operationId: transferApproval
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferApprovalRequest' }
      responses:
        '200':
          description: 审批实例（TRANSFERRED）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ApprovalInstance' }
        '403':
          description: '`APS_NOT_APPROVER` —— 转办目标人无资格'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: '`APS_INSTANCE_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: '`APS_STATUS_ILLEGAL`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /approvals/{id}/accept-transfer:
    post:
      tags: [aps]
      summary: 接办（转办的目标人确认接手）
      description: '幂等：状态迁移型（`TRANSFERRED → PENDING`），由状态机保证，**不消费 `X-Request-Id`**。'
      operationId: acceptApprovalTransfer
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 审批实例（回到 PENDING）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ApprovalInstance' }
        '403':
          description: '`APS_NOT_APPROVER`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: '`APS_INSTANCE_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: '`APS_STATUS_ILLEGAL`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /approvals/flows:
    get:
      tags: [aps]
      summary: 流程定义（含节点，只读）
      description: |
        **没有"创建/编辑流程"端点**：本项目只做"单据审批"这一种流程，
        不做通用 BPMN、不做流程设计器（蓝图 §0.3 已砍掉）。流程定义由 Flyway 迁移种子维护，
        线上只允许启停 —— 这样"流程被改了但没人 review"的风险被收敛到一个可审计的 SQL 文件里。
      operationId: listApprovalFlows
      responses:
        '200':
          description: 流程定义列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ApprovalFlow' }

  /approvals/flows/{id}/enabled:
    post:
      tags: [aps]
      summary: 启停审批流程
      description: |
        权限码 `aps:flow:write`。流程定义本身不可写，只允许启停。

        幂等：状态迁移型（`enabled` 单次翻转到目标值），**不消费 `X-Request-Id`**。
      operationId: setApprovalFlowEnabled
      parameters:
        - $ref: '#/components/parameters/PathId'
        - name: enabled
          in: query
          required: true
          schema: { type: boolean }
      responses:
        '200':
          description: 更新后的流程定义
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ApprovalFlow' }
        '400':
          description: '`APS_FLOW_INVALID` —— 配置非法（无节点、序号不连续、首节点阈值非 0）或同类型已有启用流'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: '`APS_FLOW_NOT_FOUND` —— 流程 id 不存在'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  # ─────────────────── MDM · legacy 补口（商品 / SKU 更新与停用） ───────────────────

  /products/{id}/disable:
    post:
      tags: [mdm]
      summary: 停用商品（软删）
      description: |
        软删而非物理删除：历史单据引用商品，物理删除会破坏溯源。
        契约不定义 `DELETE`，用 `POST` 语义化的子路径动作（docs/05 §2）。

        幂等：状态迁移型（`enabled` 单次翻转为 false，重复提交结果相同），
        **不消费 `X-Request-Id`**。
      operationId: disableProduct
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404': { $ref: '#/components/responses/NotFound' }

  /skus/{id}:
    get:
      tags: [mdm]
      summary: SKU 详情
      operationId: getSku
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: SKU
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Sku' }
        '404':
          description: '`MDM_SKU_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    put:
      tags: [mdm]
      summary: 更新 SKU（颜色/尺码不可改）
      description: '`productId`/`color`/`size` 构成业务唯一键，不可改；本接口改 `barcode`/`retailPriceAmount`/`enabled`。'
      operationId: updateSku
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkuUpdate' }
      responses:
        '200':
          description: 更新后的 SKU
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Sku' }
        '404':
          description: '`MDM_SKU_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /skus/matrix:
    post:
      tags: [mdm]
      summary: 颜色 × 尺码矩阵批量生成 SKU
      description: |
        已存在的组合**跳过**（返回 `skipped` 计数），请求自身重复（同一次请求内颜色×尺码撞车）
        则报 `MDM_SKU_DUPLICATED`。这是"上新品一次铺满尺码"的主路径。

        幂等：矩阵内已存在的组合逐条**跳过**（返回 `skipped` 计数），
        因此重复提交同一批颜色×尺码不会产生重复 SKU —— 幂等由"跳过已存在"保证，
        **不消费 `X-Request-Id`**（实测：请求体里也没有 `requestId` 字段）。
      operationId: createSkuMatrix
      parameters:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkuMatrixCreate' }
      responses:
        '201':
          description: 批量生成结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SkuMatrixResult' }
        '409':
          description: '`MDM_SKU_DUPLICATED` —— 同一请求内颜色×尺码重复'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /skus/{id}/disable:
    post:
      tags: [mdm]
      summary: 停用 SKU（软删）
      description: '幂等：状态迁移型（`enabled` 单次翻转为 false），**不消费 `X-Request-Id`**。'
      operationId: disableSku
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 停用后的 SKU
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Sku' }
        '404':
          description: '`MDM_SKU_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  # ─────────────────── INV · legacy 补口（内部控制与不变量校验） ───────────────────

  /inventory/receipts:
    post:
      tags: [inv]
      summary: 入库（内部控制端点）
      description: |
        ★ **这是内部控制端点，不是对外的业务入口。**
        它在 M0 阶段为联调与库存不变量测试而暴露；M1 起进货单
        `POST /purchase-orders/{id}/receive` 才是业务上真正的入库入口。
        保留它的理由是：属性测试与故障注入需要"不经单据直接入库"来构造任意库存快照。

        **取舍记录**：`UNDOCUMENTED_DEBT` 原登记"待决定是否对外"。本批选择**写进契约**
        而不是继续豁免 —— 它已由 Controller 真实注册在 `/api/v1` 下并走同一套鉴权，
        留在豁免清单里只会让"契约是单一事实源"这句话出现例外。
        若要收紧对外暴露，应改 `SecurityConfig`（网关/权限层），而不是让契约假装它不存在。

        业务流水类型固定为 `PURCHASE_IN`。

        幂等：**转换型**（改库存实存，重复调用会重复入库），**必须**携带 `X-Request-Id`；
        同键 + 同批次重放由 `uq_ledger_request` 拦住（`SYS_DUPLICATE_REQUEST`）。
      operationId: internalReceiveStock
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryReceiveRequest' }
      responses:
        '200':
          description: 入库后的余额行
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/InventoryBalance' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: '`SYS_DUPLICATE_REQUEST` —— 同 `X-Request-Id` + 同批次重放被唯一索引拦住'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /inventory/shipments:
    post:
      tags: [inv]
      summary: 出库（FEFO，内部控制端点）
      description: |
        ★ **这是内部控制端点，不是对外的业务入口。**
        M1 起出货单 `POST /sales-orders/{id}/ship` 才是业务上真正的出库入口；
        本端点供联调与属性测试构造出库场景。业务流水类型固定为 `SALES_OUT`。

        按 FEFO（先到期先出）逐批次扣减；库存不足整单回滚并返回
        `INV_INSUFFICIENT_STOCK`。响应是出库后该 SKU 在该仓的**全部余额行**（可能多批次）。

        幂等：**转换型**（改库存实存），**必须**携带 `X-Request-Id`。
      operationId: internalShipStock
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShipRequest' }
      responses:
        '200':
          description: 出库后的余额行数组（可能多批次）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/InventoryBalance' }
        '409':
          description: '`INV_INSUFFICIENT_STOCK` —— 实存不足（含并发争抢后仍未扣减的情况）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /inventory/consistency-check:
    get:
      tags: [inv]
      summary: 不变量校验 · 实存 == 流水净和（运维/对账端点）
      description: |
        ★ **运维/对账端点，不是业务功能。** 校验不变量 INV-2：
        每个 (sku, 仓库, 批次) 的 `on_hand_qty` 必须等于该维度的流水净和。

        一致时返回 `200` + `{consistent: true, checked: true}`；
        不一致时**不返回 200 包错误**，而是 `409` + `INV_BALANCE_MISMATCH`，
        且 `details` 直接是**违规清单数组**（★ 这里是数组，不是常见的对象形状），
        消息带漂移条数。可用于定时巡检与故障后的取证。
      operationId: checkInventoryConsistency
      responses:
        '200':
          description: 校验通过
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          consistent: { type: boolean, example: true }
                          checked: { type: boolean, example: true }
        '409':
          description: '`INV_BALANCE_MISMATCH` —— 检出余额 ≠ 流水净和；`details` 为违规清单数组'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiError'
                  - type: object
                    properties:
                      details:
                        type: array
                        description: ★ 本码的 details 是数组而非对象
                        items:
                          type: object
                          additionalProperties: true

  # ─────────────────── PUR / SAL · legacy 补口（单据工作流与详情） ───────────────────
  #
  # 这些动作此前契约只写了 receive/ship/void，漏了 submit/approve/reject。
  # 状态机见 DocumentStatus（BR-DOC-01）：非法转移一律 409，禁止静默成功。
  # 四个状态迁移动作都是 transition 型 —— 幂等由 DocumentStatusMachine 保证，
  # 因此**不声明 X-Request-Id**；这也与既有实现一致（它们本就不读该头）。

  /purchase-orders/{id}/submit:
    post:
      tags: [pur]
      summary: 提交进货单（DRAFT → SUBMITTED）
      description: '幂等：状态迁移型，由状态机保证（重复提交被拒），**不消费 `X-Request-Id`**。'
      operationId: submitPurchaseOrder
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          description: '`PUR_ORDER_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: '`PUR_STATUS_ILLEGAL` —— 当前状态不允许提交；账期已锁账 → `SET_PERIOD_CLOSED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /purchase-orders/{id}/approve:
    post:
      tags: [pur]
      summary: 审核进货单（SUBMITTED → APPROVED）
      description: '幂等：状态迁移型，由状态机保证，**不消费 `X-Request-Id`**。'
      operationId: approvePurchaseOrder
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          description: '`PUR_ORDER_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: '`PUR_STATUS_ILLEGAL`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /purchase-orders/{id}/reject:
    post:
      tags: [pur]
      summary: 驳回进货单（SUBMITTED → REJECTED）
      description: '幂等：状态迁移型，由状态机保证，**不消费 `X-Request-Id`**。'
      operationId: rejectPurchaseOrder
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          description: '`PUR_ORDER_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: '`PUR_STATUS_ILLEGAL`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /sales-orders/{id}:
    get:
      tags: [sal]
      summary: 出货单详情
      operationId: getSalesOrder
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 出货单（含明细行）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SalesOrder' }
        '404':
          description: '`SAL_ORDER_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /sales-orders/{id}/submit:
    post:
      tags: [sal]
      summary: 提交出货单（DRAFT → SUBMITTED）
      description: '幂等：状态迁移型，由状态机保证（重复提交被拒），**不消费 `X-Request-Id`**。'
      operationId: submitSalesOrder
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          description: '`SAL_ORDER_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: '`SAL_STATUS_ILLEGAL` —— 当前状态不允许提交；账期已锁账 → `SET_PERIOD_CLOSED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /sales-orders/{id}/approve:
    post:
      tags: [sal]
      summary: 审核出货单（SUBMITTED → APPROVED）
      description: '幂等：状态迁移型，由状态机保证，**不消费 `X-Request-Id`**。'
      operationId: approveSalesOrder
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          description: '`SAL_ORDER_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: '`SAL_STATUS_ILLEGAL`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /sales-orders/{id}/reject:
    post:
      tags: [sal]
      summary: 驳回出货单（SUBMITTED → REJECTED）
      description: '幂等：状态迁移型，由状态机保证，**不消费 `X-Request-Id`**。'
      operationId: rejectSalesOrder
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          description: '`SAL_ORDER_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: '`SAL_STATUS_ILLEGAL`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  # ═══════════════════════════════════════════════════════════════════════
  # V2-C2「契约清偿 2」补写：V2-3 销售闭环 28 个操作（FR-SAL-05~11 / FR-MDM-08）
  #   来源：.plan/V2-3-契约申请.md + 实现侧扫描（com/erp/sal/api 6 个 Controller）
  #   与调用侧扫描（frontend/web/src/api/salesV23.ts、client.ts）。
  #   ★ X-Request-Id 只在实现真正 @RequestHeader 消费的操作上声明（scripts/contract-check.py 双向核对）。
  # ═══════════════════════════════════════════════════════════════════════

  # ─────────────────────────── SAL · 报价单（FR-SAL-05） ───────────────────────────
  /sales-quotes:
    get:
      tags: [sal]
      summary: 查询报价单
      description: |
        报价单是**未预占库存**的意向单据（与出货单的分界：出货单建单即预占）。
        分页返回单据头字段（含 `totalAmount`/`totalQty`/`convertedOrderId`）；
        `lines` 仅在详情与写操作响应中出现。排序 `id DESC`。
      operationId: listSalesQuotes
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - name: customerId
          in: query
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 报价单分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiPageResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/SalesQuote' }
    post:
      tags: [sal]
      summary: 创建报价单（草稿，不预占库存）
      description: |
        - 明细至少一行；同一 SKU 不能重复成两行；数量必须为正、单价不能为负
        - `discountRate` 是**整数万分比**（1~10000，10000 = 不打折，禁止浮点 ADR-0005）
        - 客户必须存在且启用；每行 SKU 必须存在且启用
        - `validUntil` 省略表示不限有效期；不能早于 `bizDate`（省略时取当天）
        - 幂等：同一 `X-Request-Id` 重放**返回首次创建的报价单**，不重复建单、不报错
        - `bizDate` 所在账期已月结锁账 → `SET_PERIOD_CLOSED`
      operationId: createSalesQuote
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalesQuoteCreate' }
      responses:
        '201':
          description: 建单成功（状态 DRAFT）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SalesQuote' }
        '400':
          description: '`SYS_VALIDATION_ERROR`（明细为空 / 数量非正 / 单价为负 / 折扣越界 / 同 SKU 重复成行 / 客户或 SKU 已停用 / 有效期早于报价日期）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: '`SYS_NOT_FOUND`（客户不存在）/ `MDM_SKU_NOT_FOUND`（SKU 不存在）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: '`SET_PERIOD_CLOSED`（报价日期所在账期已锁账）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                periodClosed:
                  value:
                    code: SET_PERIOD_CLOSED
                    message: "账期 2026-10 已月结锁账（业务日期 2026-10-01 落在该期间），不允许再新增或变更该期间的单据"

  /sales-quotes/{id}:
    get:
      tags: [sal]
      summary: 报价单详情（含明细行）
      operationId: getSalesQuote
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 报价单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SalesQuote' }
        '404':
          description: '`SAL_QUOTE_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /sales-quotes/{id}/submit:
    post:
      tags: [sal]
      summary: 提交报价单（DRAFT → SUBMITTED）
      description: |
        - 幂等：状态迁移型，由**状态机 + version 条件 UPDATE** 保证，**不消费 `X-Request-Id`**；
          同键或异键重复提交，第二次一律 `SAL_QUOTE_STATUS_ILLEGAL`
        - 并发提交由 `status + version` 串行化，只有一个请求推进成功
        - 报价单业务日期所在账期已锁账 → `SET_PERIOD_CLOSED`
      operationId: submitSalesQuote
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 提交后的报价单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SalesQuote' }
        '404':
          description: '`SAL_QUOTE_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: '`SAL_QUOTE_STATUS_ILLEGAL`（非法转移 / 并发冲突）/ `SET_PERIOD_CLOSED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /sales-quotes/{id}/approve:
    post:
      tags: [sal]
      summary: 审核通过报价单（SUBMITTED → APPROVED）
      description: |
        只有 APPROVED 的报价单可转化为出货单（见 `/sales-quotes/{id}/convert`）。
        幂等：状态迁移型，由状态机 + version 保证，**不消费 `X-Request-Id`**。
      operationId: approveSalesQuote
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 审核后的报价单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SalesQuote' }
        '404':
          description: '`SAL_QUOTE_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: '`SAL_QUOTE_STATUS_ILLEGAL` / `SET_PERIOD_CLOSED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /sales-quotes/{id}/reject:
    post:
      tags: [sal]
      summary: 驳回报价单（SUBMITTED → REJECTED）
      description: |
        本模块**没有**把 REJECTED 报价单改回 DRAFT 的端点，所以从报价单接口看，
        REJECTED 之后只能 `/void` 作废离开（共享状态机本身允许 REJECTED → DRAFT，
        见 `DocumentStatus.TRANSITIONS`；只是报价单模块不暴露这个动作）。
        幂等：状态迁移型，**不消费 `X-Request-Id`**。
      operationId: rejectSalesQuote
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 驳回后的报价单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SalesQuote' }
        '404':
          description: '`SAL_QUOTE_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: '`SAL_QUOTE_STATUS_ILLEGAL` / `SET_PERIOD_CLOSED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /sales-quotes/{id}/void:
    post:
      tags: [sal]
      summary: 作废报价单（→ VOIDED）
      description: |
        报价单不预占库存，因此作废**不动库存、也不走红冲**，只推进状态。
        已转化（COMPLETED）的报价单不可作废。
        幂等：状态迁移型，**不消费 `X-Request-Id`**。
      operationId: voidSalesQuote
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 作废后的报价单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SalesQuote' }
        '404':
          description: '`SAL_QUOTE_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: '`SAL_QUOTE_STATUS_ILLEGAL`（含已 COMPLETED 不可作废）/ `SET_PERIOD_CLOSED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /sales-quotes/{id}/convert:
    post:
      tags: [sal]
      summary: 报价单转化为出货单（同时预占库存）
      description: |
        **转换型写操作**，副作用 = 新建出货单 + 预占库存 + 信用快照，因此必须带 `X-Request-Id`。
        - 前置：状态 APPROVED、未过期（`validUntil` 未早于当天）、有明细
        - `warehouseId` 提供 → 固定该仓建单；**省略 → 按 `warehouses.priority` 自动选仓/拆分配**
          （等价于 `POST /sales-orders/auto-split`）
        - 订单业务日期取**转化当天**，不用报价日期 —— 避免把今天的转化记进已锁账的报价月
        - 幂等：同 `X-Request-Id` 重放返回首次生成的出货单；
          已转化后用**新键**再转化 → `SAL_QUOTE_STATUS_ILLEGAL`
        - 内部订单幂等键为 `<X-Request-Id>:Q<quoteId>`，与直接建单的键分列
        - 失败（库存不足 / 信用超额 / 明细非法）**整单回滚**：不产生预占，报价单保持 APPROVED 可重试
      operationId: convertSalesQuote
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalesQuoteConvert' }
      responses:
        '200':
          description: 转化生成的出货单（DRAFT，含明细与预占 id）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SalesOrder' }
        '400':
          description: '`SYS_VALIDATION_ERROR`（SKU 已停用 / 仓库已停用 / 明细非法）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: '`SAL_QUOTE_NOT_FOUND` / `MDM_SKU_NOT_FOUND` / `MDM_WAREHOUSE_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: 转化被拒绝，整单回滚（报价单保持 APPROVED）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                alreadyConverted:
                  value:
                    code: SAL_QUOTE_STATUS_ILLEGAL
                    message: "报价单 SQ20261023-0001 已转化为出货单 100（首次转化请求与本次不同），不能重复转化"
                notApproved:
                  value:
                    code: SAL_QUOTE_STATUS_ILLEGAL
                    message: "报价单 SQ20261023-0001 当前状态 SUBMITTED 不可转化（仅 APPROVED 可转化）"
                expired:
                  value:
                    code: SAL_QUOTE_STATUS_ILLEGAL
                    message: "报价单 SQ20261023-0001 已于 2026-11-23 过期，不能转化"
                creditExceeded:
                  value:
                    code: SAL_CREDIT_LIMIT_EXCEEDED
                    message: "客户 C001 信用超额：额度 200000 分，当前敞口 250000 分（含本单 129000 分）"
                    details: { customerId: 1, creditLimit: 200000, exposure: 250000, orderAmount: 129000 }
                insufficientStock:
                  value:
                    code: INV_INSUFFICIENT_STOCK
                    message: "库存不足：SKU 1001 在所有启用仓合计仍差 5 件"
                    details: { skuId: 1001, shortage: 5 }

  # ─────────────────────────── SAL · 自动选仓建单（FR-SAL-11） ───────────────────────────
  /sales-orders/auto-split:
    post:
      tags: [sal]
      summary: 自动选仓建出货单（逐仓吃量拆分配）
      description: |
        与 `POST /sales-orders` 的唯一区别：**请求体不带 `warehouseId`**，
        仓位由服务端按 `warehouses.priority DESC, id ASC` 遍历启用仓决定。
        - 单仓可用量足够 → 只产生**一个** `allocations` 元素；不足才跨仓拆分配
        - 明细行 `skuId` 与 `bundleId` **二选一**（同时给或都不给 → `SYS_VALIDATION_ERROR`）
        - 套装行按「每仓可用套装 = min(floor(组件可用量 ÷ 配比))」成套吃量，
          展开成组件行计价（单价取组件 `retailPriceAmount`，行上保留 `bundleId`/`bundleGroupNo`/`bundleRatio`/`bundleQty`）
        - 单据头的 `warehouseId` = 第一个分配所在仓（仅为代表值，真实分布在 `lines[].allocations`）
        - 顺序保证：**信用校验发生在任何预占之前**，超额时不留半成品预占
        - 幂等：同一 `X-Request-Id` 重放返回首次建好的出货单
      operationId: createSalesOrderAutoSplit
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalesOrderAutoSplitCreate' }
      responses:
        '201':
          description: 建单成功；`lines[].allocations` 是拆单结果的可见证据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SalesOrder' }
              examples:
                splitAcrossWarehouses:
                  value:
                    code: OK
                    message: success
                    data:
                      id: 100
                      orderNo: SO20261023-0001
                      status: DRAFT
                      customerId: 1
                      warehouseId: 2
                      totalQty: 15
                      lines:
                        - id: 11
                          lineNo: 1
                          skuId: 1001
                          qty: 15
                          openQty: 15
                          allocations: [{ warehouseId: 2, qty: 10 }, { warehouseId: 1, qty: 5 }]
                          reservationIds: [7001, 7002]
        '400':
          description: '`SYS_VALIDATION_ERROR`（明细为空 / skuId 与 bundleId 未二选一 / 数量非正 / 折扣越界 / SKU·套装·仓库已停用）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: '`MDM_SKU_NOT_FOUND` / `MDM_BUNDLE_NOT_FOUND` / `MDM_WAREHOUSE_NOT_FOUND`（无启用仓）/ `SYS_NOT_FOUND`（客户不存在）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                noEnabledWarehouse:
                  value:
                    code: MDM_WAREHOUSE_NOT_FOUND
                    message: "没有启用的仓库，无法自动选仓"
        '409':
          description: 全部仓合计仍不足 / 信用超额 / 套装停用 / 账期已锁 —— 无任何预占产生
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                insufficient:
                  value:
                    code: INV_INSUFFICIENT_STOCK
                    message: "库存不足：SKU 1001 在所有启用仓合计仍差 3 件"
                    details: { skuId: 1001, shortage: 3 }
                bundleShortage:
                  value:
                    code: INV_INSUFFICIENT_STOCK
                    message: "套装 BUNDLE-DENIM-01 库存不足：还差 1 套（按组件可用量÷配比计算）"
                    details: { bundleId: 3, shortage: 1 }
                creditExceeded:
                  value:
                    code: SAL_CREDIT_LIMIT_EXCEEDED
                    message: "客户 C001 信用超额：额度 200000 分，当前敞口 250000 分（含本单 129000 分）"
                bundleDisabled:
                  value:
                    code: MDM_BUNDLE_DISABLED
                    message: "套装已停用，不能建单：BUNDLE-DENIM-01"

  # ─────────────────────────── SAL · 组合商品/套装（FR-SAL-10） ───────────────────────────
  /product-bundles:
    get:
      tags: [sal]
      summary: 查询套装
      description: |
        套装是「组件 SKU × 配比」的组合定义，**自身没有库存行**（INV-16）；
        可用量走 `GET /product-bundles/{id}/availability`。
      operationId: listProductBundles
      parameters:
        - name: keyword
          in: query
          description: 按编码/名称模糊匹配
          schema: { type: string }
        - name: onlyEnabled
          in: query
          description: 仅返回启用的套装
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 套装分页列表（含组件明细）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiPageResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ProductBundle' }
    post:
      tags: [sal]
      summary: 创建套装
      description: |
        - `items` 至少一个组件；同一组件 SKU 在套装中**只能出现一次**
        - `ratioQty` 必须为正（整数配比，表示「一套吃几件」）
        - 组件 SKU 必须存在且启用
        - 幂等：由 `code` 的 DB 唯一约束保证（重复编码 → `MDM_BUNDLE_DUPLICATED`），
          **不消费 `X-Request-Id`**
      operationId: createProductBundle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductBundleCreate' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProductBundle' }
        '400':
          description: '`SYS_VALIDATION_ERROR`（items 为空 / 配比非正 / 组件 SKU 已停用 / 编码或名称为空 / 价格为负）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: '`MDM_SKU_NOT_FOUND`（组件 SKU 不存在）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: '`MDM_BUNDLE_DUPLICATED`（套装编码已存在 / 组件 SKU 重复）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                duplicatedCode:
                  value:
                    code: MDM_BUNDLE_DUPLICATED
                    message: "套装编码已存在：code=BUNDLE-DENIM-01"
                duplicatedComponent:
                  value:
                    code: MDM_BUNDLE_DUPLICATED
                    message: "同一组件 SKU 在套装中重复：skuId=1001"

  /product-bundles/{id}:
    get:
      tags: [sal]
      summary: 套装详情（含组件配比）
      operationId: getProductBundle
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 套装
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProductBundle' }
        '404':
          description: '`MDM_BUNDLE_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    put:
      tags: [sal]
      summary: 修改套装（整体替换组件清单）
      description: |
        - **不接收 `code`**：编码一经创建不可改（它是唯一键，也是历史单据的溯源线索）
        - `items` 整体替换（先删后插），校验同创建
        - 幂等：PUT 全量覆盖，重复提交同一份请求体结果一致，**不消费 `X-Request-Id`**
      operationId: updateProductBundle
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductBundleUpdate' }
      responses:
        '200':
          description: 修改后的套装
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProductBundle' }
        '400':
          description: '`SYS_VALIDATION_ERROR`（items 为空 / 配比非正 / 组件停用 / 名称为空 / 价格为负）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: '`MDM_BUNDLE_NOT_FOUND` / `MDM_SKU_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: '`MDM_BUNDLE_DUPLICATED`（组件 SKU 重复）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /product-bundles/{id}/disable:
    post:
      tags: [sal]
      summary: 停用套装
      description: |
        纯开关型端点：只把 `enabled` 置为 false，**不删除**组件行，也不影响历史单据
        （历史行已按组件展开并计价）。停用后建单/转化 → `MDM_BUNDLE_DISABLED`。
        幂等由状态本身保证（重复停用结果一致），**不消费 `X-Request-Id`**。
      operationId: disableProductBundle
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 停用后的套装（`enabled = false`）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProductBundle' }
        '404':
          description: '`MDM_BUNDLE_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /product-bundles/{id}/availability:
    get:
      tags: [sal]
      summary: 套装可用量（min(组件可用量 ÷ 配比)）
      description: |
        **套装本身没有库存行**（不变量 INV-16），可成套数量由组件推导：

        ```
        availableQty = min over items of floor(component.availableQty ÷ item.ratioQty)
        ```

        - `warehouseId` 提供 → 只算该仓；**省略 → 全仓汇总口径**（组件可用量先跨仓求和再除配比）
        - `components[].maxBundles` 给出每个组件单独能撑起的套数，
          `availableQty` 就是它们的最小值 —— 响应里两者都在，算式可复核
        - 组件清单为空时 `availableQty = 0`（而不是 `Integer.MAX_VALUE`）
        - 这里的可用量是**读侧快照**，不预留：真正建单时按同一算式逐仓吃量并预占
          （见 `POST /sales-orders/auto-split`），两次读取之间可能被别的单据吃掉
      operationId: getProductBundleAvailability
      parameters:
        - $ref: '#/components/parameters/PathId'
        - name: warehouseId
          in: query
          description: 省略 = 全仓汇总口径
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 套装可用量与各组件的撑套能力
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BundleAvailability' }
              examples:
                perWarehouse:
                  value:
                    code: OK
                    message: success
                    data:
                      bundleId: 3
                      warehouseId: 1
                      availableQty: 5
                      components:
                        - { componentSkuId: 1001, ratioQty: 2, availableQty: 10, maxBundles: 5 }
                        - { componentSkuId: 1002, ratioQty: 3, availableQty: 15, maxBundles: 5 }
                allWarehouses:
                  value:
                    code: OK
                    message: success
                    data:
                      bundleId: 3
                      warehouseId: null
                      availableQty: 8
                      components:
                        - { componentSkuId: 1001, ratioQty: 2, availableQty: 17, maxBundles: 8 }
                        - { componentSkuId: 1002, ratioQty: 3, availableQty: 30, maxBundles: 10 }
        '404':
          description: '`MDM_BUNDLE_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  # ─────────────────────────── SAL · 拣货/发货作业（FR-SAL-06） ───────────────────────────
  /sales-orders/{id}/shipments:
    post:
      tags: [sal]
      summary: 为出货单生成发货计划（按预占所在仓拆单）
      description: |
        **转换型写操作**（一次计划可产生多张发货单），必须带 `X-Request-Id`。
        - 计划行来自出货单各行的 **ACTIVE 预占**：按预占所在仓分组，**一仓一张发货单**
          —— 自动选仓/跨仓拆单的订单会一次生成多张
        - 只计划 `openQty > 0`（未出量）的行；全部已出 → `SAL_STATUS_ILLEGAL`
        - 一致性检查：某行 ACTIVE 预占合计 ≠ 未出量 → `SAL_STATUS_ILLEGAL`（不允许半计划状态）
        - 一条预占**只能被一个计划占用**：重复计划同一批预占 → `SAL_STATUS_ILLEGAL`
        - 前置状态：APPROVED / PARTIAL（`isExecutable`）
        - 幂等：同 `X-Request-Id` 重放返回首次计划；
          该键已被**另一张订单**用过 → `SYS_DUPLICATE_REQUEST`
        - 新建的发货单状态为 DRAFT，等待扫码
      operationId: createShipmentPlan
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 发货计划（含按仓拆出的发货单）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ShipmentPlan' }
        '400':
          description: '`SYS_VALIDATION_ERROR`（缺失或空白的 `X-Request-Id`）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: '`SAL_ORDER_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: 状态非法 / 预占与未出量不一致 / 预占已被计划占用 / 无可发货量 / 账期已锁
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                notExecutable:
                  value:
                    code: SAL_STATUS_ILLEGAL
                    message: "出货单 SO20261023-0001 当前状态 DRAFT 不可生成发货计划（仅 APPROVED/PARTIAL）"
                reservationMismatch:
                  value:
                    code: SAL_STATUS_ILLEGAL
                    message: "出货单 SO20261023-0001 第 1 行预占与未出量不一致：未出 5，ACTIVE 预占 3"
                alreadyPlanned:
                  value:
                    code: SYS_DUPLICATE_REQUEST
                    message: "该幂等键已用于另一张订单的发货计划"

  /shipments:
    get:
      tags: [sal]
      summary: 查询发货单
      description: |
        发货单是**按仓拆分**的拣货/出库执行单据，不参与收付款与账期统计，
        因此用独立的 `ShipmentStatus` 状态机而不是共享的 `DocumentStatus`（BR-DOC-01 的例外）。
      operationId: listShipments
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ShipmentStatus' }
        - name: salesOrderId
          in: query
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 发货单分页列表（含拣货行）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiPageResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Shipment' }

  /shipments/{id}:
    get:
      tags: [sal]
      summary: 发货单详情（含拣货行与累计已扫量）
      operationId: getShipment
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 发货单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Shipment' }
        '404':
          description: '`SAL_SHIPMENT_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /shipments/{id}/scan:
    post:
      tags: [sal]
      summary: 扫码拣货（累计已扫数量）
      description: |
        扫码是**累加语义**（`picked_qty += qty`），一行可多次扫；上限由「不得超计划量」守住。
        - 前置状态：DRAFT / PICKING
        - `shipmentLineId` 必须是本发货单的行，否则 `SYS_NOT_FOUND`
        - `barcode` 可选：提供时必须与该 SKU 的条码完全一致（去首尾空格后比较），
          用于**防止扫错货**；该 SKU 无条码时任何扫描值都判为不匹配
        - 扫满全部行 → 状态自动推进到 `PICKED`；首次扫码（DRAFT 且未扫满）→ `PICKING`
        - 幂等：**不消费 `X-Request-Id`** —— 两次扫码是两个真实动作（各加一次数量），
          重复由 `SAL_SHIPMENT_OVER_PICK` 上限拦住，不能静默去重
        - 并发扫码由发货单行锁 + 条件 UPDATE 串行化
      operationId: scanShipment
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShipmentScanRequest' }
      responses:
        '200':
          description: 扫码后的发货单（`pickedQty` 已累计，状态可能已推进）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Shipment' }
        '400':
          description: '`SYS_VALIDATION_ERROR`（扫码数量非正 / 条码不匹配）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                barcodeMismatch:
                  value:
                    code: SYS_VALIDATION_ERROR
                    message: "条码不匹配：扫描 '6901000002'，该行 SKU 条码为 '6901000001'"
        '404':
          description: '`SAL_SHIPMENT_NOT_FOUND` / `SYS_NOT_FOUND`（拣货行不属于该发货单）/ `MDM_SKU_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: 超计划量 / 状态不可扫码
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                overPick:
                  value:
                    code: SAL_SHIPMENT_OVER_PICK
                    message: "扫码数量超过计划：拣货行 11 计划 10，已扫 8，本次 4"
                    details: { shipmentLineId: 11, plannedQty: 10, pickedQty: 8, scanned: 4 }
                wrongStatus:
                  value:
                    code: SAL_SHIPMENT_STATUS_ILLEGAL
                    message: "发货单 SP20261023-0001 当前状态 COMPLETED 不可扫码"

  /shipments/{id}/confirm:
    post:
      tags: [sal]
      summary: 确认发货（出库 + 消费预占 + 累计已出量 + 登记应收）
      description: |
        **转换型写操作**，一次调用产生四类副作用，因此必须带 `X-Request-Id`：
        1. 按拣货行的**计划数量**（不是已扫数量 —— 已扫必须已等于计划）整行出库，
           写 `SALES_OUT` 流水，流水幂等键 = `<shipmentNo>:L<lineNo>`
        2. 消费对应预占（`ACTIVE` → 已消费）
        3. 累加出货单行的 `shippedQty`，推进订单状态（全出 `COMPLETED` / 部分 `PARTIAL`）
        4. 按本次出货金额登记/累加客户应收
        - 前置状态：**必须 PICKED**（全部行扫满），否则 `SAL_SHIPMENT_STATUS_ILLEGAL`
        - 跨仓订单的每张发货单**各自确认**，互不影响
        - 幂等：同 `X-Request-Id` 重放返回首次结果（不重复出库/登记应收）；
          已 COMPLETED 后用**新键**再确认 → `SAL_SHIPMENT_STATUS_ILLEGAL`
        - 任一步失败整事务回滚（不留下半张出库流水）
        - 订单业务日期所在账期已锁账 → `SET_PERIOD_CLOSED`
      operationId: confirmShipment
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 确认后的发货单（COMPLETED）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Shipment' }
        '400':
          description: '`SYS_VALIDATION_ERROR`（缺失或空白的 `X-Request-Id`）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: '`SAL_SHIPMENT_NOT_FOUND` / `SAL_ORDER_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: 未扫满 / 重复确认 / 出库失败 / 预占已失效 / 账期已锁
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                notPicked:
                  value:
                    code: SAL_SHIPMENT_STATUS_ILLEGAL
                    message: "发货单 SP20261023-0001 当前状态 PICKING 不可确认（需全部扫码完成）"
                alreadyConfirmed:
                  value:
                    code: SAL_SHIPMENT_STATUS_ILLEGAL
                    message: "发货单 SP20261023-0001 已确认发货（首次请求与本次不同），不能重复确认"
                reservationGone:
                  value:
                    code: INV_RESERVE_FAILED
                    message: "预占 7001 不是 ACTIVE，无法消费（并发冲突）"
                outOfStock:
                  value:
                    code: INV_INSUFFICIENT_STOCK
                    message: "库存不足：SKU 1001 在 上海仓 可用量 3，需求 5"

  # ─────────────────────────── SAL · 应收 / 收款核销（FR-SAL-07/08） ───────────────────────────
  /receivables:
    get:
      tags: [sal]
      summary: 查询客户应收单
      description: |
        应收按**出货单**聚合（一单一行：`uq_receivable_order UNIQUE (sales_order_id)`），
        出货时累加、退货时冲减、收款时核销。
        守恒不变量（INV-AR）：`balance = shippedAmount − returnedAmount − receivedAmount ≥ 0`，
        由数据库 CHECK 约束 `ck_receivable_balance` 兜底，不靠应用层自觉。
        状态只有 `OPEN / SETTLED / VOIDED`（部分核销仍是 OPEN，剩余由 `balance` 表达）。
      operationId: listReceivables
      parameters:
        - name: customerId
          in: query
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, SETTLED, VOIDED] }
        - name: overdue
          in: query
          description: |
            `true` = 仅逾期（`status = OPEN` 且 `balance > 0` 且 `dueDate < 当天`）；
            `false` = 仅未逾期（含 `dueDate` 为空的单据）；省略 = 不过滤
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 应收分页列表（按 id 降序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiPageResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/CustomerReceivable' }

  /receivables/summary:
    get:
      tags: [sal]
      summary: 客户应收汇总（对账口径）
      description: |
        实时聚合该客户**未作废**（`status <> 'VOIDED'`）的应收，不读缓存：
        - `balance = shippedAmount − returnedAmount − receivedAmount`
        - `overdueAmount` = 其中 `status = OPEN` 且 `balance > 0` 且 `dueDate < 当天` 的余额合计
        - 逾期判定日期来自 `ClockProvider`（禁止系统时间，ADR 纪律）
        - 该 `balance` 正是信用敞口的「已出货未收」部分（见 `GET /customers/{id}/credit`）
      operationId: getReceivableSummary
      parameters:
        - name: customerId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 汇总金额（全部为整数分）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReceivableSummary' }
        '400':
          description: '`SYS_VALIDATION_ERROR`（缺少必填的 `customerId`）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /receivables/{id}:
    get:
      tags: [sal]
      summary: 应收单详情
      description: 返回守恒三元组与派生 `balance`，并给出该单据当前是否已逾期。
      operationId: getReceivable
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 应收单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CustomerReceivable' }
        '404':
          description: '`SAL_RECEIVABLE_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /customer-receipts:
    get:
      tags: [sal]
      summary: 查询收款单
      operationId: listCustomerReceipts
      parameters:
        - name: customerId
          in: query
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 收款单分页列表（含核销明细）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiPageResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/CustomerReceipt' }
    post:
      tags: [sal]
      summary: 登记收款并核销应收
      description: |
        **创建型写操作**，必须带 `X-Request-Id`。核销守恒是这里的硬约束：
        - `Σ allocations[].amount` **必须精确等于** `amount` —— 多一分少一分都是
          `SAL_RECEIPT_UNBALANCED`(409)；不做「余额自动吸收」的宽容处理，
          否则收款单与核销明细之间会出现无法对账的差额
        - **部分核销合法**：单条应收的核销金额可以小于其 `balance`
          （应收保持 OPEN，`balance` 减少）；一条收款可跨多条应收
        - 任一核销超过该应收余额 → `SAL_RECEIPT_OVER_ALLOCATED`(409)
          （条件 UPDATE 同时守住「余额足够」与「未作废」，并发下同一失败码）
        - 同一 `receivableId` 在一张收款单里只能出现一次
        - 不允许跨客户核销：应收不属于该客户 → `SAL_RECEIVABLE_NOT_FOUND`(**404**)
        - 幂等：同 `X-Request-Id` 重放返回首次收款单；该键已用于**另一客户** → `SYS_DUPLICATE_REQUEST`
        - `bizDate` 所在账期已锁账 → `SET_PERIOD_CLOSED`
      operationId: createCustomerReceipt
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerReceiptCreate' }
      responses:
        '201':
          description: 收款单（含核销明细与每条应收核销后的余额状态）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CustomerReceipt' }
        '400':
          description: '`SYS_VALIDATION_ERROR`（收款金额非正 / 核销明细为空 / 核销金额非正 / 同一应收重复 / 缺失 `X-Request-Id`）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: '`SYS_NOT_FOUND`（客户不存在）/ `SAL_RECEIVABLE_NOT_FOUND`（应收不存在或跨客户）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                crossCustomer:
                  value:
                    code: SAL_RECEIVABLE_NOT_FOUND
                    message: "应收 7 不属于客户 1，不能跨客户核销"
        '409':
          description: 分配合计不等于金额 / 超额核销 / 幂等键复用 / 账期已锁
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                unbalanced:
                  value:
                    code: SAL_RECEIPT_UNBALANCED
                    message: "核销明细合计 40000 分与收款金额 45000 分不一致（必须精确相等）"
                    details: { amount: 45000, allocated: 40000 }
                overAllocated:
                  value:
                    code: SAL_RECEIPT_OVER_ALLOCATED
                    message: "核销超额：应收 7 余额 20000 分，本次核销 30000 分"
                    details: { receivableId: 7, balance: 20000, requested: 30000 }
                concurrentOverAllocate:
                  value:
                    code: SAL_RECEIPT_OVER_ALLOCATED
                    message: "核销超额（并发）：应收 7 余额已不足 30000 分"
                    details: { receivableId: 7, requested: 30000 }

