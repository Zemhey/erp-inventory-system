        从未出库时从首次流水日起算。只返回期末仍有库存的 (SKU, 仓库) 行。
      operationId: inventoryTurnoverReport
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          description: 同时作为呆滞观察日
