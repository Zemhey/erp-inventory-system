openapi: 3.0.3
info:
  title: 进销存系统 API（服装/鞋帽网店）
  version: 0.1.0-M0
  description: |
    本文件是**全项目接口的单一事实源（Single Source of Truth）**。

    工作流（见 docs/ADR-0008）：
      ① 改本文件 → ② 服务端实现 → ③ springdoc 导出后与本体 diff（CI 失败即漂移）
      → ④ 生成三端 TS SDK → ⑤ 契约测试 / Schemathesis 属性测试 → ⑥ 生成 index/api-map.md

    约定（见 docs/05-接口契约规范.md）：
      - 金额字段一律为**整数「分」**，字段名以 Amount 结尾
      - 时间格式 ISO-8601 带时区
      - 状态变更走子路径动作（/{id}/receive、/{id}/ship）
      - 写操作必须携带 X-Request-Id（幂等键）
servers:
  - url: http://localhost:8080/api/v1
    description: 本地开发
  - url: https://api.example.com/api/v1
    description: 线上（M6 部署后替换）

tags:
  - name: mdm
    description: 主数据（商品 / SKU / 仓库）
  - name: inv
    description: 库存（余额 / 流水 / 预占）
  - name: pur
    description: 采购进货
  - name: sal
    description: 销售出货
  - name: rma
    description: 退货（RMA）
  - name: set
    description: 结算与对账
  - name: rpt
    description: 报表统计
  - name: nl
    description: 自然语言操作（意图解析 + 调度既有业务服务，FR-SYS-04）
  - name: cst
    description: 成本与毛利（移动加权成本 / 月结转 / 毛利分析）
  - name: sys
    description: 审计与可观测（审计查询 / 字典，FR-SYS-06~09，全部只读）
  - name: iam
    description: 认证与权限（登录 / 改密 / 账号 / 角色 / 数据权限，FR-IAM-04~06）
  - name: aps
    description: 审批流（提交 / 同意 / 驳回 / 撤回 / 转办，FR-APS-01~02；只输出可否，不改单据状态）
  - name: skeleton
    description: |
      V3-1 骨架组门面（FR-V3-02~05, 23~25, 29）：工作台聚合 / 待办中心 / 全局搜索 /
      单据详情 / 组织架构 / 系统参数 / 单号规则 / 登录日志。facade 端点统一用
      dashboard:read，系统页用 sys:org / sys:config / sys:numberrule / sys:loginlog（ADMIN 直通）。
  - name: fin
    description: 财务中心（V3-2：科目 / 凭证 / 业务单据自动生成凭证 / 银行日记账 / 报销 / 发票 / 两张报表；金额单位元）
  - name: prm
    description: 价格与促销（FR-V3-20~21；金额口径=分、折扣=万分比，与 sal 一致）

paths:
  # ─────────────────────────── MDM ───────────────────────────
  /warehouses:
    get:
      tags: [mdm]
      summary: 查询仓库列表（返回数组，不分页）
      operationId: listWarehouses
      parameters:
        - name: onlyEnabled
          in: query
          description: 仅返回启用的仓库
          schema: { type: boolean, default: false }
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
    post:
      tags: [mdm]
      summary: 新建仓库
      operationId: createWarehouse
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseCreate' }
      responses:
        '201':
          $ref: '#/components/responses/SingleResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /warehouses/{id}:
    get:
      tags: [mdm]
      summary: 仓库详情
      operationId: getWarehouse
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [mdm]
      summary: 更新仓库（编码不可修改）
      operationId: updateWarehouse
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseUpdate' }
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /warehouses/{id}/disable:
    post:
      tags: [mdm]
      summary: 停用仓库
      description: 停用不删除；新单据不能再选择该仓库，历史单据与库存不受影响。
      operationId: disableWarehouse
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /suppliers:
    get:
      tags: [mdm]
      summary: 查询供应商列表
      operationId: listSuppliers
      parameters:
        - name: keyword
          in: query
          description: 同时匹配编码与名称（模糊）
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/PageResponse'
    post:
      tags: [mdm]
      summary: 新建供应商
      operationId: createSupplier
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierCreate' }
      responses:
        '201':
          $ref: '#/components/responses/SingleResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /suppliers/{id}:
    get:
      tags: [mdm]
      summary: 供应商详情
      operationId: getSupplier
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [mdm]
      summary: 更新供应商（编码不可修改）
      description: 省略 `enabled` 时后端按 `true` 处理，因此前端编辑时应始终回传当前状态。
      operationId: updateSupplier
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierUpdate' }
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /suppliers/{id}/disable:
    post:
      tags: [mdm]
      summary: 停用供应商
      description: 停用不删除；新进货单不能再选择该供应商，历史单据不受影响。
      operationId: disableSupplier
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /customers:
    get:
      tags: [mdm]
      summary: 查询客户列表
      operationId: listCustomers
      parameters:
        - name: keyword
          in: query
          description: 同时匹配编码、名称与电话（模糊）
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/PageResponse'
    post:
      tags: [mdm]
      summary: 新建客户
      operationId: createCustomer
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerCreate' }
      responses:
        '201':
          $ref: '#/components/responses/SingleResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /customers/{id}:
    get:
      tags: [mdm]
      summary: 客户详情
      operationId: getCustomer
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [mdm]
      summary: 更新客户（编码不可修改）
      description: 省略 `discountRate` 时保留原折扣率；省略 `enabled` 时后端按 `true` 处理。
      operationId: updateCustomer
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerUpdate' }
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /customers/{id}/disable:
    post:
      tags: [mdm]
      summary: 停用客户
      description: 停用不删除；新出货单不能再选择该客户，历史单据不受影响。
      operationId: disableCustomer
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /products:
    get:
      tags: [mdm]
      summary: 查询商品列表
      operationId: listProducts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: keyword
          in: query
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/PageResponse'
    post:
      tags: [mdm]
      summary: 新建商品（款式）
      operationId: createProduct
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreate' }
      responses:
        '201':
          $ref: '#/components/responses/SingleResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /products/{id}:
    get:
      tags: [mdm]
      summary: 商品详情
      operationId: getProduct
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [mdm]
      summary: 更新商品（编码不可改）
      description: '`code` 是业务主键的可见部分，创建后不可变更；本接口只改 `name`/`category`/`season`/`enabled`。'
      operationId: updateProduct
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdate' }
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /skus:
    get:
      tags: [mdm]
      summary: 查询 SKU 列表
      operationId: listSkus
      parameters:
        - name: productId
          in: query
          schema: { type: integer, format: int64 }
        - name: color
          in: query
          schema: { type: string }
        - name: skuSize
          in: query
          description: 尺码筛选（S/M/L）。**不能叫 size**：`size` 是全项目统一的分页条数参数。
          schema: { type: string }
        - name: seasonCode
          in: query
          description: FR-MDM-08 季节编码精确匹配（`SkuController.java:85`）
          schema: { type: string }
        - name: bandCode
          in: query
          description: FR-MDM-08 波段编码精确匹配（`SkuController.java:86`）
          schema: { type: string }
        - name: launchDateFrom
          in: query
          description: 上市日期下界（含）（`SkuController.java:87`）
          schema: { type: string, format: date }
        - name: launchDateTo
          in: query
          description: 上市日期上界（含）（`SkuController.java:88`）
          schema: { type: string, format: date }
        - name: seasonYear
          in: query
          description: 上市年份（由 `launchDate` 派生）（`SkuController.java:89`）
          schema: { type: integer }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/PageResponse'
    post:
      tags: [mdm]
      summary: 新建 SKU（或按颜色×尺码矩阵批量生成）
      description: |
        同一商品下 (color, size) 组合必须唯一，重复返回 MDM_SKU_DUPLICATED。
      operationId: createSku
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkuCreate' }
      responses:
        '201':
          $ref: '#/components/responses/SingleResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  # ─────────────────────────── INV ───────────────────────────
  /inventory:
    get:
      tags: [inv]
      summary: 实时库存查询（多仓/多SKU）
      description: |
        返回 `onHandQty` / `reservedQty` / `availableQty`。
        **可用量 availableQty = onHandQty − reservedQty**，下单只允许依据可用量（BR-INV-01）。
      operationId: queryInventory
      parameters:
        - name: skuId
          in: query
          schema: { type: integer, format: int64 }
        - name: warehouseId
          in: query
          schema: { type: integer, format: int64 }
        - name: batchNo
          in: query
          schema: { type: string }
        - name: onlyAvailable
          in: query
          description: 仅返回可用量 > 0 的行
          schema: { type: boolean, default: false }
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'

  /inventory/ledger:
    get:
      tags: [inv]
      summary: 库存流水（不可变，可反查来源单据）
      operationId: queryInventoryLedger
      parameters:
        - name: skuId
          in: query
          schema: { type: integer, format: int64 }
        - name: warehouseId
          in: query
          schema: { type: integer, format: int64 }
        - name: bizRefNo
          in: query
          description: 来源单据号，用于追溯某笔出入库
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/PageResponse'

  /inventory/reserve:
    post:
      tags: [inv]
      summary: 库存预占（下单锁定可用量）
      description: |
        - 只校验**可用量**，不足返回 `INV_INSUFFICIENT_STOCK`（409），且不产生任何副作用
        - 幂等：相同 `X-Request-Id` 重复请求只生效一次，第二次返回首次结果
        - 预占超过配置时长未出库将自动释放（BR-INV-05）
      operationId: reserveInventory
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReserveRequest' }
      responses:
        '200':
          description: 预占成功（或幂等命中，`duplicate=true`）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReserveResult' }
        '409':
          description: 可用量不足 / 幂等键冲突
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                insufficientStock:
                  summary: 可用量不足（错误消息须含定位信息）
                  value:
                    code: INV_INSUFFICIENT_STOCK
                    message: "库存不足：SKU 1001 在 上海仓 可用量 3，需求 5"
                    details: { skuId: 1001, warehouseId: 1, available: 3, required: 5 }
                    traceId: a1b2c3d4

  /inventory/reservations/{id}/release:
    post:
      tags: [inv]
      summary: 释放预占（取消订单 / 超时释放）
      operationId: releaseReservation
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─────────────── INV 作业（V2-1：调拨 / 盘点 / 调整 / 冻结 / 洞察） ───────────────

  /inventory/transfers:
    get:
      tags: [inv]
      summary: 调拨单列表（FR-INV-07）
      operationId: listInventoryTransfers
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [IN_TRANSIT, COMPLETED] }
        - name: fromWarehouseId
          in: query
          schema: { type: integer, format: int64 }
        - name: toWarehouseId
          in: query
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/PageResponse'
    post:
      tags: [inv]
      summary: 建调拨单并立即调出（两段式第一段）
      description: |
        建单即从源仓扣减实存并转入在途；库存不足整单回滚。
        守恒（INV-7）：源仓流水 + 在途 + 目的仓流水 == 0。
      operationId: createInventoryTransfer
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryTransferCreate' }
      responses:
        '200':
          description: 调拨单（duplicate=true 表示幂等命中）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/InventoryTransfer' }
        '409':
          $ref: '#/components/responses/Conflict'

  /inventory/transfers/{id}/receive:
    post:
      tags: [inv]
      summary: 调拨到货（两段式第二段）
      description: 在途量结清、目的仓实存增加；同键重放返回首次结果。
      operationId: receiveInventoryTransfer
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /inventory/stocktakes:
    get:
      tags: [inv]
      summary: 盘点单列表（FR-INV-08）
      operationId: listStocktakes
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, POSTED] }
        - name: warehouseId
          in: query
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/PageResponse'
    post:
      tags: [inv]
      summary: 建盘点单（快照账面量）
      operationId: createStocktake
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StocktakeCreate' }
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /inventory/stocktakes/{id}/post:
    post:
      tags: [inv]
      summary: 盘点过账（差异生成 ADJUST_IN/OUT 流水）
      description: |
        差异为 0 的行不产生调整流水；整单全部为 0 时返回 `INV_STOCKTAKE_NO_DIFFERENCE`。
      operationId: postStocktake
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /inventory/adjustments:
    get:
      tags: [inv]
      summary: 库存调整列表（FR-INV-09）
      operationId: listInventoryAdjustments
      parameters:
        - name: skuId
          in: query
          schema: { type: integer, format: int64 }
        - name: warehouseId
          in: query
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/PageResponse'
    post:
      tags: [inv]
      summary: 库存调整（原因必填）
      operationId: createInventoryAdjustment
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryAdjustmentCreate' }
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '400':
          description: 原因缺失 / 数量为 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          $ref: '#/components/responses/Conflict'

  /inventory/freezes:
    get:
      tags: [inv]
      summary: 冻结记录列表（FR-INV-10）
      operationId: listInventoryFreezes
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, RELEASED, EXPIRED] }
        - name: skuId
          in: query
          schema: { type: integer, format: int64 }
        - name: warehouseId
          in: query
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/PageResponse'
    post:
      tags: [inv]
      summary: 冻结库存（冻结量不进可用量）
      operationId: createInventoryFreeze
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryFreezeCreate' }
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /inventory/freezes/{id}/release:
    post:
      tags: [inv]
      summary: 解冻库存（人工）
      operationId: releaseInventoryFreeze
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /inventory/balance-dimensions:
    get:
      tags: [inv]
      summary: 五维结存查询（仓 × SKU × 批次 × 状态 × 权属，FR-INV-11）
      description: |
        每条余额按状态拆成 AVAILABLE / RESERVED / FROZEN 三行；
        对任一 (仓, SKU, 批次, 权属)，Σ各状态 == totals.onHandQty。
      operationId: queryBalanceDimensions
      parameters:
        - name: skuId
          in: query
          schema: { type: integer, format: int64 }
        - name: warehouseId
          in: query
          schema: { type: integer, format: int64 }
        - name: batchNo
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [AVAILABLE, RESERVED, FROZEN] }
        - name: ownership
          in: query
          schema: { type: string, enum: [SELF], default: SELF }
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'

  /inventory/alerts:
    get:
      tags: [inv]
      summary: 库存预警（安全库存 / 滞销 / 临期，FR-INV-12）
      description: 临期与滞销边界由服务端注入时钟计算，不接受客户端时间。
      operationId: queryInventoryAlerts
      parameters:
        - name: warehouseId
          in: query
          schema: { type: integer, format: int64 }
        - name: type
          in: query
          schema: { type: string, enum: [SAFETY, SLOW_MOVING, EXPIRING] }
        - name: expiringDays
          in: query
          description: 临期阈值（天），默认 30
          schema: { type: integer, minimum: 0, default: 30 }
        - name: slowMovingDays
          in: query
          description: 滞销阈值（天），默认 90
          schema: { type: integer, minimum: 0, default: 90 }
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'

  /inventory/replenishment:
    get:
      tags: [inv]
      summary: 补货建议（min/max 阈值档，FR-INV-13）
      description: |
        可用量低于 min_level 时建议补到 max_level；
        同仓同 SKU 已有 APPROVED/PARTIAL 未到货进货行时不重复建议。
        纯查询、不落表，重复调用结果一致。
      operationId: queryReplenishment
      parameters:
        - name: warehouseId
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'

  # ─────────────────────────── PUR ───────────────────────────
  /purchase-orders:
    get:
      tags: [pur]
      summary: 查询进货单
      operationId: listPurchaseOrders
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - name: supplierId
          in: query
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/PageResponse'
    post:
      tags: [pur]
      summary: 创建进货单（草稿）
      operationId: createPurchaseOrder
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOrderCreate' }
      responses:
        '201':
          $ref: '#/components/responses/SingleResponse'

  /purchase-orders/{id}:
    get:
      tags: [pur]
      summary: 进货单详情
      operationId: getPurchaseOrder
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /purchase-orders/{id}/receive:
    post:
      tags: [pur]
      summary: 入库确认（生成入库流水、增加库存）
      description: |
        - 支持分批入库；累计入库量不得超过单据数量（BR-DOC-04 → PUR_OVER_RECEIVE）
        - 入库后生成 `inventory_ledger` 正向流水（biz_type=PURCHASE_IN）
      operationId: receivePurchaseOrder
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceiveRequest' }
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /purchase-orders/{id}/void:
    post:
      tags: [pur]
      summary: 作废/红冲进货单
      description: |
        已入库的作废必须先生成反向流水冲减库存（BR-DOC-03）。

        - 未入库（DRAFT/SUBMITTED/APPROVED/REJECTED）：普通作废，状态 → VOIDED，不动库存、不写流水
        - 已入库（PARTIAL/COMPLETED）：**红冲** —— 按原 `PURCHASE_IN` 流水逐批次回退实存，
          逐条写 `PURCHASE_REVERSAL` 负向流水（同批次、数量取反、biz_ref_no 仍是本单号），状态 → VOIDED
        - 回退要求该批次当前实存足够且回退后不低于已预占量；不足（货已卖出/被预占）
          → `INV_NEGATIVE_NOT_ALLOWED`，**不跨批次挪用**，且失败零副作用（状态/库存/流水都不动）
        - 单据业务日期所在账期已月结锁账 → `SET_PERIOD_CLOSED`（同键重放除外）
        - 幂等：同一 `X-Request-Id` 重放返回首次的 VOIDED 结果，不重复回退库存；
          已作废后用**新键**再作废 → `PUR_STATUS_ILLEGAL`
        - 并发异键红冲由「状态 + version 条件 UPDATE」串行化，只有一个成功
      operationId: voidPurchaseOrder
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '409':
          description: 状态非法 / 账期已锁 / 库存不足 / 重复请求
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                alreadyVoided:
                  value:
                    code: PUR_STATUS_ILLEGAL
                    message: "进货单 PO20250601-0001 已作废（首次作废请求与本次不同），不能再次作废"
                periodClosed:
                  value:
                    code: SET_PERIOD_CLOSED
                    message: "账期 2025-06 已月结锁账（业务日期 2025-06-01 落在该期间），不允许再新增或变更该期间的单据"
                    details: { period: '2025-06', bizDate: '2025-06-01' }
                insufficientStock:
                  value:
                    code: INV_NEGATIVE_NOT_ALLOWED
                    message: "进货红冲失败：SKU 1001 在仓库 1 批次 'B1' 当前实存 2、已预占 0，需要回退 4（回退后会为负或低于预占）"
                    details: { skuId: 1001, warehouseId: 1, batchNo: 'B1', onHand: 2, reserved: 0, required: 4 }

  # ─────────────────────────── SAL ───────────────────────────
  /sales-orders:
    get:
      tags: [sal]
      summary: 查询出货单
      description: 明细行返回累计已退数量 `returnedQty`，供退货页计算剩余可退数量。
      operationId: listSalesOrders
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - name: customerId
          in: query
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 出货单分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiPageResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/SalesOrder' }
    post:
      tags: [sal]
      summary: 创建出货单（同时预占库存）
      operationId: createSalesOrder
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalesOrderCreate' }
      responses:
        '201':
          description: 建单成功（返回出货单与明细）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SalesOrder' }
        '409':
          $ref: '#/components/responses/Conflict'

  /sales-orders/{id}/ship:
    post:
      tags: [sal]
      summary: 出货确认（预占转出库、扣减库存）
      description: |
        - 将 reserved_qty 转为实际出库：on_hand_qty 与 reserved_qty 同时减少
        - 按 FEFO 扣减批次（BR-INV-06），单笔可拆多批次 → 产生多条流水
      operationId: shipSalesOrder
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '409':
          description: 库存不足 / 状态非法
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                insufficientStock:
                  value:
                    code: INV_INSUFFICIENT_STOCK
                    message: "库存不足：SKU 1001 在 上海仓 可用量 3，需求 5"
                    details: { skuId: 1001, warehouseId: 1, available: 3, required: 5 }

  /sales-orders/{id}/void:
    post:
      tags: [sal]
      summary: 作废/红冲出货单（回补库存）
      description: |
        - 未出货（DRAFT/SUBMITTED/APPROVED/REJECTED）：普通作废，释放本单预占，状态 → VOIDED，不动实存
        - 已出货（PARTIAL/COMPLETED）：**红冲** —— 按原 `SALES_OUT` 流水逐批次回补实存，
          逐条写 `SALES_REVERSAL` 正向流水（同批次、数量取反、biz_ref_no 仍是本单号）；
          `PARTIAL` 上仍未出货的 ACTIVE 预占一并释放，避免库存被永久锁死
        - 任一明细已有退货数量 → `SAL_STATUS_ILLEGAL`（退货已通过 RETURN_IN 回补过库存，
          再全额红冲会重复入库）；红冲后原单上待入库的退货单再入库 → `RMA_ORIGIN_NOT_SHIPPED`
        - 单据业务日期所在账期已月结锁账 → `SET_PERIOD_CLOSED`（同键重放除外）
        - 幂等：同一 `X-Request-Id` 重放返回首次的 VOIDED 结果，不重复回补库存；
          已作废后用**新键**再作废 → `SAL_STATUS_ILLEGAL`
        - 并发异键红冲由「状态 + version 条件 UPDATE」串行化，只有一个成功
      operationId: voidSalesOrder
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '409':
          description: 状态非法 / 有退货不可红冲 / 账期已锁
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                alreadyVoided:
                  value:
                    code: SAL_STATUS_ILLEGAL
                    message: "出货单 SO20250601-0001 已作废（首次作废请求与本次不同），不能再次作废"
                hasReturns:
                  value:
                    code: SAL_STATUS_ILLEGAL
                    message: "出货单 SO20250601-0001 已退货 2 件，不能红冲（退货已回补库存，再红冲会重复入库）"
                periodClosed:
                  value:
                    code: SET_PERIOD_CLOSED
                    message: "账期 2025-06 已月结锁账（业务日期 2025-06-01 落在该期间），不允许再新增或变更该期间的单据"
                    details: { period: '2025-06', bizDate: '2025-06-01' }

  # ─────────────────────────── RMA ───────────────────────────
  /return-orders:
    get:
      tags: [rma]
      summary: 查询退货单（rma:read）
      operationId: listReturnOrders
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - name: customerId
          in: query
          schema: { type: integer, format: int64 }
        - name: originSalesOrderId
          in: query
          description: 按原出货单筛选
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 退货单分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiPageResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ReturnOrder' }
    post:
      tags: [rma]
      summary: 创建退货单（rma:create）
      description: |
        - 原出货单必须已出货（PARTIAL / COMPLETED），否则返回 `RMA_ORIGIN_NOT_SHIPPED`
        - 只接收原明细行与退货数量；单价、折扣、客户、仓库全部从原出货单派生
        - 累计退货数量不得超过已出货数量（`RMA_QTY_EXCEED_ORIGIN`）
        - 建单不改变库存；相同 `X-Request-Id` 重复提交返回首次结果
      operationId: createReturnOrder
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnOrderCreate' }
      responses:
        '201':
          $ref: '#/components/responses/ReturnOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # 退货建单页的"选原出货单"数据源。刻意挂在 /return-orders 下、由 RMA 提供：
  # 只有 rma:* 的销售员没有 sal:read，跨模块调 /sales-orders 会 403（计划书 §6 坑 13）。
  /return-orders/returnable-orders:
    get:
      tags: [rma]
      summary: 查询可退货的出货单（rma:read）
      description: |
        - 只返回 `status IN (PARTIAL, COMPLETED)` **且至少还有一行 `shippedQty − returnedQty > 0`** 的出货单；
        - 已全部退完的单据不出现（列出来也建不了单）；未出货的 DRAFT / SUBMITTED / APPROVED 同样不出现；
        - 可退口径由出货域单一定义，本接口只转发，不再算一份"看起来一样"的可退数量；
        - 分页走通用口径：`total` = 满足条件的出货单**张数**，`size` 上限 200。
          调用方必须翻页或用 `total > items.length` 判断"可能没列全"，禁止把 200 上限当全量（§6 坑 14）。
      operationId: listReturnableOrders
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 可退货出货单分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiPageResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ReturnableOrder' }

  /return-orders/{id}:
    get:
      tags: [rma]
      summary: 退货单详情（rma:read）
      operationId: getReturnOrder
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/ReturnOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /return-orders/{id}/submit:
    post:
      tags: [rma]
      summary: 提交退货单（rma:submit）
      description: 状态流转 DRAFT → SUBMITTED。
      operationId: submitReturnOrder
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/ReturnOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /return-orders/{id}/approve:
    post:
      tags: [rma]
      summary: 审核退货单（rma:approve）
      description: 状态流转 SUBMITTED → APPROVED；审核不改变库存。
      operationId: approveReturnOrder
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/ReturnOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /return-orders/{id}/reject:
    post:
      tags: [rma]
      summary: 驳回退货单（rma:reject）
      description: 状态流转 SUBMITTED → REJECTED；驳回不改变库存。
      operationId: rejectReturnOrder
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/ReturnOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /return-orders/{id}/receive:
    post:
      tags: [rma]
      summary: 退货入库（rma:receive）
      description: |
        - **整单一次性回补库存**，不接收分批入库参数（无请求体）
        - 只通过库存模块生成 `RETURN_IN` 正向流水，并原子累加原出货行的累计退货量
        - 状态流转 APPROVED → COMPLETED
        - 相同 `X-Request-Id` 重复调用不重复加库存；已完成后换新 requestId 再入库返回 `RMA_STATUS_ILLEGAL`
        - ★ 入库前会先锁定原出货单：原单已被红冲为 `VOIDED` 时返回 `RMA_ORIGIN_NOT_SHIPPED`
          （否则会先把货退回来、红冲再回补一次，同一批货入库两遍）
      operationId: receiveReturnOrder
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/ReturnOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /return-orders/{id}/void:
    post:
      tags: [rma]
      summary: 作废退货单（rma:void）
      description: 仅入库前可作废（DRAFT / SUBMITTED / APPROVED → VOIDED）；已完成需红冲，M2 不支持，M2.5 的红冲范围只有进货单与出货单（FR-PUR-03 / FR-SAL-04），退货单红冲仍未提供。
      operationId: voidReturnOrder
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/ReturnOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ─────────────────────────── SET ───────────────────────────
  /settlements/daily:
    post:
      tags: [set]
      summary: 日清（每日汇总当日出入库与金额）
      description: |
        - **幂等**：同一账期重复执行结果完全一致（BR-SET-01）
        - 业务日期由 `bizDate` 指定，**不依赖系统当前时间**（可测性设计，见 docs/06）
      operationId: runDailySettlement
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DailySettlementRequest' }
      responses:
        '200':
          description: 日清结果（按仓库 items + 全部仓库 totals）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DailySettlementResult' }
        '409':
          $ref: '#/components/responses/Conflict'

  /settlements/monthly:
    post:
      tags: [set]
      summary: 月结（期间结账并锁账）
      description: 锁账后该期间单据不可新增/修改（BR-SET-02 → SET_PERIOD_CLOSED）。
      operationId: runMonthlySettlement
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MonthlySettlementRequest' }
      responses:
        '200':
          description: 月结结果（期间汇总 + 关闭时间）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MonthlySettlementResult' }
        '409':
          $ref: '#/components/responses/Conflict'

  /settlements/reconcile:
    get:
      tags: [set]
      summary: 总账与明细对账（差额必须为 0）
      description: 差额非 0 返回 `SET_RECONCILE_MISMATCH`，对应不变量 INV-5。
      operationId: reconcile
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: 对账结果（差额必须为 0）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReconcileResult' }
        '409':
          description: 账期未结算 / 对账不平
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                periodNotClosed:
                  value:
                    code: SET_PERIOD_NOT_CLOSED
                    message: "账期 2025-06 尚未月结，无法对账"
                    details: { period: '2025-06' }
                mismatch:
                  value:
                    code: SET_RECONCILE_MISMATCH
                    message: "对账不平：账期 2025-06 总账 100000 分，明细合计 99990 分，差额 10 分"
                    details: { period: '2025-06', generalTotal: 100000, detailTotal: 99990, diff: 10 }

  /settlements/periods:
    get:
      tags: [set]
      summary: 账期列表查询（set:read，只读）
      description: |
        - **存在的理由**（计划书 §6 坑 15）：日清 / 月结是 POST、对账要 `set:reconcile`，
          所以只有 `set:read` 的账号（VIEWER / FINANCE）进得了结算页却拿不到任何数据，
          月结结果（`status` / `closedAt`）刷新即失。本接口是 `set:read` 唯一可消费的读出口。
        - **只读**：直接返回 `settlement_periods` 已落的行，不重算、不写任何表；
          与对账（`GET /settlements/reconcile`）分工不同 —— 这里回答"每个账期结没结、结出来多少"，
          对账回答"总账与明细平不平"（后者是财务动作，仍要 `set:reconcile`）。
        - 分页走通用口径：`total` = 满足条件的**账期行数**，`size` 上限 200；按 `period` 倒序（最新期间在前）。
        - `closedAt` / `closedBy` 在 `OPEN` 行上是 `null`；账期行不存在时**不补 0 值行**
          （"没结过账"和"结了账但是 0 元"是两件事，见 §3.4 对账同理）。
      operationId: listSettlementPeriods
      parameters:
        - name: status
          in: query
          required: false
          description: 省略 = 全部账期；`CLOSED` 即已锁账（写操作会被 PeriodGuard 拒绝）
          schema: { type: string, enum: [OPEN, CLOSED] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 账期分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiPageResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/SettlementPeriodRow' }
        '400':
          description: status 取值非法（不是 OPEN / CLOSED）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

