      summary: 经营日报/月报（流水四数满足 INV-6，单据金额另列）
      description: |
        - 期初 / 本期入 / 本期出 / 期末来自库存流水 `occurred_at`，逐行满足
          `期初 + 本期入 − 本期出 == 期末`（INV-6）。
        - 进货 / 销售数量与金额来自单据 `biz_date`，与流水是**两组口径**，
          同一天不一定相等，禁止相加或互相推算。
        - `dimension=month` 按 from/to 所在的**完整自然月**统计（首月从月初、
          末月到月末），否则月行恒等式会缺腿。
      operationId: operatingReport
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: dimension
          in: query
          description: day=逐自然日（空日也出行）；month=完整自然月
          schema: { type: string, enum: [day, month], default: day }
        - name: warehouseId
          in: query
          schema: { type: integer, format: int64 }
      responses:
