  # ─────────────────────────── SAL · 客户信用与账期（FR-SAL-09） ───────────────────────────
  # 实现位于 com/erp/sal（敞口口径来自应收与出货单），但落在 /customers 子路径下，
  # 权限沿用主数据的 mdm:read / mdm:write —— 契约按现实声明。
  /customers/{id}/credit:
    get:
      tags: [sal]
      summary: 客户信用视图（额度、敞口、可用额度、逾期）
      description: |
        - `exposureAmount`（敞口）= **应收未收余额**（`status <> 'VOIDED'` 的 `balance` 合计）
          **+ 未出货订单金额**（APPROVED/PARTIAL 单据的 `Σ (qty − shippedQty) × 行单价 × 折扣`）
        - `availableCredit = creditLimit − exposureAmount`，下限 0
        - **哨兵值**：`creditLimit = 0` 表示**不设限**，此时 `availableCredit = -1`
          （-1 不是「欠了 1 分」，前端必须按「无限额」渲染，不要直接展示 -1）
        - `creditDays` 是账期天数，`0` = 现结（发货即要求收款）
        - `dueDate` 由出货单 `bizDate + creditDays` 推导，`overdueAmount` 据此统计
        - `snapshotDate` = 本次计算所用的当天日期（来自 `ClockProvider`，可复现对账口径）
      operationId: getCustomerCredit
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 信用视图
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CustomerCredit' }
              examples:
                controlled:
                  value:
                    code: OK
                    message: success
                    data:
                      customerId: 1
                      creditLimit: 200000
                      creditDays: 30
                      exposureAmount: 55000
                      availableCredit: 145000
                      overdueAmount: 0
                      snapshotDate: '2026-10-23'
                unlimited:
                  value:
                    code: OK
                    message: success
                    data:
                      customerId: 2
                      creditLimit: 0
                      creditDays: 0
                      exposureAmount: 12900
                      availableCredit: -1
                      overdueAmount: 0
                      snapshotDate: '2026-10-23'
        '404':
          description: '`SYS_NOT_FOUND`（客户不存在）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    put:
      tags: [sal]
      summary: 调整客户信用额度与账期
      description: |
        - 只改 `creditLimit` 与 `creditDays` 两列（主数据其余字段走 `PUT /customers/{id}`）
        - 两者都必须 ≥ 0；`creditLimit = 0` = 取消信用控制（不设限）
        - **本端点不做「新额度必须覆盖当前敞口」的校验**：调低额度允许历史敞口挂账，
          超限在**下一次建单/报价转化**时以 `SAL_CREDIT_LIMIT_EXCEEDED`(409) 拦住
          （见 `POST /sales-orders`、`POST /sales-orders/auto-split`、`POST /sales-quotes/{id}/convert`）
        - 幂等：PUT 全量覆盖，重复提交结果一致，**不消费 `X-Request-Id`**
        - 响应是调整**之后**的完整信用视图（敞口随之重算，可直接确认效果）
      operationId: updateCustomerCredit
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerCreditUpdate' }
      responses:
        '200':
          description: 调整后的信用视图
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CustomerCredit' }
        '400':
          description: '`SYS_VALIDATION_ERROR`（额度或账期为负 / 请求体缺字段）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: '`SYS_NOT_FOUND`（客户不存在）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  # ══════════════════════════════════════════════════════════════════════════
  # B1 · 租户 UI / 平台租户管理（FR-TNT-07/08）· 2026-10-25
  #
  # 本段只追加与租户/认证相关的 3 个操作；不改 MDM、报表等其它泳道的路径。
  # 权限边界：
  #   · /auth/switch-tenant  → 登录用户对自己会话的操作，无业务权限码；
  #   · /tenants*            → tenant:manage，且**不接受 ADMIN 角色短路**
  #     （普通租户也有 ADMIN；只有平台租户 id=1 的 ADMIN 被种了该权限码）。
  # 平台管理员只能管理 tenants 元数据，业务请求仍由 TenantSql 按当前租户过滤，
  # 跨租户业务数据仍返回 404 —— 这条边界由后端用例守着。
  # ══════════════════════════════════════════════════════════════════════════

  /auth/switch-tenant:
    post:
      tags: [iam]
      summary: 切换本次会话的行动租户（重新签发 JWT）
      description: |
        校验目标租户是当前账号的成员且处于启用状态，然后**重新签发** JWT
        （`tid` 变为目标租户），返回与登录同形的会话快照。

        ★ 必须重新签发而不是只改前端显示：租户在服务端决定每次请求的数据边界；
        只改显示会让"界面是租户 B、实际读写租户 A"同时成立，是最危险的一类假象。

        未知租户编码与非成员返回同一个 `IAM_TENANT_NOT_MEMBER`（403），
        不借错误码泄露"系统里有哪些租户"；停用租户返回 `IAM_TENANT_DISABLED`（403）。

        幂等：状态迁移型（只换出一个新 token，无持久数量副作用），
        **不消费 `X-Request-Id`**；重复切换会产生多个彼此独立、tid 相同的 token。
      operationId: switchTenant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SwitchTenantRequest' }
      responses:
        '200':
          description: 切换成功；`data.token` 是带新 `tid` 的 Bearer JWT
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginResult' }
        '400':
          description: '`SYS_VALIDATION_ERROR` —— 租户编码缺失/超长'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            `IAM_TENANT_NOT_MEMBER`（非成员 / 未知编码，刻意不区分）/
            `IAM_TENANT_DISABLED`（目标租户已停用）/ `IAM_ACCOUNT_DISABLED`（账号已停用）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /tenants:
    get:
      tags: [iam]
      summary: 租户清单（平台租户元数据，不分页）
      description: |
        权限码 `tenant:manage`，且**不接受 ADMIN 角色短路**：每个租户都有自己的
        ADMIN，若沿用短路，普通租户管理员也能看到并调用平台接口。V17 只把该权限码
        种给平台租户（id=1）的 ADMIN。

        只读 `tenants` 元数据（id / code / name / enabled），**不返回任何业务数据**；
        平台管理员拿其它租户的业务 id 请求业务接口仍是 404。
      operationId: listTenants
      responses:
        '200':
          description: 租户列表（按 id 升序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/TenantView' }
        '403':
          description: '`IAM_FORBIDDEN` —— 缺少 `tenant:manage`（普通租户 ADMIN 也会落到这里）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /tenants/{id}/enabled:
    post:
      tags: [iam]
      summary: 启用 / 停用租户（平台元数据）
      description: |
        权限码 `tenant:manage`（同样不接受 ADMIN 短路）。纯开关，不消费 `X-Request-Id`。

        停用后的即时语义：该租户的既有 token 在**下一个请求**就 401
        （`AuthenticationService.resolve` 校验租户启用），不需要等 token 过期。

        两条自我保护：不能停用平台租户（id=1，平台管理员的账号主租户），
        不能停用当前所在租户（否则本会话连"再启用回来"的请求都会被拒绝）。
      operationId: setTenantEnabled
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetEnabledRequest' }
      responses:
        '200':
          description: 更新后的租户元数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TenantView' }
        '403':
          description: '`IAM_FORBIDDEN` —— 缺少 `tenant:manage`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: '`TENANT_NOT_FOUND` —— 租户 id 不存在'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: '`TENANT_STATE_ILLEGAL` —— 停用平台租户，或停用当前所在租户'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

