openapi: 3.0.3
info:
  title: 进销存系统 API（服装/鞋帽网店）
  version: 0.1.0-M0
  description: |
    本文件是**全项目接口的单一事实源（Single Source of Truth）**。

    工作流（见 docs/ADR-0008）：
      ① 改本文件 → ② 服务端实现 → ③ springdoc 导出后与本体 diff（CI 失败即漂移）
      → ④ 生成三端 TS SDK → ⑤ 契约测试 / Schemathesis 属性测试 → ⑥ 生成 index/api-map.md

    约定（见 docs/05-接口契约规范.md）：
      - 金额字段一律为**整数「分」**，字段名以 Amount 结尾
      - 时间格式 ISO-8601 带时区
      - 状态变更走子路径动作（/{id}/receive、/{id}/ship）
      - 写操作必须携带 X-Request-Id（幂等键）
servers:
  - url: http://localhost:8080/api/v1
    description: 本地开发
  - url: https://api.example.com/api/v1
    description: 线上（M6 部署后替换）

tags:
  - name: mdm
    description: 主数据（商品 / SKU / 仓库）
  - name: inv
    description: 库存（余额 / 流水 / 预占）
  - name: pur
    description: 采购进货
  - name: sal
    description: 销售出货
  - name: rma
    description: 退货（RMA）
  - name: set
    description: 结算与对账
  - name: rpt
    description: 报表统计
  - name: nl
    description: 自然语言操作（意图解析 + 调度既有业务服务，FR-SYS-04）

paths:
  # ─────────────────────────── MDM ───────────────────────────
  /warehouses:
    get:
      tags: [mdm]
      summary: 查询仓库列表（返回数组，不分页）
      operationId: listWarehouses
      parameters:
        - name: onlyEnabled
          in: query
          description: 仅返回启用的仓库
          schema: { type: boolean, default: false }
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
    post:
      tags: [mdm]
      summary: 新建仓库
      operationId: createWarehouse
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseCreate' }
      responses:
        '201':
          $ref: '#/components/responses/SingleResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /warehouses/{id}:
    get:
      tags: [mdm]
      summary: 仓库详情
      operationId: getWarehouse
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [mdm]
      summary: 更新仓库（编码不可修改）
      operationId: updateWarehouse
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseUpdate' }
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /warehouses/{id}/disable:
    post:
      tags: [mdm]
      summary: 停用仓库
      description: 停用不删除；新单据不能再选择该仓库，历史单据与库存不受影响。
      operationId: disableWarehouse
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /suppliers:
    get:
      tags: [mdm]
      summary: 查询供应商列表
      operationId: listSuppliers
      parameters:
        - name: keyword
          in: query
          description: 同时匹配编码与名称（模糊）
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/PageResponse'
    post:
      tags: [mdm]
      summary: 新建供应商
      operationId: createSupplier
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierCreate' }
      responses:
        '201':
          $ref: '#/components/responses/SingleResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /suppliers/{id}:
    get:
      tags: [mdm]
      summary: 供应商详情
      operationId: getSupplier
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [mdm]
      summary: 更新供应商（编码不可修改）
      description: 省略 `enabled` 时后端按 `true` 处理，因此前端编辑时应始终回传当前状态。
      operationId: updateSupplier
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierUpdate' }
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /suppliers/{id}/disable:
    post:
      tags: [mdm]
      summary: 停用供应商
      description: 停用不删除；新进货单不能再选择该供应商，历史单据不受影响。
      operationId: disableSupplier
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /customers:
    get:
      tags: [mdm]
      summary: 查询客户列表
      operationId: listCustomers
      parameters:
        - name: keyword
          in: query
          description: 同时匹配编码、名称与电话（模糊）
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/PageResponse'
    post:
      tags: [mdm]
      summary: 新建客户
      operationId: createCustomer
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerCreate' }
      responses:
        '201':
          $ref: '#/components/responses/SingleResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /customers/{id}:
    get:
      tags: [mdm]
      summary: 客户详情
      operationId: getCustomer
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [mdm]
      summary: 更新客户（编码不可修改）
      description: 省略 `discountRate` 时保留原折扣率；省略 `enabled` 时后端按 `true` 处理。
      operationId: updateCustomer
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerUpdate' }
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /customers/{id}/disable:
    post:
      tags: [mdm]
      summary: 停用客户
      description: 停用不删除；新出货单不能再选择该客户，历史单据不受影响。
      operationId: disableCustomer
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /products:
    get:
      tags: [mdm]
      summary: 查询商品列表
      operationId: listProducts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: keyword
          in: query
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/PageResponse'
    post:
      tags: [mdm]
      summary: 新建商品（款式）
      operationId: createProduct
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreate' }
      responses:
        '201':
          $ref: '#/components/responses/SingleResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /products/{id}:
    get:
      tags: [mdm]
      summary: 商品详情
      operationId: getProduct
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /skus:
    get:
      tags: [mdm]
      summary: 查询 SKU 列表
      operationId: listSkus
      parameters:
        - name: productId
          in: query
          schema: { type: integer, format: int64 }
        - name: color
          in: query
          schema: { type: string }
        - name: skuSize
          in: query
          description: 尺码筛选（S/M/L）。**不能叫 size**：`size` 是全项目统一的分页条数参数。
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/PageResponse'
    post:
      tags: [mdm]
      summary: 新建 SKU（或按颜色×尺码矩阵批量生成）
      description: |
        同一商品下 (color, size) 组合必须唯一，重复返回 MDM_SKU_DUPLICATED。
      operationId: createSku
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkuCreate' }
      responses:
        '201':
          $ref: '#/components/responses/SingleResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  # ─────────────────────────── INV ───────────────────────────
  /inventory:
    get:
      tags: [inv]
      summary: 实时库存查询（多仓/多SKU）
      description: |
        返回 `onHandQty` / `reservedQty` / `availableQty`。
        **可用量 availableQty = onHandQty − reservedQty**，下单只允许依据可用量（BR-INV-01）。
      operationId: queryInventory
      parameters:
        - name: skuId
          in: query
          schema: { type: integer, format: int64 }
        - name: warehouseId
          in: query
          schema: { type: integer, format: int64 }
        - name: batchNo
          in: query
          schema: { type: string }
        - name: onlyAvailable
          in: query
          description: 仅返回可用量 > 0 的行
          schema: { type: boolean, default: false }
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'

  /inventory/ledger:
    get:
      tags: [inv]
      summary: 库存流水（不可变，可反查来源单据）
      operationId: queryInventoryLedger
      parameters:
        - name: skuId
          in: query
          schema: { type: integer, format: int64 }
        - name: warehouseId
          in: query
          schema: { type: integer, format: int64 }
        - name: bizRefNo
          in: query
          description: 来源单据号，用于追溯某笔出入库
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/PageResponse'

  /inventory/reserve:
    post:
      tags: [inv]
      summary: 库存预占（下单锁定可用量）
      description: |
        - 只校验**可用量**，不足返回 `INV_INSUFFICIENT_STOCK`（409），且不产生任何副作用
        - 幂等：相同 `X-Request-Id` 重复请求只生效一次，第二次返回首次结果
        - 预占超过配置时长未出库将自动释放（BR-INV-05）
      operationId: reserveInventory
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReserveRequest' }
      responses:
        '200':
          description: 预占成功（或幂等命中，`duplicate=true`）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReserveResult' }
        '409':
          description: 可用量不足 / 幂等键冲突
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                insufficientStock:
                  summary: 可用量不足（错误消息须含定位信息）
                  value:
                    code: INV_INSUFFICIENT_STOCK
                    message: "库存不足：SKU 1001 在 上海仓 可用量 3，需求 5"
                    details: { skuId: 1001, warehouseId: 1, available: 3, required: 5 }
                    traceId: a1b2c3d4

  /inventory/reservations/{id}/release:
    post:
      tags: [inv]
      summary: 释放预占（取消订单 / 超时释放）
      operationId: releaseReservation
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─────────────── INV 作业（V2-1：调拨 / 盘点 / 调整 / 冻结 / 洞察） ───────────────

  /inventory/transfers:
    get:
      tags: [inv]
      summary: 调拨单列表（FR-INV-07）
      operationId: listInventoryTransfers
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [IN_TRANSIT, COMPLETED] }
        - name: fromWarehouseId
          in: query
          schema: { type: integer, format: int64 }
        - name: toWarehouseId
          in: query
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/PageResponse'
    post:
      tags: [inv]
      summary: 建调拨单并立即调出（两段式第一段）
      description: |
        建单即从源仓扣减实存并转入在途；库存不足整单回滚。
        守恒（INV-7）：源仓流水 + 在途 + 目的仓流水 == 0。
      operationId: createInventoryTransfer
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryTransferCreate' }
      responses:
        '200':
          description: 调拨单（duplicate=true 表示幂等命中）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/InventoryTransfer' }
        '409':
          $ref: '#/components/responses/Conflict'

  /inventory/transfers/{id}/receive:
    post:
      tags: [inv]
      summary: 调拨到货（两段式第二段）
      description: 在途量结清、目的仓实存增加；同键重放返回首次结果。
      operationId: receiveInventoryTransfer
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /inventory/stocktakes:
    get:
      tags: [inv]
      summary: 盘点单列表（FR-INV-08）
      operationId: listStocktakes
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, POSTED] }
        - name: warehouseId
          in: query
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/PageResponse'
    post:
      tags: [inv]
      summary: 建盘点单（快照账面量）
      operationId: createStocktake
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StocktakeCreate' }
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /inventory/stocktakes/{id}/post:
    post:
      tags: [inv]
      summary: 盘点过账（差异生成 ADJUST_IN/OUT 流水）
      description: |
        差异为 0 的行不产生调整流水；整单全部为 0 时返回 `INV_STOCKTAKE_NO_DIFFERENCE`。
      operationId: postStocktake
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /inventory/adjustments:
    get:
      tags: [inv]
      summary: 库存调整列表（FR-INV-09）
      operationId: listInventoryAdjustments
      parameters:
        - name: skuId
          in: query
          schema: { type: integer, format: int64 }
        - name: warehouseId
          in: query
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/PageResponse'
    post:
      tags: [inv]
      summary: 库存调整（原因必填）
      operationId: createInventoryAdjustment
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryAdjustmentCreate' }
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '400':
          description: 原因缺失 / 数量为 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          $ref: '#/components/responses/Conflict'

  /inventory/freezes:
    get:
      tags: [inv]
      summary: 冻结记录列表（FR-INV-10）
      operationId: listInventoryFreezes
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, RELEASED, EXPIRED] }
        - name: skuId
          in: query
          schema: { type: integer, format: int64 }
        - name: warehouseId
          in: query
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/PageResponse'
    post:
      tags: [inv]
      summary: 冻结库存（冻结量不进可用量）
      operationId: createInventoryFreeze
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryFreezeCreate' }
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /inventory/freezes/{id}/release:
    post:
      tags: [inv]
      summary: 解冻库存（人工）
      operationId: releaseInventoryFreeze
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /inventory/balance-dimensions:
    get:
      tags: [inv]
      summary: 五维结存查询（仓 × SKU × 批次 × 状态 × 权属，FR-INV-11）
      description: |
        每条余额按状态拆成 AVAILABLE / RESERVED / FROZEN 三行；
        对任一 (仓, SKU, 批次, 权属)，Σ各状态 == totals.onHandQty。
      operationId: queryBalanceDimensions
      parameters:
        - name: skuId
          in: query
          schema: { type: integer, format: int64 }
        - name: warehouseId
          in: query
          schema: { type: integer, format: int64 }
        - name: batchNo
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [AVAILABLE, RESERVED, FROZEN] }
        - name: ownership
          in: query
          schema: { type: string, enum: [SELF], default: SELF }
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'

  /inventory/alerts:
    get:
      tags: [inv]
      summary: 库存预警（安全库存 / 滞销 / 临期，FR-INV-12）
      description: 临期与滞销边界由服务端注入时钟计算，不接受客户端时间。
      operationId: queryInventoryAlerts
      parameters:
        - name: warehouseId
          in: query
          schema: { type: integer, format: int64 }
        - name: type
          in: query
          schema: { type: string, enum: [SAFETY, SLOW_MOVING, EXPIRING] }
        - name: expiringDays
          in: query
          description: 临期阈值（天），默认 30
          schema: { type: integer, minimum: 0, default: 30 }
        - name: slowMovingDays
          in: query
          description: 滞销阈值（天），默认 90
          schema: { type: integer, minimum: 0, default: 90 }
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'

  /inventory/replenishment:
    get:
      tags: [inv]
      summary: 补货建议（min/max 阈值档，FR-INV-13）
      description: |
        可用量低于 min_level 时建议补到 max_level；
        同仓同 SKU 已有 APPROVED/PARTIAL 未到货进货行时不重复建议。
        纯查询、不落表，重复调用结果一致。
      operationId: queryReplenishment
      parameters:
        - name: warehouseId
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'

  # ─────────────────────────── PUR ───────────────────────────
  /purchase-orders:
    get:
      tags: [pur]
      summary: 查询进货单
      operationId: listPurchaseOrders
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - name: supplierId
          in: query
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          $ref: '#/components/responses/PageResponse'
    post:
      tags: [pur]
      summary: 创建进货单（草稿）
      operationId: createPurchaseOrder
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOrderCreate' }
      responses:
        '201':
          $ref: '#/components/responses/SingleResponse'

  /purchase-orders/{id}:
    get:
      tags: [pur]
      summary: 进货单详情
      operationId: getPurchaseOrder
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /purchase-orders/{id}/receive:
    post:
      tags: [pur]
      summary: 入库确认（生成入库流水、增加库存）
      description: |
        - 支持分批入库；累计入库量不得超过单据数量（BR-DOC-04 → PUR_OVER_RECEIVE）
        - 入库后生成 `inventory_ledger` 正向流水（biz_type=PURCHASE_IN）
      operationId: receivePurchaseOrder
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceiveRequest' }
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /purchase-orders/{id}/void:
    post:
      tags: [pur]
      summary: 作废/红冲进货单
      description: |
        已入库的作废必须先生成反向流水冲减库存（BR-DOC-03）。

        - 未入库（DRAFT/SUBMITTED/APPROVED/REJECTED）：普通作废，状态 → VOIDED，不动库存、不写流水
        - 已入库（PARTIAL/COMPLETED）：**红冲** —— 按原 `PURCHASE_IN` 流水逐批次回退实存，
          逐条写 `PURCHASE_REVERSAL` 负向流水（同批次、数量取反、biz_ref_no 仍是本单号），状态 → VOIDED
        - 回退要求该批次当前实存足够且回退后不低于已预占量；不足（货已卖出/被预占）
          → `INV_NEGATIVE_NOT_ALLOWED`，**不跨批次挪用**，且失败零副作用（状态/库存/流水都不动）
        - 单据业务日期所在账期已月结锁账 → `SET_PERIOD_CLOSED`（同键重放除外）
        - 幂等：同一 `X-Request-Id` 重放返回首次的 VOIDED 结果，不重复回退库存；
          已作废后用**新键**再作废 → `PUR_STATUS_ILLEGAL`
        - 并发异键红冲由「状态 + version 条件 UPDATE」串行化，只有一个成功
      operationId: voidPurchaseOrder
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '409':
          description: 状态非法 / 账期已锁 / 库存不足 / 重复请求
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                alreadyVoided:
                  value:
                    code: PUR_STATUS_ILLEGAL
                    message: "进货单 PO20250601-0001 已作废（首次作废请求与本次不同），不能再次作废"
                periodClosed:
                  value:
                    code: SET_PERIOD_CLOSED
                    message: "账期 2025-06 已月结锁账（业务日期 2025-06-01 落在该期间），不允许再新增或变更该期间的单据"
                    details: { period: '2025-06', bizDate: '2025-06-01' }
                insufficientStock:
                  value:
                    code: INV_NEGATIVE_NOT_ALLOWED
                    message: "进货红冲失败：SKU 1001 在仓库 1 批次 'B1' 当前实存 2、已预占 0，需要回退 4（回退后会为负或低于预占）"
                    details: { skuId: 1001, warehouseId: 1, batchNo: 'B1', onHand: 2, reserved: 0, required: 4 }

  # ─────────────────────────── SAL ───────────────────────────
  /sales-orders:
    get:
      tags: [sal]
      summary: 查询出货单
      description: 明细行返回累计已退数量 `returnedQty`，供退货页计算剩余可退数量。
      operationId: listSalesOrders
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - name: customerId
          in: query
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 出货单分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiPageResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/SalesOrder' }
    post:
      tags: [sal]
      summary: 创建出货单（同时预占库存）
      operationId: createSalesOrder
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalesOrderCreate' }
      responses:
        '201':
          description: 建单成功（返回出货单与明细）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SalesOrder' }
        '409':
          $ref: '#/components/responses/Conflict'

  /sales-orders/{id}/ship:
    post:
      tags: [sal]
      summary: 出货确认（预占转出库、扣减库存）
      description: |
        - 将 reserved_qty 转为实际出库：on_hand_qty 与 reserved_qty 同时减少
        - 按 FEFO 扣减批次（BR-INV-06），单笔可拆多批次 → 产生多条流水
      operationId: shipSalesOrder
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '409':
          description: 库存不足 / 状态非法
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                insufficientStock:
                  value:
                    code: INV_INSUFFICIENT_STOCK
                    message: "库存不足：SKU 1001 在 上海仓 可用量 3，需求 5"
                    details: { skuId: 1001, warehouseId: 1, available: 3, required: 5 }

  /sales-orders/{id}/void:
    post:
      tags: [sal]
      summary: 作废/红冲出货单（回补库存）
      description: |
        - 未出货（DRAFT/SUBMITTED/APPROVED/REJECTED）：普通作废，释放本单预占，状态 → VOIDED，不动实存
        - 已出货（PARTIAL/COMPLETED）：**红冲** —— 按原 `SALES_OUT` 流水逐批次回补实存，
          逐条写 `SALES_REVERSAL` 正向流水（同批次、数量取反、biz_ref_no 仍是本单号）；
          `PARTIAL` 上仍未出货的 ACTIVE 预占一并释放，避免库存被永久锁死
        - 任一明细已有退货数量 → `SAL_STATUS_ILLEGAL`（退货已通过 RETURN_IN 回补过库存，
          再全额红冲会重复入库）；红冲后原单上待入库的退货单再入库 → `RMA_ORIGIN_NOT_SHIPPED`
        - 单据业务日期所在账期已月结锁账 → `SET_PERIOD_CLOSED`（同键重放除外）
        - 幂等：同一 `X-Request-Id` 重放返回首次的 VOIDED 结果，不重复回补库存；
          已作废后用**新键**再作废 → `SAL_STATUS_ILLEGAL`
        - 并发异键红冲由「状态 + version 条件 UPDATE」串行化，只有一个成功
      operationId: voidSalesOrder
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/SingleResponse'
        '409':
          description: 状态非法 / 有退货不可红冲 / 账期已锁
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                alreadyVoided:
                  value:
                    code: SAL_STATUS_ILLEGAL
                    message: "出货单 SO20250601-0001 已作废（首次作废请求与本次不同），不能再次作废"
                hasReturns:
                  value:
                    code: SAL_STATUS_ILLEGAL
                    message: "出货单 SO20250601-0001 已退货 2 件，不能红冲（退货已回补库存，再红冲会重复入库）"
                periodClosed:
                  value:
                    code: SET_PERIOD_CLOSED
                    message: "账期 2025-06 已月结锁账（业务日期 2025-06-01 落在该期间），不允许再新增或变更该期间的单据"
                    details: { period: '2025-06', bizDate: '2025-06-01' }

  # ─────────────────────────── RMA ───────────────────────────
  /return-orders:
    get:
      tags: [rma]
      summary: 查询退货单（rma:read）
      operationId: listReturnOrders
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - name: customerId
          in: query
          schema: { type: integer, format: int64 }
        - name: originSalesOrderId
          in: query
          description: 按原出货单筛选
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 退货单分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiPageResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ReturnOrder' }
    post:
      tags: [rma]
      summary: 创建退货单（rma:create）
      description: |
        - 原出货单必须已出货（PARTIAL / COMPLETED），否则返回 `RMA_ORIGIN_NOT_SHIPPED`
        - 只接收原明细行与退货数量；单价、折扣、客户、仓库全部从原出货单派生
        - 累计退货数量不得超过已出货数量（`RMA_QTY_EXCEED_ORIGIN`）
        - 建单不改变库存；相同 `X-Request-Id` 重复提交返回首次结果
      operationId: createReturnOrder
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnOrderCreate' }
      responses:
        '201':
          $ref: '#/components/responses/ReturnOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # 退货建单页的"选原出货单"数据源。刻意挂在 /return-orders 下、由 RMA 提供：
  # 只有 rma:* 的销售员没有 sal:read，跨模块调 /sales-orders 会 403（计划书 §6 坑 13）。
  /return-orders/returnable-orders:
    get:
      tags: [rma]
      summary: 查询可退货的出货单（rma:read）
      description: |
        - 只返回 `status IN (PARTIAL, COMPLETED)` **且至少还有一行 `shippedQty − returnedQty > 0`** 的出货单；
        - 已全部退完的单据不出现（列出来也建不了单）；未出货的 DRAFT / SUBMITTED / APPROVED 同样不出现；
        - 可退口径由出货域单一定义，本接口只转发，不再算一份"看起来一样"的可退数量；
        - 分页走通用口径：`total` = 满足条件的出货单**张数**，`size` 上限 200。
          调用方必须翻页或用 `total > items.length` 判断"可能没列全"，禁止把 200 上限当全量（§6 坑 14）。
      operationId: listReturnableOrders
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 可退货出货单分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiPageResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ReturnableOrder' }

  /return-orders/{id}:
    get:
      tags: [rma]
      summary: 退货单详情（rma:read）
      operationId: getReturnOrder
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/ReturnOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /return-orders/{id}/submit:
    post:
      tags: [rma]
      summary: 提交退货单（rma:submit）
      description: 状态流转 DRAFT → SUBMITTED。
      operationId: submitReturnOrder
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/ReturnOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /return-orders/{id}/approve:
    post:
      tags: [rma]
      summary: 审核退货单（rma:approve）
      description: 状态流转 SUBMITTED → APPROVED；审核不改变库存。
      operationId: approveReturnOrder
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/ReturnOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /return-orders/{id}/reject:
    post:
      tags: [rma]
      summary: 驳回退货单（rma:reject）
      description: 状态流转 SUBMITTED → REJECTED；驳回不改变库存。
      operationId: rejectReturnOrder
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/ReturnOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /return-orders/{id}/receive:
    post:
      tags: [rma]
      summary: 退货入库（rma:receive）
      description: |
        - **整单一次性回补库存**，不接收分批入库参数（无请求体）
        - 只通过库存模块生成 `RETURN_IN` 正向流水，并原子累加原出货行的累计退货量
        - 状态流转 APPROVED → COMPLETED
        - 相同 `X-Request-Id` 重复调用不重复加库存；已完成后换新 requestId 再入库返回 `RMA_STATUS_ILLEGAL`
        - ★ 入库前会先锁定原出货单：原单已被红冲为 `VOIDED` 时返回 `RMA_ORIGIN_NOT_SHIPPED`
          （否则会先把货退回来、红冲再回补一次，同一批货入库两遍）
      operationId: receiveReturnOrder
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/ReturnOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /return-orders/{id}/void:
    post:
      tags: [rma]
      summary: 作废退货单（rma:void）
      description: 仅入库前可作废（DRAFT / SUBMITTED / APPROVED → VOIDED）；已完成需红冲，M2 不支持，M2.5 的红冲范围只有进货单与出货单（FR-PUR-03 / FR-SAL-04），退货单红冲仍未提供。
      operationId: voidReturnOrder
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/ReturnOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ─────────────────────────── SET ───────────────────────────
  /settlements/daily:
    post:
      tags: [set]
      summary: 日清（每日汇总当日出入库与金额）
      description: |
        - **幂等**：同一账期重复执行结果完全一致（BR-SET-01）
        - 业务日期由 `bizDate` 指定，**不依赖系统当前时间**（可测性设计，见 docs/06）
      operationId: runDailySettlement
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DailySettlementRequest' }
      responses:
        '200':
          description: 日清结果（按仓库 items + 全部仓库 totals）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DailySettlementResult' }
        '409':
          $ref: '#/components/responses/Conflict'

  /settlements/monthly:
    post:
      tags: [set]
      summary: 月结（期间结账并锁账）
      description: 锁账后该期间单据不可新增/修改（BR-SET-02 → SET_PERIOD_CLOSED）。
      operationId: runMonthlySettlement
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MonthlySettlementRequest' }
      responses:
        '200':
          description: 月结结果（期间汇总 + 关闭时间）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MonthlySettlementResult' }
        '409':
          $ref: '#/components/responses/Conflict'

  /settlements/reconcile:
    get:
      tags: [set]
      summary: 总账与明细对账（差额必须为 0）
      description: 差额非 0 返回 `SET_RECONCILE_MISMATCH`，对应不变量 INV-5。
      operationId: reconcile
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: 对账结果（差额必须为 0）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReconcileResult' }
        '409':
          description: 账期未结算 / 对账不平
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                periodNotClosed:
                  value:
                    code: SET_PERIOD_NOT_CLOSED
                    message: "账期 2025-06 尚未月结，无法对账"
                    details: { period: '2025-06' }
                mismatch:
                  value:
                    code: SET_RECONCILE_MISMATCH
                    message: "对账不平：账期 2025-06 总账 100000 分，明细合计 99990 分，差额 10 分"
                    details: { period: '2025-06', generalTotal: 100000, detailTotal: 99990, diff: 10 }

  /settlements/periods:
    get:
      tags: [set]
      summary: 账期列表查询（set:read，只读）
      description: |
        - **存在的理由**（计划书 §6 坑 15）：日清 / 月结是 POST、对账要 `set:reconcile`，
          所以只有 `set:read` 的账号（VIEWER / FINANCE）进得了结算页却拿不到任何数据，
          月结结果（`status` / `closedAt`）刷新即失。本接口是 `set:read` 唯一可消费的读出口。
        - **只读**：直接返回 `settlement_periods` 已落的行，不重算、不写任何表；
          与对账（`GET /settlements/reconcile`）分工不同 —— 这里回答"每个账期结没结、结出来多少"，
          对账回答"总账与明细平不平"（后者是财务动作，仍要 `set:reconcile`）。
        - 分页走通用口径：`total` = 满足条件的**账期行数**，`size` 上限 200；按 `period` 倒序（最新期间在前）。
        - `closedAt` / `closedBy` 在 `OPEN` 行上是 `null`；账期行不存在时**不补 0 值行**
          （"没结过账"和"结了账但是 0 元"是两件事，见 §3.4 对账同理）。
      operationId: listSettlementPeriods
      parameters:
        - name: status
          in: query
          required: false
          description: 省略 = 全部账期；`CLOSED` 即已锁账（写操作会被 PeriodGuard 拒绝）
          schema: { type: string, enum: [OPEN, CLOSED] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 账期分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiPageResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/SettlementPeriodRow' }
        '400':
          description: status 取值非法（不是 OPEN / CLOSED）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  # ─────────────────────────── RPT ───────────────────────────
  /reports/purchase:
    get:
      tags: [rpt]
      summary: 进货统计（按供应商/商品/期间）
      operationId: purchaseReport
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: groupBy
          in: query
          schema: { type: string, enum: [supplier, product, sku, day, month], default: supplier }
        - name: warehouseId
          in: query
          description: 可选仓库过滤；省略=全部仓库。口径按单据 biz_date（闭区间）
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 进货统计行（data.items）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ReportRow' }

  /reports/sales:
    get:
      tags: [rpt]
      summary: 出货统计（按客户/商品/期间）
      operationId: salesReport
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: groupBy
          in: query
          schema: { type: string, enum: [customer, product, sku, day, month], default: customer }
        - name: warehouseId
          in: query
          description: 可选仓库过滤；省略=全部仓库。口径按单据 biz_date（闭区间），不含退货
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 出货统计行（data.items）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ReportRow' }

  /reports/inventory-summary:
    get:
      tags: [rpt]
      summary: 进销存汇总表（期初 + 入 − 出 = 期末）
      description: 恒等式必须成立，对应不变量 INV-6。
      operationId: inventorySummaryReport
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
        - name: warehouseId
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 进销存汇总行（data.items）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/InventorySummaryRow' }

  # ─────────────────────────── NL ───────────────────────────
  /nl/command:
    post:
      tags: [nl]
      summary: 自然语言操作入口（FR-SYS-04）
      description: |
        - **只做解析与调度**：把一句自然语言解析成意图（intent）与参数，再调用既有
          ApplicationService 执行业务；NL 层不复制任何业务规则（库存/状态机/锁账/幂等均由既有服务判定）。
        - **解析器可注入**：`erp.nl.parser=stub`（默认，确定性、离线、测试与 CI 不依赖 LLM）
          或 `openai`（OpenAI 兼容端点 + function calling，key 只从环境变量 `ERP_NL_API_KEY` 读取）。
        - **幂等**：POST 统一要求 `X-Request-Id`。读意图也会校验该头（保持一条规则）；
          写意图（建进货/出货草稿）把同一个键交给既有建单服务作为幂等键，重放不产生第二张单。
        - **权限**：按意图映射既有权限码（`inv:read` / `pur:read` / `sal:read` / `rma:read` /
          `rpt:read` / `mdm:read` / `pur:create` / `sal:create`），不新增权限种子，也不绕过 IAM。
        - **不做**：多轮对话、自动审核/入库/出货/作废等不可逆动作；写意图只到「建草稿」。
      operationId: nlCommand
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NlCommandRequest' }
      responses:
        '200':
          description: 指令已执行（读或写）；data 为调度结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/NlCommandResult' }
        '400':
          description: 指令为空（SYS_VALIDATION_ERROR）或意图参数缺失/非法（NL_COMMAND_INVALID_ARGUMENT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                invalidArgument:
                  value:
                    code: NL_COMMAND_INVALID_ARGUMENT
                    message: "创建进货单缺少参数：supplierId（供应商 id）"
        '401':
          description: 未登录或 token 失效（IAM_UNAUTHENTICATED）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403':
          description: 当前账号缺少该意图所需的业务权限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                forbidden:
                  value:
                    code: IAM_FORBIDDEN
                    message: "自然语言指令被拒绝：需要权限 inv:read，当前角色 [FINANCE]"
        '422':
          description: 无法把文本映射为已支持的意图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                unrecognized:
                  value:
                    code: NL_COMMAND_UNRECOGNIZED
                    message: "无法识别指令：今天天气怎么样。支持的意图：help / query_inventory / list_documents / get_document / inventory_summary / query_master_data / create_purchase_order / create_sales_order"
        '503':
          description: 配置为真实 LLM 但解析器不可用（key 缺失 / 网络 / 上游异常）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                parserUnavailable:
                  value:
                    code: NL_PARSER_UNAVAILABLE
                    message: "自然语言解析器不可用：未配置 ERP_NL_API_KEY（erp.nl.parser=openai）"

components:
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: true
      description: 幂等键。相同值重复提交只生效一次（不变量 INV-9）。
      schema: { type: string, minLength: 8, maxLength: 64 }
      example: req-20250601-0001
    PathId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
    StatusFilter:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/DocumentStatus' }

  responses:
    SingleResponse:
      description: 单对象响应
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    ListResponse:
      description: 列表响应
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    PageResponse:
      description: 分页响应
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiPageResponse' }
    Conflict:
      description: 业务冲突（库存不足 / 状态非法 / 重复编码 / 期间已锁账）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ReturnOrderResponse:
      description: 退货单响应
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/ReturnOrder' }

  schemas:
    ApiResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: OK }
        message: { type: string, example: success }
        data: { }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }

    ApiPageResponse:
      type: object
      required: [code, data]
      properties:
        code: { type: string, example: OK }
        message: { type: string }
        data:
          type: object
          required: [items, total, page, size]
          properties:
            items: { type: array, items: { } }
            total: { type: integer, format: int64, minimum: 0 }
            page: { type: integer, minimum: 1 }
            size: { type: integer, minimum: 1 }
        traceId: { type: string }

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 业务错误码，见 docs/05 错误码表
          example: INV_INSUFFICIENT_STOCK
        message:
          type: string
          description: 人类可读消息，**必须包含定位信息**（哪个 SKU / 哪个仓 / 差多少）
        details:
          type: object
          additionalProperties: true
        traceId:
          type: string
          description: 贯穿日志，测试失败时用它捞日志
        timestamp: { type: string, format: date-time }

    DocumentStatus:
      type: string
      description: 单据统一状态机（BR-DOC-01，非法转移必须拒绝）
      enum: [DRAFT, SUBMITTED, APPROVED, PARTIAL, COMPLETED, VOIDED, REJECTED]

    Warehouse:
      type: object
      required: [id, code, name, enabled]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: SH01 }
        name: { type: string, example: 上海仓 }
        address: { type: string, nullable: true }
        enabled: { type: boolean, example: true }

    WarehouseCreate:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 2, maxLength: 32, example: SH01 }
        name: { type: string, minLength: 1, maxLength: 64, example: 上海仓 }
        address: { type: string, maxLength: 200 }
        enabled: { type: boolean, default: true }

    WarehouseUpdate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        address: { type: string, maxLength: 200 }
        enabled: { type: boolean, default: true, description: 省略时后端按 true 处理 }

    Supplier:
      type: object
      required: [id, code, name, enabled]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: SUP-001 }
        name: { type: string, example: 杭州面料供应商 }
        contactName: { type: string, nullable: true }
        contactPhone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        enabled: { type: boolean, example: true }

    SupplierCreate:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 2, maxLength: 32, example: SUP-001 }
        name: { type: string, minLength: 1, maxLength: 128, example: 杭州面料供应商 }
        contactName: { type: string, maxLength: 64 }
        contactPhone: { type: string, maxLength: 32 }
        address: { type: string, maxLength: 200 }
        enabled: { type: boolean, default: true }

    SupplierUpdate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        contactName: { type: string, maxLength: 64 }
        contactPhone: { type: string, maxLength: 32 }
        address: { type: string, maxLength: 200 }
        enabled: { type: boolean, default: true, description: 省略时后端按 true 处理 }

    Customer:
      type: object
      required: [id, code, name, discountRate, level, enabled]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: CUS-001 }
        name: { type: string, example: 零售散客 }
        phone: { type: string, nullable: true }
        discountRate:
          type: integer
          minimum: 1
          maximum: 10000
          description: 整数万分比：9000 = 9 折，10000 = 不打折；0 等于白送，必须拒绝
          example: 9000
        level: { type: string, maxLength: 16, example: VIP }
        enabled: { type: boolean, example: true }

    CustomerCreate:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 2, maxLength: 32, example: CUS-001 }
        name: { type: string, minLength: 1, maxLength: 128, example: 零售散客 }
        phone: { type: string, maxLength: 32 }
        discountRate:
          type: integer
          minimum: 1
          maximum: 10000
          default: 10000
          description: 整数万分比，禁止浮点（ADR-0005）
        level: { type: string, maxLength: 16, default: NORMAL }
        enabled: { type: boolean, default: true }

    CustomerUpdate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        phone: { type: string, maxLength: 32 }
        discountRate:
          type: integer
          minimum: 1
          maximum: 10000
          description: 省略时保留原折扣率
        level: { type: string, maxLength: 16 }
        enabled: { type: boolean, default: true, description: 省略时后端按 true 处理 }

    ProductCreate:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 2, maxLength: 32 }
        name: { type: string, minLength: 1, maxLength: 128, example: 圆领T恤 }
        category: { type: string, maxLength: 64 }
        season: { type: string, maxLength: 32, description: 季节维度，并入时间维度便于效期/批次测试 }
        enabled: { type: boolean, default: true }

    SkuCreate:
      type: object
      required: [productId, color, size]
      properties:
        productId: { type: integer, format: int64 }
        color: { type: string, minLength: 1, maxLength: 32, example: 白色 }
        size: { type: string, minLength: 1, maxLength: 16, example: L }
        barcode: { type: string, maxLength: 64 }
        retailPriceAmount:
          type: integer
          format: int64
          minimum: 0
          description: 零售价（**整数分**，见 ADR-0005）

    ReserveRequest:
      type: object
      required: [skuId, warehouseId, qty]
      properties:
        skuId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        batchNo: { type: string, default: '' }
        qty:
          type: integer
          minimum: 1
          description: 预占数量，必须为正

    ReserveResult:
      type: object
      properties:
        reservationId: { type: integer, format: int64 }
        skuId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        batchNo: { type: string }
        reservedQty: { type: integer, description: 本次预占数量 }
        onHandQty: { type: integer, description: 预占后实存 }
        availableQty: { type: integer, description: 预占后可用量 }
        duplicate: { type: boolean, description: true 表示幂等命中，未产生新变动 }

    InventoryTransferCreate:
      type: object
      required: [fromWarehouseId, toWarehouseId, lines]
      properties:
        fromWarehouseId: { type: integer, format: int64 }
        toWarehouseId: { type: integer, format: int64, description: 必须与调出仓不同 }
        bizDate: { type: string, format: date, description: 省略时取服务端业务日期（ClockProvider） }
        remark: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [skuId, qty]
            properties:
              skuId: { type: integer, format: int64 }
              batchNo: { type: string, maxLength: 64, default: '' }
              qty: { type: integer, minimum: 1 }
              unitCostAmount: { type: integer, format: int64, minimum: 0 }

    InventoryTransfer:
      type: object
      required: [id, transferNo, fromWarehouseId, toWarehouseId, status, lines]
      properties:
        id: { type: integer, format: int64 }
        transferNo: { type: string, example: TO20261024-0001 }
        fromWarehouseId: { type: integer, format: int64 }
        toWarehouseId: { type: integer, format: int64 }
        status: { type: string, enum: [IN_TRANSIT, COMPLETED] }
        bizDate: { type: string, format: date }
        remark: { type: string, nullable: true }
        inTransitQty: { type: integer, description: 仍在途的数量（INV-7 的在途项） }
        receivedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: '#/components/schemas/TransferLine' }
        duplicate: { type: boolean }

    TransferLine:
      type: object
      properties:
        lineNo: { type: integer }
        skuId: { type: integer, format: int64 }
        batchNo: { type: string }
        qty: { type: integer }
        inTransitQty: { type: integer }
        productionDate: { type: string, format: date, nullable: true }
        expiryDate: { type: string, format: date, nullable: true }
        unitCostAmount: { type: integer, format: int64, nullable: true }

    StocktakeCreate:
      type: object
      required: [warehouseId, lines]
      properties:
        warehouseId: { type: integer, format: int64 }
        bizDate: { type: string, format: date }
        remark: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [skuId, countedQty]
            properties:
              skuId: { type: integer, format: int64 }
              batchNo: { type: string, maxLength: 64, default: '' }
              countedQty: { type: integer, minimum: 0 }

    Stocktake:
      type: object
      required: [id, stocktakeNo, warehouseId, status, lines]
      properties:
        id: { type: integer, format: int64 }
        stocktakeNo: { type: string, example: ST20261024-0001 }
        warehouseId: { type: integer, format: int64 }
        status: { type: string, enum: [DRAFT, POSTED] }
        bizDate: { type: string, format: date }
        remark: { type: string, nullable: true }
        totalDiffQty: { type: integer, description: 各明细 diff 之和 }
        postedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: '#/components/schemas/StocktakeLine' }
        duplicate: { type: boolean }

    StocktakeLine:
      type: object
      properties:
        lineNo: { type: integer }
        skuId: { type: integer, format: int64 }
        batchNo: { type: string }
        bookQty: { type: integer, description: 建单时快照的账面量 }
        countedQty: { type: integer }
        diffQty: { type: integer, description: counted - book；0 不产生调整流水 }

    InventoryAdjustmentCreate:
      type: object
      required: [skuId, warehouseId, changeQty, reason]
      properties:
        skuId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        batchNo: { type: string, maxLength: 64, default: '' }
        changeQty:
          type: integer
          description: 有符号数量：正=调增（ADJUST_IN），负=调减（ADJUST_OUT），不得为 0
        reason: { type: string, minLength: 1, maxLength: 200, description: 必填，审计依据 }
        unitCostAmount: { type: integer, format: int64, minimum: 0, nullable: true }

    InventoryAdjustment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        adjustNo: { type: string, example: AJ20261024-0001 }
        skuId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        batchNo: { type: string }
        changeQty: { type: integer }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
        duplicate: { type: boolean }

    InventoryFreezeCreate:
      type: object
      required: [skuId, warehouseId, qty]
      properties:
        skuId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        batchNo: { type: string, maxLength: 64, default: '' }
        qty: { type: integer, minimum: 1 }
        reason: { type: string, maxLength: 200 }
        expiresAt:
          type: string
          format: date-time
          description: 可选；到期由服务端时钟判断并自动解冻

    InventoryFreeze:
      type: object
      properties:
        id: { type: integer, format: int64 }
        skuId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        batchNo: { type: string }
        qty: { type: integer }
        reason: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, RELEASED, EXPIRED] }
        expiresAt: { type: string, format: date-time, nullable: true }
        releasedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        duplicate: { type: boolean }

    BalanceDimensionRow:
      type: object
      properties:
        warehouseId: { type: integer, format: int64 }
        skuId: { type: integer, format: int64 }
        batchNo: { type: string }
        stockStatus: { type: string, enum: [AVAILABLE, RESERVED, FROZEN] }
        ownership: { type: string, enum: [SELF] }
        qty: { type: integer }

    InventoryAlert:
      type: object
      properties:
        type: { type: string, enum: [SAFETY, SLOW_MOVING, EXPIRING] }
        skuId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        batchNo: { type: string, nullable: true }
        onHandQty: { type: integer }
        availableQty: { type: integer }
        threshold: { type: integer, description: 安全库存下限 / 滞销天数 / 临期天数 }
        expiryDate: { type: string, format: date, nullable: true }
        lastMovementAt: { type: string, format: date-time, nullable: true }
        warehousePriority: { type: integer }

    ReplenishmentSuggestion:
      type: object
      properties:
        skuId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        availableQty: { type: integer }
        minLevel: { type: integer }
        maxLevel: { type: integer }
        suggestedQty: { type: integer, description: maxLevel - availableQty }
        warehousePriority: { type: integer }

    ReceiveRequest:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [lineId, qty]
            properties:
              lineId: { type: integer, format: int64 }
              qty: { type: integer, minimum: 1 }
              batchNo: { type: string, maxLength: 64 }
              productionDate: { type: string, format: date }
              expiryDate: { type: string, format: date, description: FEFO 依据 }

    PurchaseOrderCreate:
      type: object
      required: [supplierId, warehouseId, bizDate, lines]
      properties:
        supplierId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        bizDate: { type: string, format: date, description: 业务日期（可指定，不依赖系统时间） }
        remark: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [skuId, qty, unitPriceAmount]
            properties:
              skuId: { type: integer, format: int64 }
              qty: { type: integer, minimum: 1 }
              unitPriceAmount: { type: integer, format: int64, minimum: 0, description: 单价（分） }

    SalesOrderCreate:
      type: object
      required: [customerId, warehouseId, bizDate, lines]
      properties:
        customerId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        bizDate: { type: string, format: date }
        remark: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [skuId, qty, unitPriceAmount]
            properties:
              skuId: { type: integer, format: int64 }
              qty: { type: integer, minimum: 1 }
              unitPriceAmount: { type: integer, format: int64, minimum: 0 }
              discountRate:
                type: integer
                minimum: 0
                maximum: 10000
                default: 10000
                description: 折扣率，**整数万分比**（9000 = 9 折），禁止浮点（ADR-0005）

    SalesOrder:
      type: object
      required: [id, orderNo, status, customerId, warehouseId, totalAmount, totalQty, lines]
      properties:
        id: { type: integer, format: int64 }
        orderNo: { type: string, example: SO20261022-0001 }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        customerId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        bizDate: { type: string, format: date }
        totalAmount: { type: integer, format: int64, description: 单据总金额（分） }
        totalQty: { type: integer }
        period: { type: string, nullable: true, description: 账期 yyyy-MM }
        remark: { type: string, nullable: true }
        lines:
          type: array
          items: { $ref: '#/components/schemas/SalesOrderLine' }

    SalesOrderLine:
      type: object
      required: [id, lineNo, skuId, qty, shippedQty, returnedQty, openQty,
                 unitPriceAmount, discountRate, amount]
      properties:
        id: { type: integer, format: int64 }
        lineNo: { type: integer, minimum: 1 }
        skuId: { type: integer, format: int64 }
        qty: { type: integer, minimum: 1 }
        shippedQty: { type: integer, minimum: 0, description: 累计已出库数量 }
        returnedQty:
          type: integer
          minimum: 0
          description: 累计已退货数量；退货入库时原子累加，剩余可退 = shippedQty − returnedQty
        openQty: { type: integer, description: '= qty − shippedQty' }
        unitPriceAmount: { type: integer, format: int64, minimum: 0, description: 单价（分） }
        discountRate: { type: integer, minimum: 1, maximum: 10000, description: 整数万分比 }
        amount: { type: integer, format: int64, minimum: 0, description: 行金额（分） }
        reservationIds:
          type: array
          description: 本行对应的预占分段 id（FEFO 拆批次时可能有多段）
          items: { type: integer, format: int64 }

    ReturnOrderCreate:
      type: object
      required: [originSalesOrderId, lines]
      properties:
        originSalesOrderId: { type: integer, format: int64, description: 原出货单 id }
        bizDate:
          type: string
          format: date
          description: 业务日期；省略时由服务端 ClockProvider 取当天
        remark: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          description: 同一原出货单明细行在一张退货单内只能出现一次
          items:
            type: object
            required: [originLineId, qty]
            properties:
              originLineId: { type: integer, format: int64, description: 原出货单明细行 id }
              qty: { type: integer, minimum: 1, description: 本次退货数量 }
              batchNo: { type: string, maxLength: 64, default: '', description: 退货入库批次 }
              productionDate: { type: string, format: date, nullable: true }
              expiryDate: { type: string, format: date, nullable: true, description: 退货入库批次的效期 }

    ReturnOrderLine:
      type: object
      required: [id, lineNo, originLineId, skuId, qty, unitPriceAmount, discountRate, amount]
      properties:
        id: { type: integer, format: int64 }
        lineNo: { type: integer, minimum: 1 }
        originLineId: { type: integer, format: int64 }
        skuId: { type: integer, format: int64 }
        qty: { type: integer, minimum: 1 }
        unitPriceAmount: { type: integer, format: int64, minimum: 0, description: 从原出货行派生（分） }
        discountRate: { type: integer, minimum: 1, maximum: 10000, description: 从原出货行派生 }
        amount: { type: integer, format: int64, minimum: 0, description: 行退货金额（分） }
        batchNo: { type: string, description: 退货入库批次，默认空批次 }
        productionDate: { type: string, format: date, nullable: true }
        expiryDate: { type: string, format: date, nullable: true }

    ReturnOrder:
      type: object
      required: [id, orderNo, status, originSalesOrderId, customerId, warehouseId,
                 bizDate, totalAmount, totalQty, lines]
      properties:
        id: { type: integer, format: int64 }
        orderNo: { type: string, example: RO20261022-0001 }
        status:
          type: string
          description: 退货单只使用 DRAFT / SUBMITTED / APPROVED / COMPLETED / VOIDED / REJECTED，不使用 PARTIAL
          enum: [DRAFT, SUBMITTED, APPROVED, COMPLETED, VOIDED, REJECTED]
        originSalesOrderId: { type: integer, format: int64 }
        customerId: { type: integer, format: int64, description: 从原出货单派生 }
        warehouseId: { type: integer, format: int64, description: 从原出货单派生 }
        bizDate: { type: string, format: date }
        totalAmount: { type: integer, format: int64, description: 退货总金额（分） }
        totalQty: { type: integer }
        period: { type: string, nullable: true, description: 账期 yyyy-MM }
        remark: { type: string, nullable: true }
        lines:
          type: array
          items: { $ref: '#/components/schemas/ReturnOrderLine' }

    ReturnableOrderLine:
      type: object
      description: |
        可退出货明细 —— 退货建单的行来源。
        单价与折扣原样带出只为**只读展示**：建单请求体里不接受它们（一律从原行派生，防止改写金额）。
      required: [originLineId, lineNo, skuId, skuName, shippedQty, returnedQty, returnableQty,
                 unitPriceAmount, discountRate]
      properties:
        originLineId: { type: integer, format: int64, description: 原出货单明细行 id，建单请求的 lines 元素引用它 }
        lineNo: { type: integer, minimum: 1, description: 原单行号，用于与超退错误消息里的"第 N 行"对上 }
        skuId: { type: integer, format: int64 }
        skuName: { type: string, description: 展示名：商品名 · 颜色-尺码（服务端批量取名，前端不必再依赖主数据字典） }
        shippedQty: { type: integer, minimum: 1, description: 累计已出货数量 }
        returnedQty: { type: integer, minimum: 0, description: 累计已退货数量 }
        returnableQty:
          type: integer
          minimum: 1
          description: 剩余可退 = shippedQty − returnedQty；建单超过它会得到 RMA_QTY_EXCEED_ORIGIN
        unitPriceAmount: { type: integer, format: int64, minimum: 0, description: 原行单价（分） }
        discountRate: { type: integer, minimum: 1, maximum: 10000, description: 原行折扣（整数万分比） }

    ReturnableOrder:
      type: object
      description: 一张还有可退数量的出货单，连同它的可退明细
      required: [orderId, orderNo, status, customerId, customerName, warehouseId, bizDate, lines]
      properties:
        orderId: { type: integer, format: int64, description: 建单请求的 originSalesOrderId }
        orderNo: { type: string, example: SO20261022-0001 }
        status:
          type: string
          description: 可退来源只会是这两种"已出货"状态之一
          enum: [PARTIAL, COMPLETED]
        customerId: { type: integer, format: int64, description: 退货单继承它，不接受前端传入 }
        customerName: { type: string }
        warehouseId:
          type: integer
          format: int64
          description: 回补仓库 = 原出货仓库，退货单不可改
        bizDate: { type: string, format: date }
        lines:
          type: array
          minItems: 1
          description: 只包含可退的行；整行退完的行不出现
          items: { $ref: '#/components/schemas/ReturnableOrderLine' }

    DailySettlementRequest:
      type: object
      required: [bizDate]
      properties:
        bizDate: { type: string, format: date }
        warehouseId: { type: integer, format: int64, description: 省略表示全部仓库 }

    MonthlySettlementRequest:
      type: object
      required: [period]
      properties:
        period: { type: string, pattern: '^\d{4}-\d{2}$', example: '2025-06' }

    SettlementTotals:
      type: object
      required: [purchaseQty, purchaseAmount, salesQty, salesAmount,
                 returnQty, returnAmount, netAmount]
      properties:
        purchaseQty: { type: integer, format: int64, description: 采购入库数量 }
        purchaseAmount: { type: integer, format: int64, description: 采购入库金额（分） }
        salesQty: { type: integer, format: int64, description: 销售出库数量 }
        salesAmount: { type: integer, format: int64, description: 销售出库金额（分） }
        returnQty: { type: integer, format: int64, description: 退货入库数量 }
        returnAmount: { type: integer, format: int64, description: 退货入库金额（分） }
        netAmount: { type: integer, format: int64, description: '= salesAmount − returnAmount（分）' }

    DailySettlementResult:
      type: object
      required: [bizDate, items, totals]
      properties:
        bizDate: { type: string, format: date }
        items:
          type: array
          description: 按仓库的日清结果；省略 warehouseId 时为全部仓库
          items:
            allOf:
              - $ref: '#/components/schemas/SettlementTotals'
              - type: object
                required: [warehouseId]
                properties:
                  warehouseId: { type: integer, format: int64 }
        totals: { $ref: '#/components/schemas/SettlementTotals' }

    MonthlySettlementResult:
      allOf:
        - $ref: '#/components/schemas/SettlementTotals'
        - type: object
          required: [period, status, duplicate]
          properties:
            period: { type: string, pattern: '^\d{4}-\d{2}$', example: '2025-06' }
            status: { type: string, enum: [OPEN, CLOSED] }
            closedAt: { type: string, format: date-time, nullable: true, description: 锁账时间（ClockProvider） }
            duplicate: { type: boolean, description: true 表示幂等命中，未重复结算 }

    ReconcileResult:
      type: object
      required: [period, generalTotal, detailTotal, diff, balanced]
      properties:
        period: { type: string, pattern: '^\d{4}-\d{2}$' }
        generalTotal: { type: integer, format: int64, description: 总账（期间汇总）金额（分） }
        detailTotal: { type: integer, format: int64, description: 明细实时重算金额（分） }
        diff: { type: integer, format: int64, description: '= generalTotal − detailTotal，必须为 0' }
        balanced: { type: boolean }

    SettlementPeriodRow:
      allOf:
        - $ref: '#/components/schemas/SettlementTotals'
        - type: object
          required: [period, status]
          description: 一行账期（`settlement_periods`）：锁账状态 + 已落的期间汇总，全部字段只读
          properties:
            period: { type: string, pattern: '^\d{4}-\d{2}$', example: '2025-06' }
            status: { type: string, enum: [OPEN, CLOSED], description: CLOSED = 已月结锁账（不可逆） }
            closedAt: { type: string, format: date-time, nullable: true, description: 锁账时间；OPEN 时为 null }
            closedBy: { type: integer, format: int64, nullable: true, description: 锁账操作人 app_users.id；历史行为 null（月结路径尚未写入该列，属 M3 体验债） }

    InventoryBalance:
      type: object
      properties:
        skuId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        batchNo: { type: string }
        expiryDate: { type: string, format: date }
        onHandQty: { type: integer, minimum: 0, description: 实存量（不变量 INV-1） }
        reservedQty: { type: integer, minimum: 0, description: 预占量 }
        availableQty: { type: integer, description: '= onHandQty − reservedQty（不变量 INV-3）' }

    InventoryLedgerEntry:
      type: object
      description: 不可变流水，追溯的唯一依据（ADR-0007）
      properties:
        id: { type: integer, format: int64 }
        skuId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        batchNo: { type: string }
        changeQty: { type: integer, description: 正=入库，负=出库，不允许为 0 }
        bizType:
          type: string
          description: 仅记录实存（onHand）变动；预占/释放不改变实存故不产生流水（不变量 INV-2 的前提）
          enum: [PURCHASE_IN, SALES_OUT, RETURN_IN, TRANSFER_IN, TRANSFER_OUT, ADJUST_IN, ADJUST_OUT]
        bizRefNo: { type: string, description: 来源单据号，可反查 }
        unitCostAmount: { type: integer, format: int64, description: 单位成本（分） }
        occurredAt: { type: string, format: date-time, description: 业务时间（由 ClockProvider 注入） }

    ReportRow:
      type: object
      required: [key, label, qty, amount, orderCount]
      properties:
        key:
          type: string
          description: 分组键（供应商/客户/商品/SKU 编码，或日期、账期）
        label: { type: string, description: 展示名称 }
        qty: { type: integer, format: int64, description: 期间内数量 }
        amount: { type: integer, format: int64, description: 期间内金额（分） }
        orderCount: { type: integer, format: int64, description: 涉及单据数 }

    InventorySummaryRow:
      type: object
      description: 进销存汇总行，恒等式 openingQty + inboundQty − outboundQty = closingQty
      required: [skuId, warehouseId, openingQty, inboundQty, outboundQty, closingQty]
      properties:
        skuId: { type: integer, format: int64 }
        warehouseId: { type: integer, format: int64 }
        openingQty: { type: integer, format: int64, description: 期初数量 }
        inboundQty: { type: integer, format: int64, description: 本期入库数量 }
        outboundQty: { type: integer, format: int64, description: 本期出库数量 }
        closingQty: { type: integer, format: int64, description: 期末数量 }

    NlCommandRequest:
      type: object
      required: [command]
      properties:
        command:
          type: string
          minLength: 1
          maxLength: 500
          description: 一句自然语言指令
          example: 查询 SKU 12 在仓库 3 的库存

    NlCommandResult:
      type: object
      description: NL 调度结果；data 的 shape 由 intent 决定（与对应 REST 接口同源）
      required: [intent, description, write, data]
      properties:
        intent:
          type: string
          enum: [help, query_inventory, list_documents, get_document, inventory_summary,
                 query_master_data, create_purchase_order, create_sales_order]
        description: { type: string, description: 人类可读的结果摘要（含关键数字） }
        write: { type: boolean, description: true = 本次指令产生了写操作 }
        data:
          description: 意图对应的业务数据；读意图通常是 items 或分页对象，写意图是建成的单据
          nullable: true
