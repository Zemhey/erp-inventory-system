<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：让页面延伸到 iPhone 刘海/圆角区域，再由 CSS env(safe-area-inset-*) 留出安全边距 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- 移动端浏览器地址栏随主题变色（浅色暖白 / 深色暖墨，与 theme.css 的 --ys-nuanbai 一致） -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f2ea" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14120f" />
    <!-- 图标与各端统一：母图 design/icon-master.svg，就是工作台侧栏那个织纹方块 -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>进销存系统</title>
    <script>
      // 首屏防闪：在样式表解析前就把主题类打上 <html>。
      // 放到 main.ts 里做会晚一帧 —— 深色用户每次刷新都会先闪一下白底。
      // 约定与 src/stores/theme.ts 一致：erp.theme = 'light' | 'dark'。
      ;(function () {
        try {
          var saved = localStorage.getItem('erp.theme')
          var dark =
            saved === 'dark' ||
            (saved !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            document.documentElement.style.colorScheme = 'dark'
          }
        } catch (e) {
          /* localStorage 不可用时保持浅色 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
