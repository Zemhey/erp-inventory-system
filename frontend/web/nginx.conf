# ════════════════════════════════════════════════════════════════════════════
# 生产 Web 入口（容器内 nginx）
#
# 本文件是一段 **server 块**，被放到：
#   - 官方镜像：/etc/nginx/conf.d/default.conf（官方主配置把 conf.d 放在 http{} 内）
#   - 本机离线垫片：自建等价主配置把 conf.d 放进 http{}，同样加载本文件
# 不使用 map（map 只能出现在 http 级），改用 location 内的 set/if，
# 避免不同基础镜像的 include 层级差异导致配置加载失败。
#
# 职责：
#   1. 托管 Vue 构建产物（/usr/share/nginx/html）
#   2. SPA history 模式 fallback：/purchase-orders → index.html
#   3. /api/ 反代到 backend:8080（保留完整路径，后端映射就是 /api/v1/...）
#   4. 静态资源长缓存；index.html 不缓存（发版后立即生效）
#   5. 两个健康检查：/healthz（web 自身）、/readyz（web + backend + DB）
# ════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;
    client_max_body_size 10m;

    # ── gzip：只压缩文本类；图片/字体本来已压缩，再压反而浪费 CPU ──
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # 基础安全响应头。注意：location 里一旦出现 add_header，会覆盖 server 级
    # add_header 的继承 —— 所以下面的 location 只用 expires，不再写 add_header。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── 健康检查 ──────────────────────────────────────────────────────────
    # 只证明 web 进程活着：不依赖 backend，避免后端故障导致 web 被反复重启
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 整套是否可服务：backend 的 readiness 组包含 DB 连通性；
    # backend 未就绪时返回 503，backend 不可达时由代理层返回 502/504
    location = /readyz {
        access_log off;
        proxy_pass http://backend:8080/actuator/health/readiness;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    # ── API 反代 ──────────────────────────────────────────────────────────
    # proxy_pass 不带 URI：/api/v1/auth/login 原样转发到 backend:8080/api/v1/auth/login
    location /api/ {
        # 宿主 nginx 终止 TLS 时透传真实协议；直连 18080 时退回本层协议。
        # 用 set/if 而非 map，是为了兼容两种基础镜像不同的 include 层级。
        set $erp_forwarded_proto $scheme;
        if ($http_x_forwarded_proto != "") {
            set $erp_forwarded_proto $http_x_forwarded_proto;
        }

        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $erp_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── 静态资源 ──────────────────────────────────────────────────────────
    # Vite 产物带内容 hash，可以长缓存；找不到就是 404，不能 fallback 成 HTML
    location /assets/ {
        try_files $uri =404;
        expires 30d;
    }

    # SPA history fallback；index.html 不缓存，保证发版后立即拿到新资源清单
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
