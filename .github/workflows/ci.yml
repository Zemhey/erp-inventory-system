name: CI

# ════════════════════════════════════════════════════════════════════════════
# 持续集成（docs/06-测试策略.md §6）
#
# 门禁理念：**主干永远绿**。任何 PR 在这条流水线上红了就不许合并。
#
# 触发：
#   - push（含 main 与任意分支）
#   - pull_request
#
# 当前阶段（M0）已实现：
#   ✓ 契约校验（OpenAPI 语法 + 关键约束）
#   ✓ 编译 + 单元/集成测试（Testcontainers 起真 PostgreSQL）
#   ✓ 覆盖率门禁（JaCoCo）
#   ✓ 代码索引漂移校验（gen-index --check）
#
# 后续里程碑接入（见 docs/00 进度看板）：
#   ⬜ 契约 diff（实现导出的 OpenAPI 与契约源比对）
#   ✅ Playwright Web E2E（M2-S6 起为 `web-e2e` job：PG service + 真后端 + 随机口令种子账号，
#      19 条用例 + 登录 setup 全真跑、零 mock。它**不在 `gate` 的 needs 里，且不在 push 事件上运行**——
#      这个 job 从未在真实 runner 上验证过（本泳道不能 push），所以先让它只在 PR / 手动触发时跑：
#      main 的 CI 徽章不会因为一个未验证的 E2E 而变红，PR 上又能拿到真实反馈。
#      连续绿若干轮后，由 S7/M6 决定要不要把它并进 `gate`。）
#   ⬜ Android E2E（reactivecircus/android-emulator-runner）
#   ⬜ 小程序 E2E（需 Windows self-hosted runner，因微信开发者工具依赖 GUI）
#   ⬜ SonarQube / Trivy
# ════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

# 同一分支的新推送取消旧运行，节省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────── 构建与测试 ───────────────────────────
  build-and-test:
    name: 构建 · 测试 · 覆盖率
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('backend/server/**/*.gradle.kts', 'backend/server/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 赋予 gradlew 执行权限
        working-directory: backend/server
        run: chmod +x ./gradlew

      # Linux 上 Docker 已预装，Testcontainers 可直接用默认发现机制
      # （Windows 才需要 DOCKER_HOST / IPv4 override，见 build.gradle.kts）
      - name: 编译
        working-directory: backend/server
        run: ./gradlew compileJava compileTestJava --no-daemon

      - name: 单元与集成测试
        working-directory: backend/server
        run: ./gradlew test --no-daemon

      - name: 覆盖率报告
        if: always()
        working-directory: backend/server
        run: ./gradlew jacocoTestReport jacocoTestCoverageVerification --no-daemon

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/server/build/reports/tests/
            backend/server/build/reports/jacoco/
          retention-days: 14

      - name: 上传测试结果（供失败诊断）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/server/build/test-results/
          retention-days: 14

  # ─────────────────────────── 契约校验 ───────────────────────────
  contract-check:
    name: 契约校验
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装校验工具
        run: pip install pyyaml

      - name: OpenAPI 语法与结构校验
        run: |
          python - <<'PY'
          import sys, yaml

          path = 'packages/api-contract/openapi.yaml'
          with open(path, encoding='utf-8') as f:
              spec = yaml.safe_load(f)

          errors = []
          if not str(spec.get('openapi', '')).startswith('3.'):
              errors.append('openapi 版本必须是 3.x')
          if 'info' not in spec or 'title' not in spec.get('info', {}):
              errors.append('缺少 info.title')
          if 'paths' not in spec or not spec['paths']:
              errors.append('paths 为空')

          ops = 0
          for p, item in (spec.get('paths') or {}).items():
              for method, op in item.items():
                  if method.lower() not in ('get','post','put','patch','delete'):
                      continue
                  ops += 1
                  if 'operationId' not in op:
                      errors.append(f'{method.upper()} {p} 缺少 operationId')
                  if not op.get('responses'):
                      errors.append(f'{method.upper()} {p} 缺少 responses')

          # ★ 契约硬规则：所有写操作必须声明 X-Request-Id 幂等键
          #   （不变量 INV-9 的契约侧保证，见 docs/05-接口契约规范.md）
          ref = '#/components/parameters/RequestId'
          for p, item in (spec.get('paths') or {}).items():
              post = (item or {}).get('post')
              if not post:
                  continue
              params = post.get('parameters') or []
              if not any(pr.get('$ref') == ref for pr in params):
                  errors.append(f'POST {p} 未声明 X-Request-Id 幂等键')

          if errors:
              print('契约校验失败：')
              for e in errors:
                  print('  ✗', e)
              sys.exit(1)

          print(f'✓ 契约校验通过：{ops} 个操作，{len(spec["paths"])} 个路径')
          PY

  # ─────────────────────────── 文档/索引漂移 ───────────────────────────
  #
  # ★ 设计说明（CI 上真实踩过一次坑）：
  #   本 job 的职责是"验证索引与源码一致"，而不是"验证测试通过"
  #   （后者是 build-and-test 的事）。因此它**只校验那部分可由源码唯一确定的产物**：
  #     - modules.md  (扫源码目录)
  #     - api-map.md  (解析 openapi.yaml)
  #     - test-map.md (扫 @CaseId 注解)
  #   这三者不依赖 JDK、不依赖测试运行，任何机器结果都一样。
  #
  #   coverage-map.md 与 deps.json 依赖 JaCoCo 报告 / JDK 依赖树，
  #   属于"运行环境副产品"。gen-index.sh 在缺少前置条件时会**跳过**它们
  #   （而不是写占位内容），从而保证跨环境一致性、不产生假警报。
  index-check:
    name: 代码索引漂移校验
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # gen-index --check 用 git diff 判断漂移，需要完整历史
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 赋予脚本执行权限
        run: chmod +x ./scripts/gen-index.sh

      - name: 重新生成索引并校验是否与提交内容一致
        run: ./scripts/gen-index.sh --check
        env:
          # 明确不依赖 JDK：若脚本想调用 gradle 会自行跳过并打印 ⊘
          SKIP_DEPS_INDEX: '1'

  # ─────────────────────────── Web E2E ───────────────────────────
  #
  # ★ 与本地 `npm run e2e` 完全同一条路径：Playwright 自己起 8081 后端 + 3001 Vite，
  #   连的是 services 里的真 PostgreSQL，Flyway 在空库上跑 V1~V6，**没有任何 mock**。
  #   用例的造数/清理走 psql（e2e/helpers/db.ts 见到 E2E_DATABASE_URL 就从
  #   `docker exec` 换成本机 psql），所以这里要装 postgresql-client。
  #
  # ★ 种子账号是本 job 唯一的"新发明"，也是 M3 当年没接入的原因：
  #   迁移里从不建账号（V1~V5 只种角色与权限），而 `scripts/seed-dev-user.ps1` 是 Windows 脚本。
  #   这里的做法是**用后端自己的编码器**生成哈希：从 bootJar 里抽出
  #   spring-security-crypto + spring-jcl，用 `java Seed.java`（JEP 330 单文件源码模式）
  #   跑 `new BCryptPasswordEncoder(10)` —— 与 PasswordEncoderConfig 逐字相同，
  #   不存在"第三方 bcrypt 与 Spring 是否兼容"这种要靠猜的问题。
  #   口令每次运行随机生成，只写进 $GITHUB_ENV，不落盘、不打印。
  #   （本机已实测：这样生成的哈希登录后返回 roles=[ADMIN]，错误密码仍被拒。）
  web-e2e:
    name: Web E2E（Playwright · 真后端 · PostgreSQL service）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 见文件头：不进 gate，也不在 push 上跑，避免未验证的 job 把 main 弄红
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    # 后端与用例都按东八区算"今天"（本地开发机就是 Asia/Shanghai），
    # 而 runner 默认 UTC；跨日界会让按当天日期造的数与页面默认区间落在不同天上。
    env:
      TZ: Asia/Shanghai

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erp
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          # 与 infra/compose/docker-compose.yml 保持一致：显式指定编码与 locale
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('backend/server/**/*.gradle.kts', 'backend/server/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 赋予 gradlew 执行权限
        working-directory: backend/server
        run: chmod +x ./gradlew

      - name: 构建可执行 jar
        working-directory: backend/server
        run: ./gradlew bootJar --no-daemon

      - name: 安装 psql 客户端（E2E 的建账号与清理要用）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: 安装 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: 安装前端依赖与 Playwright 浏览器
        working-directory: frontend/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # ── 数据库与种子账号 ────────────────────────────────────────────────
      # Playwright 的 webServer 会自己 `java -jar` 起后端，Flyway 在这时建表；
      # 所以这里**先启动一次后端把迁移跑完**，再插账号 —— 否则 app_users 还不存在。
      - name: 先跑迁移（空库启动一次后端后立即关闭）
        working-directory: backend/server
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:5432/erp
          DB_USER: erp
          DB_PASSWORD: erp
          SERVER_PORT: '8089'
        run: |
          set -euo pipefail
          JAR=''
          for f in build/libs/*.jar; do
            case "$f" in *-plain.jar) continue ;; esac
            JAR="$f"
          done
          [ -n "$JAR" ] || { echo '✗ 找不到 bootJar'; exit 1; }
          java -jar "$JAR" > /tmp/e2e-migrate.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fs -m 2 http://127.0.0.1:8089/actuator/health | grep -q '"UP"'; then
              echo "✓ 迁移完成（schema 已建好，Flyway 到 V6）"
              exit 0
            fi
            sleep 2
          done
          echo '✗ 后端 120s 内没有就绪，日志：'
          tail -n 80 /tmp/e2e-migrate.log
          exit 1

      - name: 生成随机口令并用后端自己的编码器写入种子账号
        env:
          DATABASE_URL: postgresql://erp:erp@127.0.0.1:5432/erp
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          # 只有一份 bootJar（-plain.jar 是 Gradle 默认附带的不含依赖产物），排除后取第一个
          JAR=''
          for f in backend/server/build/libs/*.jar; do
            case "$f" in *-plain.jar) continue ;; esac
            JAR="$f"
          done
          [ -n "$JAR" ] || { echo "✗ 找不到 bootJar：backend/server/build/libs 是空的"; exit 1; }
          unzip -j -o -q "$JAR" 'BOOT-INF/lib/spring-security-crypto-*.jar' -d "$WORK"
          unzip -j -o -q "$JAR" 'BOOT-INF/lib/spring-jcl-*.jar' -d "$WORK"
          # Linux 的 classpath 分隔符是冒号（这里别照抄 Windows 的分号）
          CP="$(find "$WORK" -name '*.jar' -print | paste -sd:)"

          cat > "$WORK/Seed.java" <<'JAVA'
          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import org.springframework.security.crypto.bcrypt.BCryptPasswordEncoder;

          /**
           * 与 PasswordEncoderConfig 完全相同的编码器（BCryptPasswordEncoder, strength 10）。
           * 口令从 **stdin** 读，不从 argv 读：进程列表 / shell 历史都可能把它露出来。
           * 只输出哈希，绝不回显口令。
           */
          public class Seed {
              public static void main(String[] args) throws Exception {
                  String password = new String(
                          System.in.readAllBytes(), StandardCharsets.UTF_8).trim();
                  if (password.isEmpty()) {
                      throw new IllegalStateException("no password on stdin");
                  }
                  BCryptPasswordEncoder encoder = new BCryptPasswordEncoder(10);
                  String hash = encoder.encode(password);
                  if (!encoder.matches(password, hash)) {
                      throw new IllegalStateException("self-check failed: matches() returned false");
                  }
                  System.out.println(hash);
              }
          }
          JAVA

          PASSWORD="E2e-ci-$(openssl rand -hex 12)"
          HASH="$(printf '%s' "$PASSWORD" | java -cp "$CP" "$WORK/Seed.java")"
          # 形态校验用真正的 BCrypt 正则。**不要写成 `case "$HASH" in '$2'[aby]*'$'`**：
          # 合法哈希的结尾是哈希字符而不是 `$`，那条判断会把每一个正常哈希都判成失败
          # （本泳道在本地实跑这段脚本时才暴露出来）。
          if [[ ! "$HASH" =~ ^\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53}$ ]]; then
            echo "✗ 未能生成合法的 BCrypt 哈希（长度 ${#HASH}）"
            exit 1
          fi
          echo "✓ 种子账号哈希：${HASH:0:7}…（长度 ${#HASH}；口令本次运行随机生成，不入库、不打印）"

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -c \
            "INSERT INTO app_users (username, password_hash, display_name)
             VALUES ('admin', '$HASH', 'CI Admin')
             ON CONFLICT (username) DO UPDATE SET password_hash = EXCLUDED.password_hash;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -c \
            "INSERT INTO app_user_roles (user_id, role_id)
             SELECT u.id, r.id FROM app_users u, app_roles r
              WHERE u.username = 'admin' AND r.code = 'ADMIN'
             ON CONFLICT DO NOTHING;"
          echo "✓ app_users=$(psql "$DATABASE_URL" -tAc 'SELECT count(*) FROM app_users') admin_roles=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM app_user_roles ur JOIN app_users u ON u.id=ur.user_id JOIN app_roles r ON r.id=ur.role_id WHERE u.username='admin' AND r.code='ADMIN'")"

          echo "E2E_USERNAME=admin" >> "$GITHUB_ENV"
          echo "E2E_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

      - name: Playwright E2E（真后端 · 真库 · 零 mock）
        working-directory: frontend/web
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:5432/erp
          DB_USER: erp
          DB_PASSWORD: erp
          # e2e/helpers/db.ts：有 E2E_DATABASE_URL 就改用本机 psql（否则它会 docker exec erp-postgres）
          E2E_DATABASE_URL: postgresql://erp:erp@127.0.0.1:5432/erp
        # 与本地验收同一条命令；配置里的 reporter 是 list + html（html 供失败时上传）
        run: npm run e2e

      - name: 失败时保留 trace / 截图 / HTML 报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-artifacts
          path: frontend/web/.e2e-artifacts/
          retention-days: 7

  # ─────────────────────────── 汇总门禁 ───────────────────────────
  gate:
    name: 门禁汇总
    needs: [build-and-test, contract-check, index-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 判定
        run: |
          echo "build-and-test : ${{ needs.build-and-test.result }}"
          echo "contract-check : ${{ needs.contract-check.result }}"
          echo "index-check    : ${{ needs.index-check.result }}"
          if [ "${{ needs.build-and-test.result }}" != "success" ] \
             || [ "${{ needs.contract-check.result }}" != "success" ] \
             || [ "${{ needs.index-check.result }}" != "success" ]; then
            echo "✗ 门禁未通过，禁止合并"
            exit 1
          fi
          echo "✓ 全部门禁通过"
