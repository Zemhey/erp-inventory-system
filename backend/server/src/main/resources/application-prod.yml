# ════════════════════════════════════════════════════════════════════════════
# 生产 profile（由 SPRING_PROFILES_ACTIVE=prod 激活）
#
# ★ 本文件可以入库：所有敏感值都是 ${ENV} 占位符，没有任何默认凭据。
#   与 application.yml 的关键区别：这里**不给** DB_URL / DB_USER / DB_PASSWORD /
#   ERP_JWT_SECRET 设默认值。环境变量缺失时 Spring 无法解析占位符，应用直接
#   启动失败 —— 这是刻意的失败关闭（fail-closed），避免生产误用开发默认密钥。
#
# 变量清单与生成方式见 infra/deploy/.env.example 与 infra/deploy/README.md。
# ════════════════════════════════════════════════════════════════════════════
server:
  port: ${SERVER_PORT:8080}
  # 优雅停机：先停止接收新请求，再等在途请求完成
  shutdown: graceful
  # 位于 nginx 之后：让 Spring 正确识别 X-Forwarded-*（协议/Host/客户端 IP）
  forward-headers-strategy: framework

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # 单实例 + 2C4G 服务器，10 个连接足够；PG 默认 max_connections=100
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 10000
      pool-name: erp-pool
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    # 生产禁止 flyway clean（哪怕有人误敲命令）
    clean-disabled: true

# 生产不暴露接口文档与指标明细；健康检查只给状态，不给组件细节
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        # 部署脚本/编排用 readiness：包含 DB 连通性，未就绪返回 503
        readiness:
          include: readinessState,db
        # liveness 只看进程自身，不因 DB 抖动把容器重启
        liveness:
          include: livenessState

erp:
  iam:
    # 无默认值：缺失即启动失败
    jwt-secret: ${ERP_JWT_SECRET}
    token-ttl-minutes: ${TOKEN_TTL_MINUTES:120}
    max-failed-attempts: 5
    lock-minutes: 15
  inventory:
    reservation-ttl-minutes: ${RESERVATION_TTL_MINUTES:30}
    expire-scheduling-enabled: true
    reservation-expire-interval-ms: ${RESERVATION_EXPIRE_INTERVAL_MS:300000}
  settlement:
    allow-unlock-closed-period: false

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.erp: ${LOG_LEVEL_ERP:INFO}
