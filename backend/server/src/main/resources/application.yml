spring:
  application:
    name: erp-server
  datasource:
    # ★ 默认端口 15432 而非 5432：本机 Windows 的保留端口段 5358–5457 覆盖了 5432，
    #   Docker 无法把容器映射到该端口（详见 infra/compose/docker-compose.yml 注释）。
    #   容器内仍是 5432，宿主侧是 15432。
    #   部署到 Linux 服务器时用环境变量覆盖：DB_URL=jdbc:postgresql://localhost:5432/erp
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:15432/erp}
    username: ${DB_USER:erp}
    password: ${DB_PASSWORD:erp}
    hikari:
      maximum-pool-size: 20
      pool-name: erp-pool
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  # 部署时用 SERVER_PORT 覆盖；默认保持本地开发的 8080
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        # ★ V2-5 FR-SYS-09：追加 prometheus（Micrometer 指标端点，契约外但对运维可用）。
        #   health/info/metrics 保持不变，只在此行追加一项，便于多泳道纯追加合并。
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      # 所有指标自动带 application 标签：同一套 Grafana 面板能区分多实例
      application: ${spring.application.name}

# 业务参数（禁止硬编码在代码中）
erp:
  inventory:
    # 预占超时自动释放时长（分钟），BR-INV-05
    reservation-ttl-minutes: 30
    # ★ 预占超时释放的定时任务开关（BR-INV-05），生产保持 true。
    #   false = 整个调度装配（@EnableScheduling + 调度线程）都不注册。
    #   测试侧由 src/test/resources/application-clock.yml 关掉：
    #   @Scheduled 若在断言之前抢先释放预占，用例就会随机红（计划书 §6 坑 9b）。
    expire-scheduling-enabled: true
    # 扫描间隔（毫秒，此处 5 分钟）。只走配置，代码里不写死。
    reservation-expire-interval-ms: 300000
  iam:
    # ★ JWT 签名密钥。生产必须用环境变量覆盖：
    #   ERP_JWT_SECRET=<至少 32 字节的随机串>
    # 默认值仅供本地开发与测试。放入默认值是刻意的权衡：
    #   若这里写空值，新克隆仓库的人第一步就跑不起来；
    #   而把"开发默认值"写死在这里，只要生产环境变量没设置，启动日志里会有告警。
    jwt-secret: ${ERP_JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
    # token 有效期（分钟）
    token-ttl-minutes: 120
    # 密码连续错误多少次后锁定（FR-IAM-01）
    max-failed-attempts: 5
    # 锁定时长（分钟）
    lock-minutes: 15
  settlement:
    # 账期锁账后是否允许财务强制解锁（生产建议 false）
    allow-unlock-closed-period: false
  demo:
    # ★ 演示/回填专用：允许已认证请求用 X-Demo-Biz-Time 指定"业务现在几点"。
    #   默认 false —— 生产配置不打开时，请求头被完全忽略，时钟就是真实系统时间。
    #   打开它才可能让库存流水/应收到期日/成本层落在历史月份上（见 shared.time.DemoClockOverride）。
    #   生产部署务必保持默认：这个能力会让调用方自行决定账目归属期间。
    clock-override-enabled: ${ERP_DEMO_CLOCK_OVERRIDE:false}
  nl:
    # ★ 解析方式 / 复核方式 / 接口地址 / 模型名 / API Key **一律在页面里配**
    #   （系统 → 自然语言 → AI 接入），存在 sys_config 的 nl 组：租户级、密钥加密、保存即生效。
    #   这里刻意不再保留 parser / base-url / api-key / model 的同名 yml 项 ——
    #   两处都能配会让人分不清"我改的到底生效没有"，而且 yml 里的 key 会跟着仓库泄露。
    confirm:
      # 写意图必须带 /nl/plan 签发的回执（X-Nl-Plan-Token）。关掉只用于临时兼容旧调用方。
      required: ${ERP_NL_CONFIRM_REQUIRED:true}
      # 回执签名密钥。**多实例部署必须配置同一个值**，否则 A 签的回执在 B 上会被判伪造。
      # 留空则进程启动随机生成（单机开发够用，重启后旧回执自动失效）。
      secret: ${ERP_NL_CONFIRM_SECRET:}
      ttl-seconds: 300
    # 页面里配置的 API Key 在落库前用它加密（AES-256-GCM）。
    # 留空 → 退化为内置常量派生的密钥：只能挡住"直接翻库看到明文"，不算真安全。
    # 生产必须显式设置；**多实例必须一致**，否则 A 实例存的 key 在 B 实例上解不开。
    secret: ${ERP_NL_SECRET:}
    openai:
      # 只剩超时：它不是业务参数，而是"等多久算超时"的运行时约束，放配置里更合适。
      timeout-seconds: ${ERP_NL_TIMEOUT:30}

logging:
  level:
    root: INFO
    com.erp: DEBUG
  pattern:
    # ★ traceId 贯穿日志：测试失败时可直接用它捞日志（docs/06-测试策略.md）
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
