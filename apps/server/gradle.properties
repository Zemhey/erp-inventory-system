# ─────────────────────────────────────────────────────────────────────────────
# Gradle 构建配置
#
# ★ 中文路径兼容（Windows）
#
# 问题：Gradle 在 Windows 上构造交给 test worker 的 classpath 字符串时，
# 使用系统 ANSI 代码页（本机为 936/GBK）。当项目路径含中文（本仓库路径含「自选」）
# 时，该字符串与 JVM 以 UTF-8 解析类文件的方式不一致，导致所有测试类
# 报 ClassNotFoundException —— 报错信息看起来像"类没编译"，极具误导性。
#
# 解决：让 **Gradle 守护进程本身** 以 UTF-8 运行（它才是构造 classpath 的一方）。
# file.encoding 控制默认字符集，sun.jnu.encoding 控制文件/路径名编码 —— 两者缺一不可。
# 仅在 Test 任务上设 jvmArgs 无效，因为问题发生在守护进程侧。
# ─────────────────────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8

# 并行构建（单人项目提速）
org.gradle.parallel=true
org.gradle.caching=true

# 统一源码编码
org.gradle.daemon=true
