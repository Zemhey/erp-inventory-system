spring:
  application:
    name: erp-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erp}
    username: ${DB_USER:erp}
    password: ${DB_PASSWORD:erp}
    hikari:
      maximum-pool-size: 20
      pool-name: erp-pool
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# 业务参数（禁止硬编码在代码中）
erp:
  inventory:
    # 预占超时自动释放时长（分钟），BR-INV-05
    reservation-ttl-minutes: 30
  settlement:
    # 账期锁账后是否允许财务强制解锁（生产建议 false）
    allow-unlock-closed-period: false

logging:
  level:
    root: INFO
    com.erp: DEBUG
  pattern:
    # ★ traceId 贯穿日志：测试失败时可直接用它捞日志（docs/06-测试策略.md）
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
